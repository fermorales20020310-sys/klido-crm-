<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klido Bandeja</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;height:100vh}
.lista{width:350px;background:#181818;border-right:1px solid #333;overflow:auto}
.chat{padding:14px;border-bottom:1px solid #222;cursor:pointer}
.chat:hover{background:#222}
.chat b{color:#25D366}
.msgs{flex:1;display:flex;flex-direction:column}
.mensajes{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:65%;font-size:15px}
.cliente{background:#2a2a2a;align-self:flex-start}
.yo{background:#25D366;color:#000;align-self:flex-end}
.input{display:flex;padding:12px;border-top:1px solid #333;background:#181818}
#txt{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
#btn{margin-left:10px;padding:12px 20px;background:#25D366;border:none;border-radius:20px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="lista" id="lista"><p style="padding:20px">Cargando chats...</p></div>
<div class="msgs">
<div class="mensajes" id="mensajes"><p>Selecciona un chat a la izquierda</p></div>
<div class="input"><input id="txt" placeholder="Escribe un mensaje..."><button id="btn" onclick="enviar()">Enviar</button></div>
</div>
<script>
let chats=[], actual=null;
async function cargar(){
  try{
    let r=await fetch('/api/chats');
    chats=await r.json();
    let h='';
    if(chats.length==0){document.getElementById('lista').innerHTML='<p style="padding:20px">No hay chats aún. Mándate un WhatsApp de prueba.</p>';return;}
    chats.forEach(c=>{
      let ultimo=c.msgs[c.msgs.length-1]?.text||'';
      h+=`<div class="chat" onclick="abrir('${c.tel}')"><b>${c.nombre}</b><br><small>${c.tel}</small><br><small style="color:#aaa">${ultimo.slice(0,30)}</small></div>`;
    });
    document.getElementById('lista').innerHTML=h;
  }catch(e){document.getElementById('lista').innerHTML='Error cargando: '+e}
}
function abrir(tel){
  actual=tel;
  let c=chats.find(x=>x.tel==tel);
  if(!c)return;
  let h='';
  c.msgs.forEach(m=>{
    h+=`<div class="msg ${m.from}"><small style="font-size:11px;opacity:.7">${m.time||''}</small><br>${m.text}</div>`;
  });
  document.getElementById('mensajes').innerHTML=h;
  document.getElementById('mensajes').scrollTop=999999;
}
async function enviar(){
  let text=document.getElementById('txt').value;
  if(!text||!actual)return;
  document.getElementById('txt').value='';
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:actual,text})});
  cargar();
  setTimeout(()=>abrir(actual),500);
}
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key=='Enter')enviar()});
setInterval(cargar,3000);
cargar();
</script>
</body>
</html>
