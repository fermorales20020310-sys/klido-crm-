<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bandeja</title>
<style>
body{margin:0;font-family:sans-serif;display:flex;height:100vh}
.sidebar{width:300px;border-right:1px solid #ddd;display:flex;flex-direction:column}
.lista{flex:1;overflow-y:auto}
.chat-item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.chat-item:hover{background:#f5f5f5}
.chat-item b{display:block}
.main{flex:1;display:flex;flex-direction:column;background:#e5ddd5}
.mensajes{flex:1;padding:20px;overflow-y:auto}
.burbuja{background:white;padding:8px 12px;border-radius:8px;margin:5px 0;max-width:70%}
.burbuja.enviado{background:#dcf8c6;margin-left:auto}
.input-area{display:flex;padding:10px;background:white;gap:10px}
.input-area input{flex:1;padding:12px;border-radius:20px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="sidebar">
  <div style="padding:10px;background:#0b5ed7;color:white;font-weight:bold">KLIDO AVANZA - Bandeja</div>
  <div id="lista" class="lista">Cargando...</div>
</div>
<div class="main">
  <div id="header" style="padding:15px;background:white;border-bottom:1px solid #ddd;font-weight:bold">Selecciona un chat</div>
  <div id="mensajes" class="mensajes"></div>
  <div class="input-area">
    <input id="texto" placeholder="Escribe...">
    <button onclick="enviar()" style="background:#0b141a;color:white;border:none;padding:10px 20px;border-radius:20px;cursor:pointer">Enviar</button>
  </div>
</div>

<script>
let telefonoActual = null;
async function cargarContactos(){
  const r = await fetch('/api/contacts');
  const contactos = await r.json();
  const lista = document.getElementById('lista');
  if(contactos.length===0){ lista.innerHTML='<div style="padding:20px;color:#888">No hay chats. Escríbete a tu número para probar.</div>'; return; }
  lista.innerHTML = contactos.map(c => `
    <div class="chat-item" onclick="abrirChat('${c.telefono}')">
      <b>${c.nombre || c.telefono}</b>
      <small>${c.telefono}</small>
    </div>
  `).join('');
}
async function abrirChat(tel){
  telefonoActual = tel;
  document.getElementById('header').innerText = tel;
  const r = await fetch('/api/messages/'+tel);
  const msgs = await r.json();
  const cont = document.getElementById('mensajes');
  cont.innerHTML = msgs.map(m => `
    <div class="burbuja ${m.tipo==='enviado'?'enviado':''}">
      ${m.texto}<br><small style="font-size:10px;color:#888">${new Date(m.fecha).toLocaleString()}</small>
    </div>
  `).join('');
  cont.scrollTop = cont.scrollHeight;
}
async function enviar(){
  const txt = document.getElementById('texto').value;
  if(!txt || !telefonoActual) return;
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:telefonoActual,texto:txt})});
  document.getElementById('texto').value='';
  abrirChat(telefonoActual);
}
cargarContactos();
setInterval(cargarContactos, 5000);
</script>
</body>
</html>
