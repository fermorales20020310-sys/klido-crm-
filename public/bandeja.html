<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KLIDO AVANZA</title>
<style>
body{margin:0;font-family:Arial;display:flex;flex-direction:column;height:100vh}
.top{height:60px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.left{width:300px;border-right:1px solid #ddd;overflow-y:auto}
.contact{padding:10px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;cursor:pointer}
.contact.active{background:#e8f0fe}
.tag{font-size:10px;background:#fff3cd;padding:2px 6px;border-radius:10px}
.hot-dot{width:10px;height:10px;background:red;border-radius:50%;display:inline-block}
.unread{background:red;color:white;border-radius:50%;padding:2px 7px;font-size:12px;margin-left:6px}
.tabs{display:flex;gap:8px;padding:10px;border-bottom:1px solid #ddd}
.tab{padding:6px 12px;border-radius:20px;border:1px solid #ddd;cursor:pointer}
.tab.active{background:#0d6efd;color:white}
.main{display:flex;flex:1;overflow:hidden}
.chat{flex:1;display:flex;flex-direction:column;background:#f5f7fb}
#msgs{flex:1;overflow-y:auto;padding:15px}
.msg{padding:8px 12px;border-radius:12px;margin:5px;max-width:70%}
.me{background:#0d6efd;color:white;align-self:flex-end}
.client{background:white;align-self:flex-start}
.bar{padding:10px;display:flex;gap:8px;background:white}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;align-items:center;gap:10px"><img src="https://i.imgur.com/8Km9tLL.png" height="35"><div><b>KLIDO AVANZA</b><br><small>API 2000/dia - Tiempo real</small></div></div>
<div><button style="background:#0d6efd;color:white;border:none;padding:8px 14px;border-radius:8px">+ Campaña</button> <button>Salir</button></div>
</div>
<div class="tabs">
<div class="tab active" onclick="filter='all';render()" id="t-all">Todos (0)</div>
<div class="tab" onclick="filter='camp';render()" id="t-camp">🟧 Campaña (0)</div>
<div class="tab" onclick="filter='hot';render()" id="t-hot">🔥 Hot (0)</div>
<div style="margin-left:auto"><button>Exportar</button></div>
</div>
<div class="main">
<div class="left" id="list"></div>
<div class="chat">
<div id="msgs"></div>
<div class="bar"><input id="input" placeholder="Responder..." style="flex:1;padding:10px;border-radius:20px;border:1px solid #ddd"><button onclick="send()" style="background:#0d6efd;color:white;border:none;width:38px;height:38px;border-radius:50%">↑</button></div>
</div>
</div>
<script>
let contacts=[], filter='all', current=null;
async function load(){
  let r=await fetch('/api/contacts'); contacts=await r.json(); render();
}
function render(){
  let list=document.getElementById('list'); list.innerHTML='';
  let filtered=contacts;
  if(filter==='hot') filtered=contacts.filter(c=>c.hot);
  if(filter==='camp') filtered=contacts.filter(c=>c.tag==='alion_co' || c.lastMessage?.includes('[alion'));
  filtered.forEach(c=>{
    let div=document.createElement('div'); div.className='contact'+(current===c.wa_id?' active':'');
    div.innerHTML=`<img src="https://i.imgur.com/8Km9tLL.png" height="30"><div><b>${c.wa_id}</b><br><small>${c.lastMessage?.substring(0,20)}</small></div><div style="margin-left:auto">${c.unread>0?`<span class="unread">${c.unread}</span><span class="hot-dot"></span>`:''}</div><span class="tag">${c.tag||'alion_co'}</span>`;
    div.onclick=()=>openChat(c.wa_id); list.appendChild(div);
  });
  document.getElementById('t-all').innerText=`Todos (${contacts.length})`;
  document.getElementById('t-camp').innerText=`🟧 Campaña (${contacts.filter(c=>c.tag==='alion_co').length})`;
  document.getElementById('t-hot').innerText=`🔥 Hot (${contacts.filter(c=>c.hot).length})`;
  document.getElementById('t-all').className='tab'+(filter==='all'?' active':'');
  document.getElementById('t-camp').className='tab'+(filter==='camp'?' active':'');
  document.getElementById('t-hot').className='tab'+(filter==='hot'?' active':'');
}
async function openChat(wa_id){
  current=wa_id;
  let r=await fetch('/api/messages/'+wa_id); let msgs=await r.json();
  let box=document.getElementById('msgs'); box.innerHTML='';
  msgs.forEach(m=>{ let d=document.createElement('div'); d.className='msg '+(m.from==='me'?'me':'client'); d.innerText=m.text; box.appendChild(d); });
  render(); // quita punto rojo pero sigue en Hot
}
async function send(){
  let txt=document.getElementById('input').value; if(!txt||!current) return;
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:current,text:txt})});
  document.getElementById('input').value=''; openChat(current); load();
}
setInterval(load,3000); load();
</script>
</body>
</html>
