<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandeja KLIDO</title><style>body{font-family:Inter,sans-serif;margin:0;display:flex;height:100vh}.left{width:35%;border-right:1px solid #ddd;overflow:auto}.right{width:65%;display:flex;flex-direction:column}.chat{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.chat.active{background:#f0f0ff}.chat b{display:block}.msgs{flex:1;padding:20px;overflow:auto;background:#f5f7fb}.bubble{padding:10px 14px;border-radius:12px;margin:6px 0;max-width:70%}.yo{background:#6c5ce7;color:#fff;margin-left:auto}.cliente{background:#fff}.box{display:flex;padding:10px;border-top:1px solid #ddd}.box input{flex:1;padding:12px;border-radius:8px;border:1px solid #ddd}.box button{padding:12px 18px;background:#6c5ce7;color:#fff;border:none;border-radius:8px;margin-left:8px}</style></head><body>
<div class="left"><div style="padding:16px;background:#6c5ce7;color:#fff"><b>📥 BANDEJA KLIDO - Respuestas Reales</b><br><small id="total">0 conversaciones</small></div><div id="list"></div></div>
<div class="right"><div id="header" style="padding:16px;border-bottom:1px solid #ddd"><b>Selecciona un chat</b></div><div class="msgs" id="msgs"></div><div class="box"><input id="input" placeholder="Escribe respuesta..."><button id="send">Enviar</button></div></div>
<script>
let all=[], active=null;
async function load(){ const r=await fetch('/api/chats'); all=await r.json(); document.getElementById('total').innerText=all.length+' conversaciones'; document.getElementById('list').innerHTML=all.map(c=>`<div class="chat ${active?.tel==c.tel?'active':''}" onclick="openChat('${c.tel}')"><b>${c.nombre} ${c.unread?`(${c.unread})`:''}</b><small>${c.tel} - ${c.msgs[c.msgs.length-1]?.text.slice(0,40)}</small></div>`).join(''); }
function openChat(tel){ active=all.find(x=>x.tel==tel); document.getElementById('header').innerHTML=`<b>${active.nombre}</b> - ${active.tel}`; render(); fetch('/api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tel})}); }
function render(){ document.getElementById('msgs').innerHTML=active.msgs.map(m=>`<div class="bubble ${m.from}">${m.text}<br><small>${m.time}</small></div>`).join(''); document.getElementById('msgs').scrollTop=99999; }
document.getElementById('send').onclick=async()=>{ const t=document.getElementById('input').value; if(!t||!active) return; await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:active.tel, message:t})}); active.msgs.push({from:'yo', text:t, time: new Date().toLocaleString()}); document.getElementById('input').value=''; render(); };
setInterval(load,3000); load();
</script></body></html>
