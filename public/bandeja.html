<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO - Bandeja</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:#f1f5f9}
.left{width:380px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column}
.header{height:60px;background:#0f172a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff}
.header img{height:28px;background:#fff;border-radius:6px;padding:2px}
.btn-camp{background:#3b82f6;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:6px;padding:10px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.tab{flex:1;padding:8px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:600;font-size:12px}
.tab.active{background:#0f172a;color:#fff}
.contact{padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.contact:hover{background:#f8fafc}
.badge-yellow{background:#fef08a;color:#854d0e;border:1px solid #facc15;font-size:10px;padding:3px 8px;border-radius:99px;font-weight:700}
.dot-red{width:10px;height:10px;background:#ef4444;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px #fee2e2}
.right{flex:1;display:flex;flex-direction:column}
.top-chat{height:60px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.msgs{flex:1;overflow:auto;padding:20px;background:#eef2ff}
.bubble{max-width:68%;padding:11px 14px;border-radius:16px;margin:6px 0;font-size:13.5px;line-height:1.4}
.me{margin-left:auto;background:#0f172a;color:#fff;border-bottom-right-radius:4px}
.client{background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:4px;color:#0f172a}
.input-bar{padding:12px;background:#fff;border-top:1px solid #e2e8f0;display:flex;gap:8px}
</style>
</head>
<body>
<script>if(!localStorage.getItem('klido_auth'))location.href='/';</script>
<div class="left">
<div class="header"><div style="display:flex;gap:8px;align-items:center"><img src="logo.png"><b>KLIDO AVANZA</b></div><button class="btn-camp" onclick="location.href='/campanas'">+ Campaña</button></div>
<div class="tabs"><button id="tHoy" class="tab active" onclick="setFilter('hoy')">HOY <span id="cHoy"></span></button><button id="tAll" class="tab" onclick="setFilter('all')">Bandeja</button></div>
<div id="list" style="flex:1;overflow:auto"></div>
</div>
<div class="right">
<div class="top-chat"><b id="cname">Selecciona un chat</b><button onclick="localStorage.clear();location.href='/'" style="border:1px solid #e2e8f0;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer">Salir</button></div>
<div id="msgs" class="msgs"><div style="text-align:center;margin-top:100px;color:#64748b">Tus mensajes nuevos llegan aquí con punto rojo 🔴. Al responder pasan a bandeja normal.</div></div>
<div class="input-bar"><input id="txt" style="flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:10px" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()" style="background:#3b82f6;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer">Enviar</button></div>
</div>
<script>
let filter='hoy';let sel=null;
function setFilter(f){filter=f;document.getElementById('tHoy').className=f==='hoy'?'tab active':'tab';document.getElementById('tAll').className=f==='all'?'tab active':'tab';load();}
async function load(){
let r=await fetch('/api/contacts');let cs=await r.json();
let hoyCount=cs.filter(c=>c.hot).length;document.getElementById('cHoy').innerText=hoyCount?`(${hoyCount})`:'';
let filtered=filter==='hoy'?cs.filter(c=>c.hot):cs;
filtered.sort((a,b)=>(b.lastTimestamp||0)-(a.lastTimestamp||0));
document.getElementById('list').innerHTML=filtered.length?filtered.map(c=>{
let yellow=c.fromCampaign||c.campaignName||c.tag?.includes('alion');
let tag=yellow?`<span class=badge-yellow>Escribió por campaña: ${c.campaignName||c.tag||'alion_co'}</span>`:'';
let dot=c.hot?`<span class=dot-red></span>`:''; 
return `<div class=contact onclick="openChat('${c.wa_id}')"><div style="flex:1"><div style="display:flex;gap:6px;align-items:center"><b>${c.name||c.wa_id}</b>${dot}</div><div style="margin-top:4px">${tag}</div><div style="color:#64748b;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px">${c.lastMessage||''}</div></div><small style="color:#ef4444;font-weight:700">${c.unread||''}</small></div>`;
}).join(''):`<div style="padding:20px;color:#94a3b8;text-align:center">No hay chats en ${filter==='hoy'?'HOY': 'bandeja'}</div>`;
}
async function openChat(id){
sel=id;let r=await fetch('/api/contacts');let cs=await r.json();let c=cs.find(x=>x.wa_id===id);
document.getElementById('cname').innerHTML=`${c.name} ${c.fromCampaign?`<span class=badge-yellow style=margin-left:8px>Escribió por campaña: ${c.campaignName||''}</span>`:''}`;
let m=await (await fetch('/api/messages/'+id)).json();
document.getElementById('msgs').innerHTML=m.map(x=>`<div class="bubble ${x.from==='me'?'me':'client'}">${x.text}</div>`).join('');
document.getElementById('msgs').scrollTop=99999;
}
async function send(){
let t=document.getElementById('txt').value;if(!t||!sel)return;
await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:sel,text:t})});
document.getElementById('txt').value='';openChat(sel);load();
}
setInterval(load,2500);load();
</script>
</body>
</html>
