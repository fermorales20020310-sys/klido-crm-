<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO AVANZA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f6f7fb;height:100vh;display:flex;flex-direction:column}
.header{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.filters{height:56px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:8px;padding:0 20px}
.pill{padding:6px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
.pill.active{background:#111827;color:#fff;border-color:#111827}
.dot{width:8px;height:8px;background:#ef4444;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.layout{display:flex;flex:1;overflow:hidden}
.list{width:360px;background:#fff;border-right:1px solid #e5e7eb;overflow:auto}
.item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.item:hover{background:#f9fafb}
.item.active{background:#eef2ff}
.item.yellow{background:#fffbeb;border-left:4px solid #f59e0b}
.avatar{width:40px;height:40px;border-radius:10px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar img{width:28px;height:28px;object-fit:contain}
.meta{flex:1;min-width:0}
.name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;background:#ffedd5;color:#c2410c;padding:2px 6px;border-radius:4px;font-weight:700}
.num{font-size:11px;color:#6b7280;margin-top:1px}
.last{font-size:12px;color:#374151;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.unread{background:#ef4444;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px;display:flex;align-items:center;gap:4px}
.chat{flex:1;display:flex;flex-direction:column;background:#f1f5f9}
.msgs{flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:62%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.me{background:#2563eb;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.client{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.bar{height:64px;background:#fff;border-top:1px solid #e5e7eb;display:flex;align-items:center;gap:10px;padding:0 16px}
.bar input{flex:1;padding:12px 18px;border-radius:999px;border:1px solid #e5e7eb;outline:none}
.bar button{width:42px;height:42px;border-radius:50%;border:none;background:#111827;color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:12px">
<img src="/logo.png" style="height:38px;width:38px;object-fit:contain" onerror="this.style.display='none'">
<div><div style="font-weight:700;letter-spacing:.2px">KLIDO AVANZA</div><div style="font-size:11px;color:#6b7280">API 2000/día · Tiempo real</div></div>
</div>
<button onclick="location.href='/campanas'" style="background:#111827;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer">+ Campaña</button>
</div>

<div class="filters">
<div class="pill active" id="p-all" onclick="setF('all')">Todos (<span id="n-all">0</span>)</div>
<div class="pill" id="p-camp" onclick="setF('camp')">🟧 Campaña (<span id="n-camp">0</span>)</div>
<div class="pill" id="p-hot" onclick="setF('hot')">🔥 Hot (<span id="n-hot">0</span>) <span id="hdot" style="display:none"><span class="dot"></span></span></div>
<input id="q" placeholder="🔍 Buscar contacto o número..." style="margin-left:auto;padding:7px 14px;border-radius:999px;border:1px solid #e5e7eb;width:220px;font-size:13px" oninput="render()">
<button onclick="location.href='/api/export'" style="margin-left:8px;padding:7px 12px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:13px">Exportar</button>
</div>

<div class="layout">
<div class="list" id="list"></div>
<div class="chat">
<div class="msgs" id="msgs">
<div style="margin:auto;background:#fff;padding:28px;border-radius:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.05)">
<img src="/logo.png" style="height:56px;object-fit:contain;margin-bottom:12px" onerror="this.style.display='none'">
<div style="font-weight:700">Bandeja lista para tiempo real</div>
<div style="font-size:12px;color:#6b7280;margin-top:6px">Amarillo = viene de campaña<br>Hot = mensaje nuevo con puntico rojo<br>Respondes → pasa a bandeja general</div>
</div>
</div>
<div class="bar">
<input id="txt" placeholder="Responder..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">↑</button>
</div>
</div>
</div>

<script>
let contacts=[],filter='all',cur=null;
function setF(f){filter=f;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));document.getElementById('p-'+f).classList.add('active');render();}
async function load(){
 let r=await fetch('/api/contacts'); contacts=await r.json();
 let q=document.getElementById('q').value.toLowerCase();
 if(q) contacts=contacts.filter(c=>c.wa_id.includes(q)||(c.name||'').toLowerCase().includes(q));
 document.getElementById('n-all').innerText=contacts.length;
 document.getElementById('n-camp').innerText=contacts.filter(c=>c.tag==='alion_co'||c.fromCampaign).length;
 let h=contacts.filter(c=>c.hot).length;
 document.getElementById('n-hot').innerText=h;
 document.getElementById('hdot').style.display=h>0?'inline-block':'none';
 render();
}
function render(){
 let f=contacts;
 if(filter==='hot') f=contacts.filter(c=>c.hot);
 if(filter==='camp') f=contacts.filter(c=>c.tag==='alion_co'||c.fromCampaign);
 document.getElementById('list').innerHTML=f.map(c=>{
  let y=c.fromCampaign||c.tag==='alion_co';
  return `<div class="item ${cur===c.wa_id?'active':''} ${y?'yellow':''}" onclick="openChat('${c.wa_id}')">
   <div class="avatar"><img src="/logo.png" onerror="this.parentElement.innerHTML='👤'"></div>
   <div class="meta"><div class="name">${c.name||c.wa_id}${y?'<span class=tag>alion_co</span>':''}</div><div class="num">${c.wa_id}</div><div class="last">${c.lastMessage||''}</div></div>
   <div class="right">${c.unread>0?`<div class=unread><span class=dot></span>${c.unread}</div>`:''}<div style="font-size:10px;color:#9ca3af">${c.fromCampaign?c.campaignName||'':''}</div></div>
  </div>`;
 }).join('')||'<div style="padding:30px;text-align:center;color:#9ca3af;font-size:13px">Sin mensajes</div>';
}
async function openChat(id){
 cur=id;
 let r=await fetch('/api/messages/'+id); let m=await r.json();
 document.getElementById('msgs').innerHTML=m.map(x=>`<div class="bubble ${x.from==='me'?'me':'client'}">${x.text}</div>`).join('');
 render();
}
async function send(){
 let t=document.getElementById('txt').value.trim(); if(!t||!cur)return;
 await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:cur,text:t})});
 document.getElementById('txt').value=''; openChat(cur); setTimeout(load,600);
}
setInterval(load,2000); load();
</script>
</body>
</html>
