<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO Bandeja</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');*{font-family:Inter}body{margin:0;display:flex;height:100vh;background:#f6f7fb}.left{width:360px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #e5e7eb}.item{padding:12px;border-bottom:1px solid #f3f4f6;cursor:pointer;display:flex;justify-content:space-between}.tag{font-size:10px;padding:2px 6px;border-radius:99px;font-weight:700}.hot{width:8px;height:8px;background:#ef4444;border-radius:50%;display:inline-block}.right{flex:1;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:16px;background:#f9fafb}.bubble{max-width:70%;padding:10px 14px;border-radius:14px;margin:6px 0;font-size:13px}.me{margin-left:auto;background:#111827;color:#fff}.client{background:#fff;border:1px solid #e5e7eb}</style></head><body><script>if(!localStorage.getItem('klido_auth'))location.href='/';</script><div class="left"><div class="top"><div style="display:flex;align-items:center;gap:8px"><img src="logo.png" style="height:32px"><b>KLIDO</b></div><button onclick="location.href='/campanas'" style="background:#111827;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:700">+ Campaña</button></div><div id="list"></div></div><div class="right"><div class="top"><span id="cname">Selecciona chat</span><button onclick="localStorage.clear();location.href='/'" style="border:1px solid #e5e7eb;background:#fff;padding:6px 10px;border-radius:6px;cursor:pointer">Salir</button></div><div id="msgs" class="msgs"></div><div style="padding:12px;background:#fff;border-top:1px solid #e5e7eb;display:flex;gap:8px"><input id="txt" style="flex:1;padding:10px;border:1px solid #e5e7eb;border-radius:8px" placeholder="Escribe..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()" style="background:#111827;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer">Enviar</button></div></div><script>let sel=null;async function load(){let r=await fetch('/api/contacts');let cs=await r.json();document.getElementById('list').innerHTML=cs.map(c=>{let col=c.tag?.includes('alion')||c.campaignName?.includes('alion')?'background:#fef08a;color:#854d0e;border:1px solid #facc15':'background:#dbeafe;color:#1e40af;border:1px solid #93c5fd';let t=c.tag||c.campaignName||'';let hot=c.hot?'<span class=hot></span>':'';return `<div class=item onclick="openChat('${c.wa_id}')"><div><b>${c.name}</b> ${hot}<br><small style="${t?col:''}" class=tag>${t}</small><br><small style="color:#6b7280">${c.lastMessage?.slice(0,30)||''}</small></div><small>${c.unread||0>0?c.unread:''}</small></div>`}).join('');}async function openChat(id){sel=id;let r=await fetch('/api/contacts');let cs=await r.json();let c=cs.find(x=>x.wa_id===id);document.getElementById('cname').innerText=c.name+' '+(c.campaignName||'');let m=await (await fetch('/api/messages/'+id)).json();document.getElementById('msgs').innerHTML=m.map(x=>`<div class="bubble ${x.from==='me'?'me':'client'}">${x.text}</div>`).join('');}async function send(){let t=document.getElementById('txt').value;if(!t||!sel)return;await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:sel,text:t})});document.getElementById('txt').value='';openChat(sel);}setInterval(load,3000);load();</script></body></html>
