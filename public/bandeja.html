<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO AVANZA - CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',Arial,sans-serif;box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#f8fafc}
.top{height:68px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.tabs{padding:12px 20px;background:white;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;align-items:center}
.tab{padding:7px 16px;border-radius:20px;border:1px solid #e5e7eb;background:white;cursor:pointer;font-size:13px;font-weight:600;transition:all.2s}
.tab.active{background:#2563eb;color:white;border-color:#2563eb}
.main{display:flex;flex:1;overflow:hidden}
.left{width:360px;background:white;border-right:1px solid #e5e7eb;overflow-y:auto}
.contact{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;gap:12px;cursor:pointer;transition:background.15s}
.contact:hover{background:#f8fafc}
.contact.active{background:#eff6ff}
.contact.yellow{background:#fffbeb;border-left:4px solid #f59e0b}
.badge{font-size:11px;background:#f97316;color:white;padding:2px 6px;border-radius:4px;margin-left:6px}
.dot{width:10px;height:10px;background:#ef4444;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.chat{flex:1;display:flex;flex-direction:column;background:#eef2ff}
.msgs{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.bubble{padding:10px 14px;border-radius:18px;max-width:68%;font-size:14px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.me{background:#2563eb;color:white;align-self:flex-end;border-bottom-right-radius:6px}
.client{background:white;align-self:flex-start;border-bottom-left-radius:6px}
.inputBar{padding:12px 20px;background:white;border-top:1px solid #e5e7eb;display:flex;gap:10px}
.inputBar input{flex:1;padding:13px 18px;border-radius:24px;border:1px solid #e5e7eb;outline:none}
.btn{border:none;cursor:pointer;border-radius:8px;padding:9px 16px;font-weight:600}
.btn-primary{background:#2563eb;color:white}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;align-items:center;gap:14px">
<img src="/logo.png" style="height:42px;width:auto">
<div><div style="font-weight:700;font-size:15px">KLIDO AVANZA</div><div style="font-size:11px;color:#64748b">API 2000/día · Tiempo real · Meta Partner</div></div>
</div>
<div style="display:flex;gap:8px;align-items:center">
<div style="font-size:11px;color:#64748b;text-align:right">Flujo activo<br><span style="color:#16a34a">● En vivo</span></div>
<button class="btn btn-primary" onclick="location.href='/campanas'">+ Campaña</button>
</div>
</div>
<div class="tabs">
<div class="tab active" id="t-all" onclick="setFilter('all')">Todos (<span id="c-all">0</span>)</div>
<div class="tab" id="t-camp" onclick="setFilter('camp')">🟧 Campaña (<span id="c-camp">0</span>)</div>
<div class="tab" id="t-hot" onclick="setFilter('hot')">🔥 Hot (<span id="c-hot">0</span>) <span id="hot-dot" style="display:none"><span class="dot"></span></span></div>
<div style="margin-left:auto;display:flex;gap:8px">
<input id="search" placeholder="Buscar..." oninput="render()" style="padding:7px 12px;border-radius:20px;border:1px solid #e5e7eb;font-size:13px">
<button class="btn" style="border:1px solid #e5e7eb;background:white" onclick="window.open('/api/export','_blank')">Exportar</button>
</div>
</div>
<div class="main">
<div class="left" id="list"></div>
<div class="chat">
<div class="msgs" id="msgs">
<div style="margin:auto;text-align:center;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);max-width:420px">
<img src="/logo.png" style="height:60px;margin-bottom:16px">
<div style="font-weight:700;font-size:16px;margin-bottom:8px">Flujo que pediste activo</div>
<div style="font-size:13px;color:#64748b;line-height:1.5">Lees un lead amarillo → sale de Hot pero conserva etiqueta amarilla en Todos.<br>Respondes → sale de Hot definitivo y pasa a bandeja general.</div>
</div>
</div>
<div class="inputBar">
<input id="input" placeholder="Responder..." onkeydown="if(event.key==='Enter')send()">
<button class="btn btn-primary" style="width:44px;height:44px;border-radius:50%;font-size:18px" onclick="send()">↑</button>
</div>
</div>
</div>
<script>
let contacts=[], filter='all', current=null;
function setFilter(f){ filter=f; document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); document.getElementById('t-'+f).classList.add('active'); render(); }
async function load(){
  try{
    let r=await fetch('/api/contacts'); contacts=await r.json();
    let q=(document.getElementById('search').value||'').toLowerCase();
    if(q) contacts=contacts.filter(c=>c.wa_id.includes(q)||(c.name||'').toLowerCase().includes(q));
    document.getElementById('c-all').innerText=contacts.length;
    document.getElementById('c-camp').innerText=contacts.filter(c=>c.tag==='alion_co'||c.fromCampaign).length;
    let hot=contacts.filter(c=>c.hot).length;
    document.getElementById('c-hot').innerText=hot;
    document.getElementById('hot-dot').style.display=hot>0?'inline-block':'none';
    render();
  }catch(e){}
}
function render(){
  let filtered=contacts;
  if(filter==='hot') filtered=contacts.filter(c=>c.hot);
  if(filter==='camp') filtered=contacts.filter(c=>c.tag==='alion_co'||c.fromCampaign);
  document.getElementById('list').innerHTML=filtered.map(c=>{
    const isYellow=c.fromCampaign||c.tag==='alion_co';
    return `<div class="contact ${current===c.wa_id?'active':''} ${isYellow?'yellow':''}" onclick="openChat('${c.wa_id}')">
      <img src="/logo.png" style="width:36px;height:36px;object-fit:contain;border-radius:8px;background:white;border:1px solid #f1f5f9">
      <div style="flex:1;min-width:0"><div style="display:flex;align-items:center"><b style="font-size:13px">${c.name||c.wa_id}</b>${isYellow?'<span class="badge">alion_co</span>':''}</div><div style="font-size:11px;color:#64748b">${c.wa_id}</div><div style="font-size:12px;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${c.lastMessage||''}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${c.unread>0?`<span style="background:#ef4444;color:white;border-radius:12px;padding:2px 7px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px"><span class="dot"></span>${c.unread}</span>`:''}<span style="font-size:10px;color:#94a3b8">${c.fromCampaign?c.campaignName||'Campaña':''}</span></div>
    </div>`;
  }).join('') || '<div style="padding:30px;text-align:center;color:#94a3b8;font-size:13px">Esperando mensajes nuevos en tiempo real...</div>';
}
async function openChat(wa_id){
  current=wa_id;
  let r=await fetch('/api/messages/'+wa_id); let msgs=await r.json();
  document.getElementById('msgs').innerHTML=msgs.map(m=>`<div class="bubble ${m.from==='me'?'me':'client'}">${m.text}<div style="font-size:10px;opacity:.7;margin-top:4px;text-align:right">${new Date(m.timestamp).toLocaleTimeString()}</div></div>`).join('');
  render(); load();
}
async function send(){
  let txt=document.getElementById('input').value.trim(); if(!txt||!current) return;
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:current,text:txt})});
  document.getElementById('input').value=''; openChat(current); setTimeout(load,500);
}
setInterval(load,2000); load();
</script>
</body>
</html>
