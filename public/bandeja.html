<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Klido Bandeja</title><style>body{font-family:sans-serif;background:#111;color:#fff;margin:0;display:flex;height:100vh}.lista{width:35%;border-right:1px solid #333;overflow:auto}.chat{padding:12px;border-bottom:1px solid #222;cursor:pointer}.chat:hover{background:#222}.msgs{flex:1;display:flex;flex-direction:column}.mensajes{flex:1;overflow:auto;padding:20px}.msg{margin:8px;padding:10px 14px;border-radius:12px;max-width:70%}.cliente{background:#222}.yo{background:#25D366;color:#000;margin-left:auto}.input{display:flex;padding:10px;border-top:1px solid #333}input{flex:1;padding:12px;border-radius:20px;border:none}button{margin-left:10px;padding:12px 20px;background:#25D366;border:none;border-radius:20px;font-weight:bold}</style></head><body>
<div class="lista" id="lista"></div>
<div class="msgs"><div class="mensajes" id="mensajes"><p>Selecciona un chat</p></div><div class="input"><input id="txt" placeholder="Escribe un mensaje..."><button onclick="enviar()">Enviar</button></div></div>
<script>
let chats=[], actual=null;
async function cargar(){let r=await fetch('/api/chats');chats=await r.json();let h='';chats.forEach(c=>{h+=`<div class="chat" onclick="abrir('${c.tel}')"><b>${c.nombre}</b><br><small>${c.tel} - ${c.msgs[c.msgs.length-1]?.text.slice(0,30)||''}</small></div>`});document.getElementById('lista').innerHTML=h;if(actual) abrir(actual,false);}
function abrir(tel,reset=true){actual=tel;let c=chats.find(x=>x.tel==tel);let h='';c.msgs.forEach(m=>{h+=`<div class="msg ${m.from}"><small>${m.time||''}</small><br>${m.text}</div>`});document.getElementById('mensajes').innerHTML=h;document.getElementById('mensajes').scrollTop=99999;}
async function enviar(){let text=document.getElementById('txt').value;if(!text||!actual)return;await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:actual,text})});document.getElementById('txt').value='';cargar();}
setInterval(cargar,3000);cargar();
</script></body></html>
