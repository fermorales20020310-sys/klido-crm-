<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO AVANZA</title><style>*{font-family:Arial;box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#f8fafc}.top{height:68px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.tabs{padding:12px 20px;background:white;border-bottom:1px solid #e5e7eb;display:flex;gap:10px}.tab{padding:7px 16px;border-radius:20px;border:1px solid #e5e7eb;background:white;cursor:pointer;font-size:13px;font-weight:600}.tab.active{background:#2563eb;color:white}.main{display:flex;flex:1;overflow:hidden}.left{width:360px;background:white;border-right:1px solid #e5e7eb;overflow-y:auto}.contact{padding:14px;border-bottom:1px solid #f1f5f9;display:flex;gap:10px;cursor:pointer}.contact.yellow{background:#fffbeb;border-left:4px solid #f59e0b}.dot{width:10px;height:10px;background:#ef4444;border-radius:50%;display:inline-block}.chat{flex:1;display:flex;flex-direction:column;background:#eef2ff}.bubble{padding:10px 14px;border-radius:18px;max-width:68%;font-size:14px}.me{background:#2563eb;color:white;align-self:flex-end}.client{background:white;align-self:flex-start}</style></head><body>
<div class="top"><div style="display:flex;align-items:center;gap:12px"><img src="./logo.png" style="height:42px" onerror="this.src='/logo.png'"><div><b>KLIDO AVANZA</b><br><small>API 2000/día - Tiempo real</small></div></div><button onclick="location.href='/campanas'" style="background:#2563eb;color:white;border:none;padding:9px 16px;border-radius:8px;cursor:pointer">+ Campaña</button></div>
<div class="tabs"><div class="tab active" id="t-all" onclick="filter='all';render()">Todos (<span id="c-all">0</span>)</div><div class="tab" id="t-camp" onclick="filter='camp';render()">🟧 Campaña (<span id="c-camp">0</span>)</div><div class="tab" id="t-hot" onclick="filter='hot';render()">🔥 Hot (<span id="c-hot">0</span>) <span id="dot" style="display:none"><span class="dot"></span></span></div></div>
<div class="main"><div class="left" id="list"></div><div class="chat"><div id="msgs" style="flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:8px"></div><div style="padding:10px;display:flex;gap:8px;background:white;border-top:1px solid #e5e7eb"><input id="input" placeholder="Responder..." style="flex:1;padding:12px;border-radius:24px;border:1px solid #e5e7eb"><button onclick="send()" style="background:#2563eb;color:white;border:none;width:44px;height:44px;border-radius:50%">↑</button></div></div></div>
<script>let contacts=[],filter='all',current=null;async function load(){let r=await fetch('/api/contacts');contacts=await r.json();document.getElementById('c-all').innerText=contacts.length;document.getElementById('c-camp').innerText=contacts.filter(c=>c.tag==='alion_co'||c.fromCampaign).length;let h=contacts.filter(c=>c.hot).length;document.getElementById('c-hot').innerText=h;document.getElementById('dot').style.display=h>0?'inline-block':'none';render();}function render(){let f=contacts;if(filter==='hot')f=contacts.filter(c=>c.hot);if(filter==='camp')f=contacts.filter(c=>c.tag==='alion_co'||c.fromCampaign);document.getElementById('list').innerHTML=f.map(c=>`<div class="contact ${current===c.wa_id?'active':''} ${c.fromCampaign?'yellow':''}" onclick="openChat('${c.wa_id}')" style="${current===c.wa_id?'background:#eff6ff':''}"><img src="./logo.png" style="width:32px;height:32px;object-fit:contain" onerror="this.src='/logo.png'"><div style="flex:1"><b style="font-size:13px">${c.wa_id}</b><div style="font-size:12px;color:#555">${(c.lastMessage||'').substring(0,30)}</div></div>${c.unread>0?`<span style="background:red;color:white;border-radius:12px;padding:2px 7px;font-size:11px"><span class=dot></span> ${c.unread}</span>`:''}</div>`).join('');}async function openChat(id){current=id;let r=await fetch('/api/messages/'+id);let m=await r.json();document.getElementById('msgs').innerHTML=m.map(x=>`<div class=bubble ${x.from==='me'?'me':'client'}>${x.text}</div>`).join('');render();load();}async function send(){let t=document.getElementById('input').value;if(!t||!current)return;await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:current,text:t})});document.getElementById('input').value='';openChat(current);}setInterval(load,2000);load();</script></body></html>
