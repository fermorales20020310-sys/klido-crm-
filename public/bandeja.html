<!DOCTYPE html><html><head><meta charset="utf-8"><title>KLIDO - Bandeja</title><style>body{margin:0;font-family:sans-serif;display:flex;height:100vh}.side{width:320px;border-right:1px solid #ddd;display:flex;flex-direction:column}.list{flex:1;overflow:auto}.item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#f0f0f0}.main{flex:1;display:flex;flex-direction:column;background:#e5ddd5}.msgs{flex:1;padding:20px;overflow:auto}.b{background:#fff;padding:8px 12px;border-radius:8px;margin:6px 0;max-width:75%}.b.me{background:#dcf8c6;margin-left:auto}.top{padding:15px;background:#fff;font-weight:bold;border-bottom:1px solid #ddd}.input{display:flex;padding:10px;background:#fff;gap:8px}.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc}</style></head><body>
<div class="side"><div style="padding:12px;background:#111;color:#fff;font-weight:bold">KLIDO - Mensajes</div><div id="lista" class="list">Cargando...</div></div>
<div class="main"><div id="header" class="top">Selecciona un chat</div><div id="msgs" class="msgs"></div><div class="input"><input id="texto" placeholder="Escribe un mensaje..."><button onclick="enviar()" style="background:#25D366;color:#fff;border:0;padding:10px 20px;border-radius:20px;cursor:pointer">Enviar</button></div></div>
<script>
let telActual=null;
async function loadContacts(){
  try{
    const r=await fetch('/api/contacts'); const data=await r.json();
    const validos=data.filter(c=>c.telefono && c.telefono.toString().length>7);
    document.getElementById('lista').innerHTML=validos.map(c=>`<div class="item" onclick="abrir('${c.telefono}')"><b>${c.nombre||c.telefono}</b><br><small>${c.telefono}</small></div>`).join('')||'<div style="padding:20px;color:#999">Aún no hay mensajes. Escríbete a tu WhatsApp API para probar.</div>';
  }catch(e){}
}
async function abrir(tel){
  telActual=tel; document.getElementById('header').innerText=tel;
  const r=await fetch('/api/messages/'+tel); const msgs=await r.json();
  const c=document.getElementById('msgs');
  c.innerHTML=msgs.map(m=>`<div class="b ${m.tipo==='enviado'?'me':''}">${m.texto}<br><small style="font-size:10px;color:#888">${new Date(m.fecha).toLocaleTimeString()}</small></div>`).join('');
  c.scrollTop=c.scrollHeight;
}
async function enviar(){
  const t=document.getElementById('texto').value; if(!t||!telActual) return;
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:telActual,texto:t})});
  document.getElementById('texto').value=''; abrir(telActual);
}
loadContacts(); setInterval(loadContacts,4000);
</script></body></html>
