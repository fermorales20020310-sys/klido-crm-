<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KLIDO - Panel Admin</title>
<style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#1e293b;width:100%;max-width:420px;padding:28px;border-radius:16px}.logo{font-size:32px;font-weight:900;text-align:center;letter-spacing:2px}.logo span{color:#22c55e}.sub{text-align:center;color:#94a3b8;font-size:13px;margin:6px 0 20px}label{font-size:12px;color:#cbd5e1;display:block;margin:14px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;outline:none}button{cursor:pointer;border:0;border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px}.btn-login{width:100%;margin-top:20px;padding:14px;background:#22c55e;color:#000;font-size:16px;font-weight:800}#error{background:#7f1d1d;color:#fecaca;padding:10px;border-radius:10px;font-size:13px;display:none;margin-top:14px}.panel{display:none;width:100%;max-width:1100px}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.top h1{margin:0;font-size:22px}table{width:100%;border-collapse:collapse;margin-top:16px;background:#1e293b;border-radius:12px;overflow:hidden;font-size:13px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #334155;vertical-align:middle}th{color:#94a3b8;font-size:11px;text-transform:uppercase}.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}.b-activo{background:#14532d;color:#bbf7d0}.b-pendiente{background:#713f12;color:#fde68a}.b-bloqueado{background:#7f1d1d;color:#fecaca}.btn-green{background:#22c55e;color:#000}.btn-red{background:#ef4444;color:#fff}.btn-gray{background:#334155;color:#fff}.btn-blue{background:#3b82f6;color:#fff}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row select{width:110px;padding:8px}
</style></head><body>
<div class="card" id="loginBox"><div class="logo">KLI<span>DO</span></div><div class="sub">Panel de Administrador</div>
<label>Correo</label><input id="email" type="email" value="admin@klidoapp.com.co">
<label>Contraseña</label><input id="pass" type="password" placeholder="••••••••">
<button class="btn-login" id="btnLogin" onclick="hacerLogin()">Entrar</button><div id="error"></div></div>
<div class="panel" id="panelBox"><div class="top"><div><h1>Agencias / Empresas</h1><div style="color:#94a3b8;font-size:13px" id="adminEmail"></div></div><button onclick="salir()" class="btn-gray">Salir</button></div>
<div style="margin-top:12px;color:#94a3b8;font-size:13px">💡 Cambia el plan en el desplegable y dale <b>Guardar</b>. <b>Aceptar</b> activa la cuenta. <b>Bloquear</b> no deja entrar a nadie de esa empresa.</div>
<div id="lista">Cargando...</div></div>
<script>
async function hacerLogin(){
  const email=document.getElementById('email').value.trim(), pass=document.getElementById('pass').value;
  const err=document.getElementById('error'); err.style.display='none';
  if(!email||!pass){err.textContent='Escribe correo y contraseña';err.style.display='block';return;}
  const btn=document.getElementById('btnLogin'); btn.disabled=true; btn.textContent='Entrando...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,pass})});
    const d=await r.json();
    if(!d.ok){err.textContent=d.error||'Credenciales incorrectas';err.style.display='block';btn.disabled=false;btn.textContent='Entrar';return;}
    localStorage.setItem('klido_admin',JSON.stringify(d)); mostrarPanel(d);
  }catch(e){err.textContent='No conecta al server: '+e.message;err.style.display='block';btn.disabled=false;btn.textContent='Entrar';}
}
async function cargar(){
  const r=await fetch('/api/admin/agencias'); const list=await r.json();
  if(!Array.isArray(list)||!list.length){document.getElementById('lista').innerHTML='<p style="color:#94a3b8">Sin agencias.</p>';return;}
  let h='<table><tr><th>Empresa</th><th>Email</th><th>Estado</th><th>Plan</th><th>Chats</th><th>Campañas</th><th>Acciones</th></tr>';
  list.forEach(a=>{
    const estado=a.estado||'activo';
    const cls=estado==='bloqueado'?'b-bloqueado':estado==='pendiente'?'b-pendiente':'b-activo';
    h+=`<tr><td><b>${a.nombre||''}</b><br><span style="color:#64748b;font-size:11px">${a.empresa_id||''}</span></td><td>${a.email||''}</td><td><span class="badge ${cls}">${estado.toUpperCase()}</span></td><td><select id="plan-${a.empresa_id}"><option value="basico" ${a.plan==='basico'?'selected':''}>Básico</option><option value="premium" ${a.plan==='premium'?'selected':''}>Premium</option><option value="gold" ${a.plan==='gold'?'selected':''}>Gold</option></select> <button class="btn-blue" onclick="cambiarPlan('${a.empresa_id}')">Guardar</button></td><td>${a.chats||0}</td><td>${a.campaigns ?? 0}</td><td><div class="row">${estado==='pendiente'?`<button class="btn-green" onclick="aceptar('${a.empresa_id}')">✅ Aceptar</button>`:''}${estado==='bloqueado'?`<button class="btn-green" onclick="desbloquear('${a.empresa_id}')">🔓 Desbloquear</button>`:`<button class="btn-red" onclick="bloquear('${a.empresa_id}')">🚫 Bloquear</button>`}</div></td></tr>`;
  });
  h+='</table>'; document.getElementById('lista').innerHTML=h;
}
async function cambiarPlan(id){
  const plan=document.getElementById('plan-'+id).value;
  await fetch('/api/admin/empresa/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:id,plan})});
  alert('Plan cambiado a '+plan); cargar();
}
async function aceptar(id){ await fetch('/api/admin/empresa/aceptar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:id})}); cargar(); }
async function bloquear(id){ if(!confirm('¿Bloquear esta empresa? No podrá entrar nadie.'))return; await fetch('/api/admin/empresa/bloquear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:id})}); cargar(); }
async function desbloquear(id){ await fetch('/api/admin/empresa/desbloquear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:id})}); cargar(); }
function mostrarPanel(d){ document.getElementById('loginBox').style.display='none'; document.getElementById('panelBox').style.display='block'; document.getElementById('adminEmail').textContent=d.user?.email||''; cargar(); }
function salir(){ localStorage.removeItem('klido_admin'); location.reload(); }
window.onload=()=>{ try{ const s=JSON.parse(localStorage.getItem('klido_admin')||'null'); if(s&&s.ok&&s.empresa_id==='admin') mostrarPanel(s);}catch{} };
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')hacerLogin();});
</script></body></html>
