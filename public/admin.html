<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klido - Panel Administradora</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#0f0f12;color:#fff}
header{padding:20px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-size:22px;font-weight:800} .logo span{color:#25D366}
.card{background:#1a1a1f;border:1px solid #2a2a30;border-radius:16px;padding:18px;margin:14px 28px}
table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #2a2a30;font-size:14px}
input,select{padding:10px 12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;width:100%}
button{padding:8px 12px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
.btn-green{background:#25D366;color:#000}.btn-red{background:#ff4d4d;color:#fff}.btn-gray{background:#2a2a30;color:#fff}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}.on{background:#173d27;color:#25D366}.off{background:#3d1717;color:#ff6b6b}
#login{max-width:400px;margin:100px auto;padding:28px}
</style></head>
<body>
<header><div class="logo">Klido <span>ADMIN</span></div><div id="userInfo"></div></header>

<div id="login" class="card">
<h2>Panel de Administradora</h2>
<p style="color:#aaa">Solo tú tienes acceso aquí.</p>
<input id="correo" placeholder="Correo admin" value="admin@klido.com">
<input id="pass" type="password" placeholder="Contraseña" style="margin-top:10px">
<button class="btn-green" style="width:100%;margin-top:14px;padding:12px" onclick="login()">Entrar</button>
<p id="err" style="color:#ff6b6b"></p>
</div>

<div id="panel" style="display:none">
<div class="card"><h3>Resumen</h3><div id="resumen"></div></div>
<div class="card"><h3>Empresas</h3><div style="overflow:auto"><table>
<thead><tr><th>Empresa</th><th>Correo</th><th>Plan</th><th>Código</th><th>Estado</th><th>Campañas</th><th>Acciones</th></tr></thead>
<tbody id="tbody"></tbody></table></div></div>
</div>

<script>
let TOKEN = localStorage.getItem('klido_admin_token')||'';
async function login(){
  const r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:document.getElementById('correo').value,password:document.getElementById('pass').value})});
  const d = await r.json();
  if(!d.ok) return document.getElementById('err').innerText = d.error;
  TOKEN = d.token; localStorage.setItem('klido_admin_token',TOKEN); init();
}
async function cargar(){
  const r = await fetch('/api/admin/empresas',{headers:{Authorization:'Bearer '+TOKEN}});
  if(!r.ok){ localStorage.removeItem('klido_admin_token'); location.reload(); return; }
  const list = await r.json();
  document.getElementById('resumen').innerHTML = `Total empresas: <b>${list.length}</b> | Activas: <b>${list.filter(x=>x.activo).length}</b> | Suspendidas: <b>${list.filter(x=>!x.activo).length}</b>`;
  document.getElementById('tbody').innerHTML = list.map(e=>`
    <tr>
      <td><b>${e.nombre}</b><br><small style="color:#888">${new Date(e.createdAt).toLocaleDateString()}</small></td>
      <td>${e.correo}</td>
      <td><select onchange="cambiarPlan('${e.id}',this.value)"><option ${e.plan==='basico'?'selected':''} value="basico">Básico</option><option ${e.plan==='pro'?'selected':''} value="pro">Pro</option><option ${e.plan==='premium'?'selected':''} value="premium">Premium</option></select></td>
      <td><code>${e.codigoPlan}</code><br><button class="btn-gray" onclick="regenerar('${e.id}')">Regenerar</button></td>
      <td><span class="badge ${e.activo?'on':'off'}">${e.activo?'ACTIVA':'SUSPENDIDA'}</span></td>
      <td>${e.campanas} | ${e.contactos} contactos</td>
      <td>
        <button class="${e.activo?'btn-red':'btn-green'}" onclick="toggle('${e.id}')">${e.activo?'Suspender':'Activar'}</button>
        <button class="btn-gray" onclick="eliminar('${e.id}')">Eliminar</button>
      </td>
    </tr>`).join('') || '<tr><td colspan=7>No hay empresas aún</td></tr>';
}
async function cambiarPlan(id,plan){ await fetch(`/api/admin/empresas/${id}/plan`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({plan})}); cargar(); alert('Plan cambiado y código regenerado'); }
async function toggle(id){ await fetch(`/api/admin/empresas/${id}/toggle`,{method:'POST',headers:{Authorization:'Bearer '+TOKEN}}); cargar(); }
async function regenerar(id){ const r=await fetch(`/api/admin/empresas/${id}/regenerar`,{method:'POST',headers:{Authorization:'Bearer '+TOKEN}}); const d=await r.json(); alert('Nuevo código: '+d.codigoPlan); cargar(); }
async function eliminar(id){ if(!confirm('¿Eliminar esta empresa?'))return; await fetch(`/api/admin/empresas/${id}`,{method:'DELETE',headers:{Authorization:'Bearer '+TOKEN}}); cargar(); }
function init(){ document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block'; document.getElementById('userInfo').innerHTML='<button class="btn-gray" onclick="localStorage.clear();location.reload()">Salir</button>'; cargar(); }
if(TOKEN) init();
</script></body></html>
