<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GERENCIA AVANZA - KLIDO</title>
<style>body{margin:0;background:#0b1220;color:#fff;font-family:Arial;padding:20px}.card{background:#1e293b;padding:14px;border-radius:12px;margin:8px 0;border:1px solid #334155} button{padding:8px 12px;border-radius:8px;border:0;background:#38bdf8;font-weight:800;cursor:pointer;margin:2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px} input{padding:8px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff}</style>
</head>
<body>
<img src="/logo.png" width="110">
<h2>GERENCIA AVANZA CONSULTING - KLIDO</h2>
<p>admin@klido.com | Métricas agencias, movimientos, seguimiento, bloquear/desbloquear</p>
<div class="card"><b id="resumen"></b> <button onclick="cargar()">Actualizar</button> <button onclick="logout()">Salir</button></div>
<div id="lista" class="grid"></div>
<script>
const token=localStorage.getItem('klido_token'); if(!token) location.href='/index.html?v=115';
async function api(p,m='GET',b=null){ const o={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}}; if(b) o.body=JSON.stringify(b); const r=await fetch(p,o); if(r.status===401){ localStorage.clear(); location.href='/index.html'; return null;} return r.json(); }
async function cargar(){
  const j=await api('/api/admin/agencias'); if(!j) return;
  document.getElementById('resumen').innerText=`Total ${j.total} / 10 Restan ${j.restan} WPP ${j.wpp}`;
  const box=document.getElementById('lista'); box.innerHTML='';
  j.agencias.forEach(a=>{
    box.innerHTML+=`<div class=card><b>${a.nombre}</b><br>${a.email}<br>Plan ${a.plan} Estado ${a.estado} Pagado ${a.pagado}<br>WA Phone ${a.waPhoneId||'No config'}<br>Equipo ${a.equipo.length}/${a.consumo.usuarios}<br>Campañas ${a.campanas.length} Contactos ${a.contactos.length}<br><small>${a.fechaRegistro}</small><br><button onclick="desbloquear('${a.id}')">Desbloquear</button><button onclick="bloquear('${a.id}','bloqueada',false)" style="background:#ef4444;color:#fff">Bloquear</button><button onclick="verContrato('${a.id}')">Contrato</button><button onclick="verMetricas('${a.id}')">Métricas</button></div>`;
  });
}
async function desbloquear(id){ await api('/api/gerente/desbloquear/'+id,'POST'); cargar(); }
async function bloquear(id,estado,pagado){ await api('/api/admin/bloquear','POST',{agenciaId:id,estado,pagado}); cargar(); }
function verContrato(id){ window.open('/api/contrato/'+id+'?token='+token,'_blank'); }
async function verMetricas(id){ const j=await api('/api/debug/empresas'); const emp=j.find(e=>e.id===id); alert(JSON.stringify(emp?.metricas||{},null,2)); }
function logout(){ localStorage.clear(); location.href='/index.html'; }
cargar();
</script>
</body>
</html>
