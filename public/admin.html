<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Gerente General - Avanza</title><style>body{font-family:sans-serif;background:#f1f5f9;padding:20px}table{width:100%;background:white;border-radius:12px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;font-size:13px}th{background:#0f172a;color:white}.btn{padding:6px 10px;border-radius:8px;border:none;cursor:pointer;font-weight:800}.ok{background:#dcfce7}.bad{background:#fee2e2}</style></head><body><h2>📊 Gerente General - Seguimiento General</h2><div id="stats"></div><table><thead><tr><th>Agencia</th><th>Plan</th><th>Estado</th><th>Código</th><th>Acción</th></tr></thead><tbody id="tbody"></tbody></table><script>const KEY='KLIDO_DUEÑA_2026';async function load(){const r=await fetch('/api/admin/metricas',{headers:{'x-admin-key':KEY}});const d=await r.json();document.getElementById('stats').innerHTML=`Total: ${d.totalAgencias} | Activas: ${d.activas} | Ingresos: $${d.ingresosMes}`;document.getElementById('tbody').innerHTML=d.agencias.map(a=>`<tr><td>${a.nombre}</td><td>${a.plan}</td><td>${a.estadoPago} / ${a.estado}</td><td>${a.codigo}</td><td><button class="btn ${a.estadoPago==='pagado'?'bad':'ok'}" onclick="toggle('${a.id}','${a.estadoPago==='pagado'?'bloqueado':'pagado'}')">${a.estadoPago==='pagado'?'Bloquear':'Desbloquear'}</button></td></tr>`).join('')}async function toggle(id,estado){await fetch('/api/admin/toggle',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify({id,estado})});load()}load()</script></body></html>
