<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO ADMIN DUEÑAS</title><link rel="icon" href="logo.png">
<style>:root{--bg:#070d1c;--card:#111d33;--border:#233656;--gold:#f59e0b;--text:#e2e8f0;--muted:#94a3b8}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}.header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--card)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px}.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px} table{width:100%;border-collapse:collapse;font-size:12px} th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left} button.p{padding:6px 10px;border-radius:8px;border:0;background:var(--gold);color:#000;font-weight:700;cursor:pointer} button.s{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer} input{padding:8px;border-radius:8px;border:1px solid var(--border);background:#0a1428;color:#fff}</style></head><body>
<div class="header"><div><b>KLIDO AVANZA CONSULTING - DUEÑAS</b><div style="font-size:11px;color:var(--muted)">Seguimiento total agencias inscritas, plan, trabajadores, bloqueo, consumo, ventas en tiempo real</div></div><div><input id="admKey" placeholder="ADMIN_KEY" value="KLIDO_DUEÑA_2026"><button class="p" onclick="load()">Entrar</button></div></div>
<div class="grid" id="kpis"></div>
<div style="padding:0 20px 20px"><table><thead><tr><th>Agencia</th><th>Plan</th><th>Anual</th><th>Estado pago</th><th>Estado</th><th>Trabajadores</th><th>Campañas</th><th>Última conexión</th><th>Acción</th></tr></thead><tbody id="tbody"></tbody></table></div>
<script>
async function load(){
 const key=document.getElementById('admKey').value;
 const r=await fetch('/api/admin/metricas',{headers:{'x-admin-key':key}}); const d=await r.json();
 if(!r.ok) return alert(d.error);
 document.getElementById('kpis').innerHTML=`<div class="kpi"><b>${d.totalAgencias}</b><br>Total agencias inscritas</div><div class="kpi"><b>${d.activas}</b><br>Activas</div><div class="kpi"><b>B:${d.porPlan.basico} P:${d.porPlan.premium} G:${d.porPlan.gold}</b><br>Por plan</div><div class="kpi"><b>$${(d.ingresos/1000000).toFixed(1)}M</b><br>Ventas KLIDO totales</div>`;
 document.getElementById('tbody').innerHTML=d.agencias.map(a=>`<tr><td>${a.nombre}<br><span style="color:var(--muted);font-size:10px">${a.id}</span></td><td>${a.plan}</td><td>$${a.anual}</td><td>${a.estadoPago}</td><td>${a.estado}</td><td>${a.trabajadores}</td><td>${a.campanas}</td><td>${a.ultimaConexion?new Date(a.ultimaConexion).toLocaleString():'-'}</td><td><button class="p" onclick="toggle('${a.id}','${a.estadoPago==='pagado'?'bloqueado':'pagado'}')">${a.estadoPago==='pagado'?'Bloquear':'Desbloquear'}</button></td></tr>`).join('');
}
async function toggle(id,estado){
 const key=document.getElementById('admKey').value;
 await fetch('/api/admin/toggle',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({id,estado})});
 load();
}
</script></body></html>
