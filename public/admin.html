<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO ADMIN V128</title><style>body{font-family:Arial;background:#0a1931;color:#fff;padding:16px}.card{background:#fff;color:#0a1931;padding:14px;border-radius:12px;margin:10px 0}.mora{border:3px solid #ef4444}.ok{border:3px solid #22c55e} button{padding:8px 12px;border-radius:8px;border:0;font-weight:800;cursor:pointer;margin:3px}</style></head><body>
<h2>KLIDO ADMIN V128 - 3133181851</h2><div id="lista">Cargando...</div>
<script>
const token=localStorage.getItem('klido_token'); if(!token){alert('Logueate primero en /'); location.href='/';}
async function cargar(){const r=await fetch('/api/admin/agencias',{headers:{Authorization:'Bearer '+token}}); const j=await r.json(); let h=''; j.agencias.forEach(a=>{const venc=a.mantenimiento&&Date.now()>Number(a.mantenimiento); const mora=!a.plan_activo||venc; h+=`<div class="card ${mora?'mora':'ok'}"><b>${a.nombre}</b> (${a.email})<br>ID:${a.id} | Plan:${(a.plan||'').toUpperCase()} | Activo:${a.plan_activo?'SI':'NO MORA'}<br>Vence:${a.mantenimiento?new Date(Number(a.mantenimiento)).toLocaleDateString():'-'}<br><button style="background:#22c55e;color:#fff" onclick="act('${a.id}','${a.plan}',90)">✅ ACTIVAR 90 DÍAS</button><button onclick="act('${a.id}','basico',90)">BÁSICO</button><button onclick="act('${a.id}','premium',90)">PREMIUM</button><button onclick="act('${a.id}','gold',90)">GOLD</button><button style="background:#ef4444;color:#fff" onclick="bloq('${a.id}')">🚫 BLOQUEAR</button></div>`}); document.getElementById('lista').innerHTML=h;}
async function act(id,plan,dias){if(!confirm('Activar '+id+' '+plan+' '+dias+' dias?'))return; const r=await fetch('/api/admin/agencias/'+id+'/activar',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({plan,dias})}); const j=await r.json(); alert(j.mensaje||j.error); cargar();}
async function bloq(id){if(!confirm('Bloquear '+id+' por mora?'))return; const r=await fetch('/api/admin/agencias/'+id+'/bloquear',{method:'POST',headers:{Authorization:'Bearer '+token}}); const j=await r.json(); alert(j.mensaje); cargar();}
cargar();
</script></body></html>
