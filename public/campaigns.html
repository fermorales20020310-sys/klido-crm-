<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campañas</title><style>body{background:#f0f2f5;padding:20px;font-family:Segoe UI}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}select,textarea,button{width:100%;padding:12px;margin-top:8px;border-radius:8px;border:1px solid #ddd}button{background:#25D366;color:#fff;font-weight:800;border:none;cursor:pointer}</style></head><body><a href="/">← Bandeja</a><div class="card"><h3>📢 Campaña - Plantillas dinámicas de META</h3><small id="info">Cargando...</small><select id="tpl"></select><textarea id="nums" rows="6" placeholder="57 3...&#10;uno por línea"></textarea><button onclick="sendBulk()">ENVIAR</button><div id="log"></div></div><div class="card"><div id="list"></div></div><script>async function load(){const r=await fetch('/api/templates'); const t=await r.json(); document.getElementById('tpl').innerHTML=t.map(x=>`<option value="${x.name}">${x.name} [${x.language}]</option>`).join(''); document.getElementById('info').textContent=t.length+' plantillas: '+t.map(x=>x.name).join(', ')}async function sendBulk(){const tpl=document.getElementById('tpl').value; const nums=document.getElementById('nums').value.split('\n').filter(Boolean); if(!tpl||!nums.length) return alert('Falta datos'); const r=await fetch('/api/campaigns/send-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl})}); const j=await r.json(); document.getElementById('log').textContent=j.ok?'Enviando '+nums.length:'Error'}async function loadC(){const r=await fetch('/api/campaigns'); const c=await r.json(); document.getElementById('list').innerHTML=c.map(x=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${x.name}</b> ${x.total} - env:${x.sent} fail:${x.failed} - ${x.status}</div>`).join('')}load();loadC();setInterval(()=>{load();loadC();},3000)</script></body></html>
