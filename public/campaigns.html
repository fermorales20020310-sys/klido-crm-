<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campañas - KLIDO</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{display:flex;height:100vh;background:#E8F1FF}.side{width:260px;background:#0A1931;color:#fff;padding:20px;display:flex;flex-direction:column}.side img{width:90px;margin:0 auto 20px}.side button{background:transparent;color:#fff;border:1px solid #2a4a7a;padding:12px;border-radius:8px;margin:6px 0;cursor:pointer;text-align:left}.side button.active{background:#1E3A8A}.top{position:fixed;top:0;right:0;left:260px;height:60px;background:#fff;display:flex;justify-content:flex-end;align-items:center;padding:0 20px}.top button{background:#0A1931;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer}.main{flex:1;margin:80px 20px;background:#fff;border-radius:12px;padding:25px;overflow-y:auto}select,input{width:100%;padding:12px;margin:8px 0;border:2px solid #E8F1FF;border-radius:8px}.btn{background:#0A1931;color:#fff;border:none;padding:12px 25px;border-radius:8px;cursor:pointer;font-weight:700}.card{border:1px solid #E8F1FF;border-radius:8px;padding:15px;margin:10px 0}</style></head>
<body>
<div class="side"><img src="/logo.png"><button onclick="location.href='/index.html'">💬 Mensajes</button><button class="active">📢 Campañas</button></div>
<div class="top"><button onclick="localStorage.clear();location.href='/login.html'">Salir</button></div>
<div class="main"><h2 style="color:#0A1931">📢 Nueva Campaña</h2>
<label>Plantilla aprobada por Meta:</label><select id="tpl"><option>Cargando...</option></select>
<label>Subir Excel con números (columna A):</label><input type="file" id="xl" accept=".xlsx,.xls,.csv">
<p id="cnt" style="color:#1E3A8A;font-weight:600"></p>
<button class="btn" onclick="sendCamp()">Enviar Campaña</button>
<h3 style="margin-top:30px;color:#0A1931">Historial</h3><div id="hist"></div></div>
<script>if(!localStorage.getItem('k'))location.href='/login.html';let nums=[];
async function init(){const r=await fetch('/api/templates');const t=await r.json();const s=document.getElementById('tpl');s.innerHTML=t.length?t.map(x=>`<option value="${x.name}">${x.name} (${x.status})</option>`).join(''):'<option>No hay plantillas</option>';loadHist()}
document.getElementById('xl').addEventListener('change',e=>{const f=e.target.files[0];const rd=new FileReader();rd.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'binary'});const ws=wb.Sheets[wb.SheetNames[0]];const d=XLSX.utils.sheet_to_json(ws,{header:1});nums=d.flat().map(v=>String(v).replace(/\D/g,'')).filter(v=>v.length>=10);document.getElementById('cnt').textContent=nums.length+' números cargados'};rd.readAsBinaryString(f)});
async function sendCamp(){const tpl=document.getElementById('tpl').value;if(!nums.length)return alert('Sube Excel primero');if(!confirm(`Enviar a ${nums.length} números?`))return;const r=await fetch('/api/campaigns/send-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl})});const j=await r.json();alert(`Enviados: ${j.sent} Fallidos: ${j.failed}`);loadHist()}
async function loadHist(){const r=await fetch('/api/campaigns');const h=await r.json();document.getElementById('hist').innerHTML=h.map(c=>`<div class="card"><b>${c.name}</b> - Total:${c.total} ✅${c.sent} ❌${c.failed}<br><small>${new Date(c.created_at).toLocaleString()}</small></div>`).join('')}
init()</script></body></html>
