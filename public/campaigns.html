<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campañas - Klido</title>
<script>if(localStorage.getItem('klido_auth')!=='ok')location.href='/login.html';</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>:root{--dark:#0A1931;--mid:#185ADB;--light:#E8F0FE;--bg:#E8F0FE}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:var(--bg);min-height:100vh}
#top{background:linear-gradient(135deg,var(--dark),#1a3a6b);padding:14px 20px;display:flex;align-items:center;color:white}#top b{flex:1}#top a{color:white;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:10px;font-weight:700}#top button{background:#ff3b30;border:none;color:#fff;padding:8px 16px;border-radius:10px;font-weight:800;margin-left:10px;cursor:pointer}
.wrap{max-width:900px;margin:20px auto;padding:0 16px;display:grid;gap:16px}.card{background:var(--light);border-radius:16px;padding:22px;border:1px solid #c9d8f5}.card h3{color:var(--dark)}label{font-size:12px;font-weight:800;color:var(--dark);margin-top:14px;display:block}select,textarea{width:100%;padding:13px;margin-top:6px;border-radius:12px;border:1.5px solid #b9ccf0;background:#fff;outline:none}.drop{margin-top:8px;border:2px dashed #185ADB;border-radius:12px;padding:20px;text-align:center;background:#fff;cursor:pointer}.btn{width:100%;padding:15px;margin-top:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--dark),var(--mid));color:white;font-weight:800;cursor:pointer}#log{margin-top:12px;font-weight:700;color:var(--mid)}.hist{padding:12px;border-bottom:1px solid #d0ddf7;display:flex;justify-content:space-between}.badge{background:#ffcc00;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}</style></head><body>
<div id="top"><b>📢 CAMPAÑAS</b><a href="/index.html">← Bandeja</a><button onclick="localStorage.removeItem('klido_auth');location.href='/login.html'">Salir</button></div>
<div class="wrap"><div class="card"><h3>Nueva campaña</h3><label>Plantilla de tu API</label><select id="tpl"><option>Cargando...</option></select>
<label>Sube Excel (primera columna = números)</label><div class="drop" onclick="document.getElementById('file').click()">📎 Subir Excel<div id="fname" style="font-size:12px;color:#5a6a85"></div></div><input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none">
<label>O pega números</label><textarea id="nums" rows="4"></textarea><div id="count" style="font-size:12px;font-weight:700;margin-top:6px;color:#0A1931"></div>
<button class="btn" onclick="sendBulk()">🚀 ENVIAR</button><div id="log"></div></div>
<div class="card"><h3>Historial</h3><div id="list"></div></div></div>
<script>
let excelNums=[];
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;document.getElementById('fname').textContent=f.name;const r=new FileReader();r.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const d=XLSX.utils.sheet_to_json(ws,{header:1});excelNums=d.map(row=>String(row[0]||'').replace(/\D/g,'')).filter(n=>n.length>=10);upd();};r.readAsArrayBuffer(f);});
function upd(){const man=document.getElementById('nums').value.split('\n').map(s=>s.replace(/\D/g,'')).filter(n=>n.length>=10);const t=[...new Set([...excelNums,...man])];document.getElementById('count').textContent='Total: '+t.length;return t;}
document.getElementById('nums').addEventListener('input',upd);
async function loadTpl(){const r=await fetch('/api/templates');const t=await r.json();document.getElementById('tpl').innerHTML=t.map(x=>`<option value="${x.name}">${x.name}</option>`).join('')||'<option>No hay</option>';}
async function sendBulk(){const nums=upd();const tpl=document.getElementById('tpl').value;if(!nums.length||!tpl)return alert('Faltan datos');document.getElementById('log').textContent='Enviando...';const r=await fetch('/api/campaigns/send-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl})});const j=await r.json();document.getElementById('log').textContent=j.ok?'✅ Enviada':'❌ Error';loadH();}
async function loadH(){const r=await fetch('/api/campaigns');const c=await r.json();document.getElementById('list').innerHTML=c.map(x=>`<div class="hist"><div><b>🟡 ${x.name}</b><div style="font-size:12px;color:#5a6a85">${new Date(x.created_at).toLocaleString()}</div></div><div><span class="badge">${x.status}</span><div style="font-size:12px">✅${x.sent} ❌${x.failed}</div></div></div>`).join('');}
loadTpl();loadH();
</script></body></html>
