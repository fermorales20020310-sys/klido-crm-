<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campañas - Klido</title>
<script>if(localStorage.getItem('klido_auth')!=='ok')location.href='/login.html';</script>
<style>:root{--dark:#0A1931;--mid:#185ADB;--light:#E8F0FE;--bg:#E8F0FE}*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI'}body{background:var(--bg);min-height:100vh}
#top{background:linear-gradient(135deg,var(--dark),#1a3a6b);padding:14px 24px;display:flex;align-items:center;gap:12px;color:white}
#top b{font-size:16px}#top a{margin-left:auto;color:white;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700}
.wrap{max-width:900px;margin:24px auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--light);border-radius:16px;padding:22px;box-shadow:0 4px 20px rgba(10,25,49,.06);border:1px solid #c9d8f5}
.card h3{color:var(--dark);font-size:16px}label{font-size:12px;font-weight:800;color:var(--dark);margin-top:14px;display:block}
select,textarea{width:100%;padding:13px;margin-top:6px;border-radius:12px;border:1.5px solid #b9ccf0;background:#fff;outline:none}
.btn{width:100%;padding:15px;margin-top:16px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--dark),var(--mid));color:white;font-weight:800;font-size:15px;cursor:pointer}
#log{margin-top:12px;font-size:13px;color:var(--mid);font-weight:700}</style></head><body>
<div id="top"><b>📢 CAMPAÑAS</b><a href="/index.html">← Bandeja</a></div>
<div class="wrap"><div class="card"><h3>Nueva campaña</h3>
<label>Plantilla</label><select id="tpl"></select>
<label>Números (uno por línea)</label><textarea id="nums" rows="5" placeholder="573001234567"></textarea>
<button class="btn" onclick="sendBulk()">🚀 ENVIAR</button><div id="log"></div></div>
<div class="card"><h3>Historial</h3><div id="list"></div></div></div>
<script>async function load(){const r=await fetch('/api/templates');const t=await r.json();document.getElementById('tpl').innerHTML=t.map(x=>`<option value="${x.name}">${x.name}</option>`).join('');}
async function sendBulk(){const nums=document.getElementById('nums').value.split('\n').map(s=>s.replace(/\D/g,'')).filter(n=>n.length>=10);const tpl=document.getElementById('tpl').value;if(!nums.length)return alert('Agrega números');document.getElementById('log').textContent='Enviando...';const r=await fetch('/api/campaigns/send-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl})});const j=await r.json();document.getElementById('log').textContent=j.ok?'✅ Enviada':'❌ Error';loadC();}
async function loadC(){const r=await fetch('/api/campaigns');const c=await r.json();document.getElementById('list').innerHTML=c.map(x=>`<div style="padding:10px;border-bottom:1px solid #d0ddf7"><b style="color:#0A1931">${x.name}</b> - ${x.total} contactos - ${x.status}</div>`).join('');}
load();loadC();</script></body></html>
