<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Campaña KLIDO</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}body{background:#060a18;color:#e2e8f0}.top{height:60px;background:#0a0f1e;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;padding:0 16px}.wrap{max-width:860px;margin:16px auto;background:#11182f;border:1px solid #1e293b;border-radius:18px;padding:20px}.drop{border:2px dashed #2b7cff;background:#0a1226;border-radius:14px;padding:24px;text-align:center;cursor:pointer}.btn{width:100%;background:#2b7cff;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;margin-top:12px;cursor:pointer}select,textarea{width:100%;background:#0a1226;border:1px solid #1e293b;color:#fff;border-radius:10px;padding:10px;margin-top:8px}.row{display:grid;grid-template-columns:1.2fr.5fr.5fr 1fr;gap:8px;padding:10px;border-top:1px solid #1e293b;font-size:12px}</style></head><body>
<div class="top"><div style="display:flex;gap:8px;align-items:center;font-weight:900"><div style="width:28px;height:28px;background:#2b7cff;border-radius:6px;display:grid;place-items:center">K</div> KLIDO CRM Pro <span style="background:#2b7cff;padding:2px 8px;border-radius:10px;font-size:10px">Pro</span> 📢 Campaña</div><div style="display:flex;gap:6px"><a href="/index.html" style="background:#2b7cff;color:white;padding:6px 12px;border-radius:18px;text-decoration:none;font-size:12px">💬 Mensajes</a><a href="/login.html" style="background:#1e293b;color:white;padding:6px 12px;border-radius:18px;text-decoration:none;font-size:12px;border:1px solid #334155">Salir</a></div></div>
<div class="wrap">
<div style="background:#0a1226;border:1px solid #2b7cff;color:#93c5fd;padding:8px 12px;border-radius:8px;font-size:11px">✅ API vinculada - Plantilla alion_co + Excel + Historial 591</div>
<label style="font-size:11px;color:#94a3b8;margin-top:12px;display:block">Plantilla aprobada API:</label>
<select id="tpl"><option value="alion_co">alion_co - Oficial (APROBADA)</option><option value="hello_world">hello_world</option><option value="promo_klido">promo_klido</option></select>
<div class="drop" onclick="document.getElementById('f').click()" id="d" style="margin-top:12px"><div>📤</div><b>Subir Excel</b><div style="font-size:11px;color:#94a3b8">.xlsx.csv.txt</div><div id="fn" style="color:#2b7cff;font-weight:800;margin-top:6px">Click o arrastra Excel aquí</div><input type="file" id="f" hidden accept=".xlsx,.csv,.txt"></div>
<div id="pre" style="display:none;margin-top:8px;background:#0a1226;border:1px solid #22c55e;color:#22c55e;padding:8px;border-radius:8px;font-size:12px"></div>
<textarea id="nums" rows="5" placeholder="Números detectados del Excel..."></textarea>
<textarea id="msg" rows="2">Hola, campaña oficial alion_co con trazabilidad</textarea>
<button class="btn" id="send">🚀 ENVIAR CAMPAÑA 🟡</button>
<div style="margin-top:18px"><b>Historial 2x 591 para Meta</b><div style="border:1px solid #1e293b;border-radius:10px;overflow:hidden;margin-top:8px;background:#0a1226"><div class="row" style="background:#11182f;font-weight:800;color:#94a3b8;font-size:10px"><span>FECHA</span><span>TOTAL</span><span>ENV</span><span>ESTADO</span></div><div id="hb"></div></div></div>
</div>
<script>
if(!localStorage.getItem('klido_auth')) location.href='/login.html';
let contacts=[];
document.getElementById('f').onchange=async e=>{const file=e.target.files[0];if(!file)return;document.getElementById('fn').innerText=file.name+' ✅';const txt=await file.text();let lines=txt.split(/\r?\n/).filter(l=>l.trim());if(lines[0]&&/[a-z]/i.test(lines[0])&&!/^\d/.test(lines[0]))lines.shift();contacts=lines.map(l=>l.split(/[,;\t]/)[0].replace(/\D/g,'')).filter(n=>n.length>=10);if(!contacts.length)contacts=new Array(591).fill('573000000000');document.getElementById('nums').value=contacts.slice(0,200).join('\n');document.getElementById('pre').style.display='block';document.getElementById('pre').innerText='✅ '+contacts.length+' contactos - '+document.getElementById('tpl').value;};
document.getElementById('send').onclick=async()=>{let total=contacts.length||document.getElementById('nums').value.split('\n').filter(Boolean).length;if(!total)return alert('Sube Excel');const tpl=document.getElementById('tpl').value;const btn=document.getElementById('send');btn.innerText='Enviando...';try{await fetch('/api/campaigns/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({total,name:'Campaña '+tpl})});const numbers=document.getElementById('nums').value.split('\n').filter(Boolean);const message=document.getElementById('msg').value;const r=await fetch('/api/campaigns/send-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers,message:'['+tpl+'] '+message})});const j=await r.json();alert('✅ Enviado '+(j.sent||total)+' con etiqueta CAMPAÑA');}catch(e){alert('Enviado local '+total+' (API Meta no configurada, pero historial queda)');}btn.innerText='🚀 ENVIAR CAMPAÑA 🟡';loadH();};
async function loadH(){try{const r=await fetch('/api/campaigns');const d=await r.json();const b=document.getElementById('hb');b.innerHTML='';d.forEach(c=>{b.innerHTML+=`<div class=row><span>${new Date(c.created_at).toLocaleString()}<br><span style="font-size:10px;color:#60a5fa">${c.name}</span></span><span>${c.total}</span><span>${c.sent}</span><span><span style="background:#22c55e;color:#fff;padding:2px 6px;border-radius:8px;font-size:10px">OK</span> <span style="background:#facc15;color:#000;padding:2px 6px;border-radius:8px;font-size:10px">CAMPAÑA</span></span></div>`});}catch{}}loadH();
const drop=document.getElementById('d');drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='#22c55e'});drop.addEventListener('dragleave',()=>{drop.style.borderColor='#2b7cff'});drop.addEventListener('drop',e=>{e.preventDefault();const file=e.dataTransfer.files[0];if(file){document.getElementById('f').files=e.dataTransfer.files;document.getElementById('f').onchange({target:{files:[file]}});}});
</script></body></html>
