<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campañas - Klido CRM Pro</title>
<script>if(localStorage.getItem('klido_auth')!=='ok')location.href='/login.html';</script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
:root{--dark:#0A1931;--mid:#185ADB;--light:#E8F0FE;--bg:#eef3ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}body{background:var(--bg);min-height:100vh}
#top{background:linear-gradient(135deg,var(--dark),#143a7a);padding:14px 22px;display:flex;align-items:center;gap:12px;color:#fff}
#top img{width:40px;height:40px;border-radius:12px;background:#fff;padding:4px}
#top b{flex:1;letter-spacing:1.5px}
.btn-top{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700}
.btn-salir{background:rgba(255,59,48,.2);border:1px solid rgba(255,59,48,.5);color:#ff8a80;padding:9px 16px;border-radius:10px;font-weight:800;cursor:pointer}
.btn-salir:hover{background:#ff3b30;color:#fff}
.wrap{max-width:920px;margin:24px auto;padding:0 18px;display:grid;gap:18px}
.card{background:var(--light);border-radius:20px;padding:26px;border:1px solid #c9d8f5;box-shadow:0 10px 30px rgba(10,25,49,.07)}
.card h3{color:var(--dark);font-size:17px;display:flex;align-items:center;gap:8px}
label{font-size:12px;font-weight:800;color:var(--dark);margin-top:16px;display:block;letter-spacing:.3px}
select,textarea{width:100%;padding:14px;margin-top:8px;border-radius:14px;border:1.5px solid #b9ccf0;background:#fff;outline:none;font-size:14px}
.drop{margin-top:8px;border:2px dashed var(--mid);border-radius:14px;padding:24px;text-align:center;background:#fff;cursor:pointer;color:var(--dark);transition:.2s}
.drop:hover{background:#f0f5ff}
.btn-send{width:100%;padding:16px;margin-top:18px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 25px rgba(24,90,219,.35)}
#log{margin-top:12px;font-weight:700;color:var(--mid);font-size:13px}
.hist{padding:14px 4px;border-bottom:1px solid #d0ddf7;display:flex;justify-content:space-between;align-items:center}
.badge{background:#ffcc00;color:var(--dark);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800}
</style></head><body>
<div id="top"><img src="/logo.png" onerror="this.style.display='none'"><b>KLIDO CRM • CAMPAÑAS</b><a class="btn-top" href="/index.html">← Bandeja</a><button class="btn-salir" onclick="localStorage.removeItem('klido_auth');location.href='/login.html'">Salir</button></div>
<div class="wrap">
<div class="card"><h3>🚀 Nueva campaña profesional</h3>
<label>1. PLANTILLA APROBADA DE TU API</label><select id="tpl"><option>Cargando plantillas...</option></select>
<label>2. SUBE EXCEL CON NÚMEROS</label>
<div class="drop" onclick="document.getElementById('file').click()"><div style="font-size:32px">📊</div><div style="font-weight:800;margin-top:6px">Click para subir .xlsx / .xls / .csv</div><div style="font-size:12px;color:#5a6a85">Primera columna = números con código país</div><div id="fname" style="font-size:12px;color:var(--mid);margin-top:6px;font-weight:700"></div></div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none">
<label>O PEGA MANUALMENTE</label><textarea id="nums" rows="4" placeholder="573001234567&#10;573009876543"></textarea>
<div id="count" style="font-size:13px;font-weight:800;color:var(--dark);margin-top:8px"></div>
<button class="btn-send" onclick="sendBulk()">🚀 LANZAR CAMPAÑA AHORA</button><div id="log"></div>
</div>
<div class="card"><h3>� history Historial de campañas</h3><div id="list" style="margin-top:12px"></div></div>
</div>
<script>
let excelNums=[];
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;document.getElementById('fname').textContent='📄 '+f.name;const r=new FileReader();r.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const d=XLSX.utils.sheet_to_json(ws,{header:1});excelNums=d.map(row=>String(row[0]||'').replace(/\D/g,'')).filter(n=>n.length>=10);upd();};r.readAsArrayBuffer(f);});
function upd(){const man=document.getElementById('nums').value.split('\n').map(s=>s.replace(/\D/g,'')).filter(n=>n.length>=10);const t=[...new Set([...excelNums,...man])];document.getElementById('count').textContent='✅ Total números listos: '+t.length+(excelNums.length?' ('+excelNums.length+' del Excel)':'');return t;}
document.getElementById('nums').addEventListener('input',upd);
async function loadTpl(){try{const r=await fetch('/api/templates');const t=await r.json();document.getElementById('tpl').innerHTML=t.map(x=>`<option value="${x.name}">${x.name} (${x.language||'es'})</option>`).join('')||'<option value="">Sin plantillas</option>';}catch(e){document.getElementById('tpl').innerHTML='<option>Error</option>';}}
async function sendBulk(){const nums=upd();const tpl=document.getElementById('tpl').value;if(!tpl)return alert('Selecciona plantilla');if(!nums.length)return alert('Sube Excel o pega números');document.getElementById('log').textContent='⏳ Enviando a '+nums.length+' contactos...';const r=await fetch('/api/campaigns/send-bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl})});const j=await r.json();document.getElementById('log').textContent=j.ok?`✅ Campaña lanzada: ${j.sent} enviados, ${j.failed} fallidos`:'❌ Error';loadH();}
async function loadH(){const r=await fetch('/api/campaigns');const c=await r.json();document.getElementById('list').innerHTML=c.map(x=>`<div class="hist"><div><b style="color:#0A1931">🟡 ${x.name}</b><div style="font-size:12px;color:#5a6a85">${new Date(x.created_at).toLocaleString()} • ${x.total} contactos</div></div><div style="text-align:right"><span class="badge">${x.status}</span><div style="font-size:12px;margin-top:4px">✅ ${x.sent} | ❌ ${x.failed}</div></div></div>`).join('')||'<div style="color:#5a6a85;font-size:13px">Sin campañas aún</div>';}
loadTpl();loadH();
</script></body></html>
