<!DOCTYPE html>
<html>
<head><title>Klido - Campañas Masivas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:system-ui;padding:20px;max-width:900px;margin:auto}.card{border:1px solid #ddd;padding:16px;border-radius:12px;margin-bottom:16px} input,button{padding:10px;border-radius:8px;border:1px solid #ccc} button{background:#111;color:#fff;cursor:pointer} table{width:100%;border-collapse:collapse} td,th{border:1px solid #eee;padding:8px}</style>
</head>
<body>
<h1>📢 Campañas Masivas - 1000 contactos</h1>
<a href="/">← Volver al CRM</a>

<div class="card">
<h3>1. Crear campaña</h3>
<input id="campName" placeholder="Nombre campaña ej: Promo Mayo" style="width:200px">
<input id="templateName" placeholder="Plantilla aprobada ej: promo_klido" style="width:250px">
<p><small>Sube CSV con columnas: phone,name (ej: 573001234567,Juan) - Máx 2000</small></p>
<input type="file" id="csvFile" accept=".csv,.txt">
<button onclick="createCampaign()">Crear campaña</button>
<p id="createStatus"></p>
</div>

<div class="card">
<h3>2. Campañas</h3>
<button onclick="loadCampaigns()">Refrescar</button>
<table id="campTable"><thead><tr><th>ID</th><th>Nombre</th><th>Plantilla</th><th>Total</th><th>Enviados</th><th>Fallidos</th><th>Estado</th><th>Acción</th></tr></thead><tbody></tbody></table>
</div>

<script>
let contactsParsed = [];
document.getElementById('csvFile').addEventListener('change', async (e)=>{
  const text = await e.target.files[0].text();
  contactsParsed = text.split('\n').filter(l=>l.trim()).map(line=>{
    const [phone,name] = line.split(',').map(s=>s.trim().replace(/"/g,''));
    return {phone, name:name||''};
  }).filter(c=>c.phone);
  document.getElementById('createStatus').innerText = `${contactsParsed.length} contactos cargados`;
});

async function createCampaign(){
  const name = document.getElementById('campName').value;
  const template_name = document.getElementById('templateName').value;
  if(!name ||!template_name ||!contactsParsed.length) return alert('Falta nombre, plantilla y CSV');
  const res = await fetch('/api/campaigns/create',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, template_name, contacts:contactsParsed})});
  const data = await res.json();
  document.getElementById('createStatus').innerText = 'Creada ID '+data.id;
  loadCampaigns();
}
async function loadCampaigns(){
  const res = await fetch('/api/campaigns'); const data = await res.json();
  const tbody = document.querySelector('#campTable tbody'); tbody.innerHTML='';
  data.forEach(c=>{
    tbody.innerHTML+=`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.template_name}</td><td>${c.total_contacts}</td><td>${c.sent}</td><td>${c.failed}</td><td>${c.status}</td><td>${c.status==='draft'?`<button onclick="startCamp(${c.id})">Iniciar envío</button>`:''}</td></tr>`;
  });
}
async function startCamp(id){
  if(!confirm('¿Iniciar envío masivo? Se mandará 1 por segundo.')) return;
  await fetch('/api/campaigns/'+id+'/start',{method:'POST'});
  alert('Iniciada! Refresca para ver progreso');
  loadCampaigns();
}
loadCampaigns();
setInterval(loadCampaigns,5000);
</script>
</body>
</html>
