<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reset KLIDO</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#070b18] flex items-center justify-center h-screen">
<div class="bg-[#111a2e] p-8 rounded-2xl w-full max-w-sm border border-[#1e2f4f]">
<h2 class="text-white font-bold mb-4">Nueva clave KLIDO</h2>
<input id="pass" type="password" placeholder="Nueva clave" class="w-full bg-[#0e1830] border border-[#1e2f4f] p-3 rounded-xl text-white text-sm mb-3">
<button onclick="reset()" class="w-full bg-[#2a4bff] py-3 rounded-xl text-white font-bold text-sm">Cambiar clave</button>
<p id="msg" class="text-xs mt-3 text-center"></p>
<script>
async function reset(){
  const token=new URLSearchParams(location.search).get('token');
  const newPassword=document.getElementById('pass').value;
  let r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword})});
  let j=await r.json(); document.getElementById('msg').textContent=j.ok?'✅ Clave cambiada, ve al login':j.error;
  if(j.ok) setTimeout(()=>location.href='/index.html',1500);
}
</script></div></body></html>
