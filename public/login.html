<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO CRM - Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial}body{background:linear-gradient(135deg,#0A1931,#1E3A8A);height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;padding:40px;border-radius:16px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}.card img{width:110px;margin-bottom:15px}h2{color:#0A1931;margin-bottom:20px}input{width:100%;padding:12px;margin:8px 0;border:2px solid #E8F1FF;border-radius:8px}button{width:100%;padding:12px;background:#0A1931;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}button:hover{background:#1E3A8A}</style></head>
<body><div class="card"><img src="/logo.png"><h2>KLIDO CRM</h2><input id="e" placeholder="Email"><input id="p" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p id="err" style="color:red;margin-top:10px"></p></div>
<script>async function login(){const email=document.getElementById('e').value,password=document.getElementById('p').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(r.ok){localStorage.setItem('k','1');location.href='/index.html'}else document.getElementById('err').textContent='Credenciales inválidas'}</script></body></html>
