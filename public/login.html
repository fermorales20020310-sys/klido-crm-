<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO CRM V12 - Login</title>
<style>*{box-sizing:border-box;font-family:Inter,Arial}body{margin:0;background:#070F22;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh}.card{background:#102542;padding:36px;border-radius:18px;width:390px;text-align:center;border:1px solid #1A335F}.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:15px}.logo img{height:42px}.logo span{font-weight:800;font-size:18px;text-align:left;line-height:1.1}.badge{background:#3B82F6;font-size:11px;padding:3px 8px;border-radius:20px}input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#E8F0FF;color:#000}button{width:100%;padding:13px;margin-top:12px;border:none;border-radius:10px;background:#3B82F6;color:#fff;font-weight:800;cursor:pointer}.error{color:#ff6b6b;margin-top:10px;min-height:20px;font-size:13px}.legal{font-size:11px;color:#8a94ad;margin-top:14px;text-align:left;display:flex;gap:8px;align-items:flex-start}.legal a{color:#60A5FA;text-decoration:none}.legal input{width:16px;margin:0}.foot{margin-top:18px;font-size:11px;color:#5a6580}.foot a{color:#8a94ad;text-decoration:none}</style>
</head><body>
<div class="card">
<div class="logo"><img src="logo.png" alt="Klido"><span>KLIDO<br><span class="badge">CRM V12 MULTIAGENCIA</span></span></div>
<h2>Bienvenido</h2>
<input id="email" type="email" placeholder="Correo empresarial"><input id="password" type="password" placeholder="Contraseña">
<label class="legal"><input type="checkbox" id="acepto"><span>Al ingresar acepto <a href="terminos.html" target="_blank">Términos</a> y <a href="legal.html" target="_blank">Legal Ley 1581</a> - WABA 2317286332424288</span></label>
<button onclick="doLogin()">Ingresar al CRM →</button><div class="error" id="err"></div>
<div class="foot"><a href="terminos.html" target="_blank">Términos</a> • <a href="legal.html" target="_blank">Legal</a> • <a href="/" target="_blank">Inbox</a> • 3133181851</div>
</div>
<script>
async function doLogin(){
  if(!document.getElementById('acepto').checked){document.getElementById('err').innerText='Debes aceptar términos y legal';return;}
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email || !password){document.getElementById('err').innerText='Correo y contraseña requeridos';return;}
  document.getElementById('err').innerText='Ingresando...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const j=await r.json();
    if(j.token){
      localStorage.setItem('klido_token', j.token);
      localStorage.setItem('klido_agencia', j.user.agencia_id);
      localStorage.setItem('klido_user', JSON.stringify(j.user));
      location.href='/';
    }else{
      document.getElementById('err').innerText=j.error||'Error de login';
    }
  }catch(e){ document.getElementById('err').innerText='Error de conexión: '+e.message; }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
// Si ya está logueado, manda al inbox
if(localStorage.getItem('klido_token')){ location.href='/'; }
</script>
</body></html>
