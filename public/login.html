<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klido CRM - Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto}body{height:100vh;display:flex;background:linear-gradient(135deg,#0A1931 0%,#185ADB 60%,#E8F0FE 100%)}.left{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;padding:40px}.left img{width:90px;height:90px;border-radius:20px;background:white;padding:10px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.left h1{font-size:36px;font-weight:800;letter-spacing:1px}.left p{margin-top:10px;opacity:.85;font-size:14px}.right{width:440px;background:white;display:flex;align-items:center;justify-content:center;padding:40px;box-shadow:-10px 0 40px rgba(0,0,0,.15)}.card{width:100%;max-width:340px}.card h2{color:#0A1931;font-size:24px;margin-bottom:6px}.card small{color:#6b7a90}.card input{width:100%;padding:14px 16px;margin-top:14px;border:1.5px solid #dbe2ef;border-radius:12px;outline:none;font-size:14px;background:#f8fafd}.card input:focus{border-color:#185ADB;background:white}.card button{width:100%;padding:14px;margin-top:18px;border:none;border-radius:12px;background:linear-gradient(135deg,#0A1931,#185ADB);color:white;font-weight:800;font-size:15px;cursor:pointer}.card button:hover{opacity:.95}#err{color:#FF3B30;font-size:13px;margin-top:10px;display:none}</style></head><body>
<div class="left"><img src="/logo.png" onerror="this.style.display='none'"><h1>KLIDO CRM</h1><p>Gestión profesional de WhatsApp • Campañas • Historial eterno</p><div style="margin-top:30px;display:flex;gap:12px"><span style="background:rgba(255,255,255,.15);padding:8px 16px;border-radius:20px;font-size:12px">🔵 Azul Pro</span><span style="background:#FFD700;color:#000;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800">🟡 Campañas</span></div></div>
<div class="right"><div class="card"><h2>Bienvenido 👋</h2><small>Ingresa con tu cuenta Klido</small><input id="email" type="email" placeholder="Correo electrónico" value="fermorales20020310@gmail.com"><input id="pass" type="password" placeholder="Contraseña"><div id="err">Credenciales incorrectas</div><button onclick="login()">INGRESAR →</button><p style="margin-top:16px;font-size:11px;color:#8a9ab5;text-align:center">© 2026 Klido CRM Pro</p></div></div>
<script>async function login(){const email=document.getElementById('email').value;const password=document.getElementById('pass').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(j.ok){localStorage.setItem('klido_auth','ok');location.href='/index.html';}else{document.getElementById('err').style.display='block';}}</script></body></html>
