<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - KLIDO</title>
<style>body{background:#0a0f1e;display:grid;place-items:center;height:100vh;font-family:Inter;color:white}.card{background:#111727;border:1px solid #1e293b;border-radius:20px;padding:32px;width:380px;text-align:center}input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:white;margin-top:10px}button{width:100%;margin-top:16px;background:#2b7cff;border:0;padding:12px;border-radius:10px;color:white;font-weight:800;cursor:pointer}</style></head><body>
<div class="card"><div style="font-size:28px;font-weight:900">K KLIDO CRM Pro</div><div style="color:#94a3b8;font-size:13px;margin-top:6px">Ingresa con tu correo y clave</div>
<input id="email" placeholder="Correo - admin@klido.co"><input id="pass" type="password" placeholder="Clave - klido123">
<button onclick="login()">Entrar</button><div id="err" style="color:#f87171;margin-top:10px;font-size:12px"></div></div>
<script>async function login(){ const email=document.getElementById('email').value, password=document.getElementById('pass').value; const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}); const j=await r.json(); if(j.ok){ localStorage.setItem('klido_auth','ok'); location.href='/index.html'; } else document.getElementById('err').innerText=j.msg; }</script></body></html>
