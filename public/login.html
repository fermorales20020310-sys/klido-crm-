<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');*{font-family:'Inter',sans-serif;box-sizing:border-box}body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7fb}.card{width:380px;background:#fff;border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08);text-align:center}input{width:100%;padding:13px;border:1px solid #e5e7eb;border-radius:10px;margin-top:12px}.btn{width:100%;padding:13px;background:#111827;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer}</style></head><body><div class="card"><img src="logo.png" style="height:80px"><h2>KLIDO AVANZA</h2><input id="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button class="btn" onclick="login()">Ingresar</button><div id="err" style="color:red;font-size:12px;margin-top:8px;display:none">Incorrecto</div><div style="font-size:11px;color:#9ca3af;margin-top:8px">admin / alion2025</div></div><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pass').value})});let j=await r.json();if(j.success){localStorage.setItem('klido_auth','ok');location.href='/bandeja';}else document.getElementById('err').style.display='block';}</script></body></html>
