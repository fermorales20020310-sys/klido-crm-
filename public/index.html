<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KLIDO AVANZA</title>
<style>
body{margin:0;font-family:Arial;display:flex;flex-direction:column;height:100vh}
.header{background:#0A2F8A;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.main{display:flex;flex:1;overflow:hidden}
.left{width:320px;border-right:1px solid #ddd;overflow-y:auto;background:white}
.contact{padding:12px;border-bottom:1px solid #eee;cursor:pointer}
.contact:hover{background:#f0f4ff}
.contact.active{background:#dbe7ff}
.right{flex:1;display:flex;flex-direction:column;background:#eef2ff}
.messages{flex:1;overflow-y:auto;padding:20px}
.msg{margin:8px 0;padding:10px 14px;border-radius:12px;max-width:70%}
.me{background:#0A2F8A;color:white;margin-left:auto}
.other{background:white}
.inputbar{display:flex;padding:10px;background:white;border-top:1px solid #ddd}
.inputbar input{flex:1;padding:12px;border-radius:20px;border:1px solid #ddd}
.inputbar button{margin-left:10px;background:#0A2F8A;color:white;border:none;padding:12px 20px;border-radius:20px;cursor:pointer}
.badge{font-size:11px;padding:2px 6px;border-radius:10px;color:white}
.campana{background:#fbbf24;color:black}
</style>
</head>
<body>
<div class="header"><b>KLIDO AVANZA</b><button style="background:white;color:#0A2F8A;border:none;padding:6px 14px;border-radius:20px;font-weight:bold">Campañas 1000</button></div>
<div class="main">
<div class="left" id="contacts"></div>
<div class="right"><div class="messages" id="messages"></div><div class="inputbar"><input id="msgInput" placeholder="Escribe mensaje..."><button onclick="send()">Enviar</button></div></div>
</div>
<script>
let selected=null;
async function loadContacts(){
 const r=await fetch('/api/contacts'); const data=await r.json();
 document.getElementById('contacts').innerHTML=data.map(c=>`<div class="contact ${selected===c.phone?'active':''}" onclick="openChat('${c.phone}')"><b>${c.name||c.phone}</b><br><small>${c.last_message||''}</small> <span class="badge campana">${c.tag||'campana'}</span></div>`).join('');
}
async function openChat(phone){
 selected=phone; loadContacts();
 const r=await fetch('/api/messages/'+phone); const data=await r.json();
 document.getElementById('messages').innerHTML=data.map(m=>`<div class="msg ${m.from_me?'me':'other'}">${m.body}</div>`).join('');
 document.getElementById('messages').scrollTop=99999;
}
async function send(){
 const text=document.getElementById('msgInput').value; if(!text||!selected) return;
 await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:selected,message:text})});
 document.getElementById('msgInput').value=''; openChat(selected);
}
loadContacts(); setInterval(loadContacts,3000);
</script>
</body>
</html>
