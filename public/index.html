<!DOCTYPE html><html><head><meta charset="utf-8"><title>Klido</title>
<style>
body{margin:0;font-family:system-ui;display:flex;height:100vh;overflow:hidden}
#sidebar{width:380px;border-right:1px solid #ddd;display:flex;flex-direction:column;background:#fff}
#chat-list{flex:1;overflow-y:auto}
.chat-item{padding:12px 15px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;gap:10px}
.chat-item:hover{background:#f5f5f5}
.chat-item.active{background:#e9edef}
#chat-area{flex:1;display:flex;flex-direction:column;background:#efeae2}
#chat-header{padding:15px;background:#f0f2f5;border-bottom:1px solid #ddd;font-weight:bold}
#chat-mensajes{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;background:#efeae2 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.bubble{max-width:65%;padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.3;word-break:break-word;box-shadow:0 1px 0.5px rgba(0,0,0,.13)}
.cliente{align-self:flex-start;background:#fff;border-top-left-radius:0}
.agente{align-self:flex-end;background:#d9fdd3;border-top-right-radius:0}
#chat-input{padding:10px;display:flex;gap:10px;background:#f0f2f5}
#input-mensaje{flex:1;padding:12px 15px;border-radius:25px;border:1px solid #ddd;outline:none}
#btn-enviar{background:#000;color:#fff;border:0;border-radius:25px;padding:0 22px;cursor:pointer;font-weight:bold}
</style></head><body>
<div id="sidebar">
  <div style="padding:10px"><input id="buscar" placeholder="Buscar chat..." style="width:100%;padding:10px;border-radius:20px;border:1px solid #ddd"></div>
  <div id="chat-list"></div>
</div>
<div id="chat-area">
  <div id="chat-header">Selecciona un chat</div>
  <div id="chat-mensajes"></div>
  <div id="chat-input">
    <input id="input-mensaje" placeholder="Escribe un mensaje...">
    <button id="btn-enviar">Enviar</button>
  </div>
</div>
<script>
let empresa_id = localStorage.getItem('empresa_id') || 'fermorales20020gmailcom_1234';
let chatActivo=null;
async function cargarChats(){
  const r=await fetch(`/api/chats/${empresa_id}`); const chats=await r.json();
  const list=document.getElementById('chat-list'); list.innerHTML='';
  chats.forEach(c=>{
    const div=document.createElement('div'); div.className='chat-item';
    div.innerHTML=`<div style="background:#000;color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px">57</div><div><div style="font-weight:bold">${c.id}</div><div style="font-size:12px;color:#666">${(c.mensajes[c.mensajes.length-1]?.texto||'').slice(0,35)}</div></div>`;
    div.onclick=()=>abrirChat(c.id); list.appendChild(div);
  });
}
async function abrirChat(id){
  chatActivo=id; document.getElementById('chat-header').textContent=id;
  await fetch('/api/chat/leido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id,chat_id:id})});
  const r=await fetch(`/api/mensajes/${empresa_id}/${id}`); const msgs=await r.json();
  const cont=document.getElementById('chat-mensajes'); cont.innerHTML='';
  msgs.forEach(m=>{
    const b=document.createElement('div'); b.className='bubble '+(m.from==='agente'?'agente':'cliente'); b.textContent=m.texto; cont.appendChild(b);
  });
  cont.scrollTop=cont.scrollHeight;
}
document.getElementById('btn-enviar').onclick=async()=>{
  const input=document.getElementById('input-mensaje'); const txt=input.value.trim(); if(!txt||!chatActivo) return;
  const cont=document.getElementById('chat-mensajes');
  const b=document.createElement('div'); b.className='bubble agente'; b.textContent=txt; cont.appendChild(b); cont.scrollTop=cont.scrollHeight; input.value='';
  await fetch('/api/mensaje/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id,chat_id:chatActivo,texto:txt})});
};
setInterval(cargarChats,3000);
cargarChats();
</script></body></html>
