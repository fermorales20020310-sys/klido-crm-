<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLIDO PRO</title>
<style>
:root{ --bg:#ffffff; --sidebar:#f8f9fa; --chatbg:#efeae2; --text:#111; --bubble-in:#fff; --bubble-out:#d9fdd3; }
body.dark{ --bg:#0b141a; --sidebar:#111b21; --chatbg:#0b141a; --text:#e9edef; --bubble-in:#1f2c34; --bubble-out:#005c4b; }
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text);display:flex;height:100vh}
#sidebar{width:320px;background:var(--sidebar);border-right:1px solid #ddd;display:flex;flex-direction:column}
#topbar{padding:12px;display:flex;justify-content:space-between;align-items:center}
#chats{flex:1;overflow:auto}
.chat{padding:12px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between}
.chat.unread{font-weight:bold} .dot{width:10px;height:10px;background:red;border-radius:50%;display:inline-block}
#main{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:20px;background:var(--chatbg)}
.msg{max-width:70%;padding:8px 12px;margin:6px;border-radius:8px}
.in{background:var(--bubble-in);align-self:flex-start} .out{background:var(--bubble-out);align-self:flex-end;margin-left:auto}
#input{padding:12px;display:flex;gap:8px}
button{cursor:pointer}
</style>
</head>
<body>
<div id="sidebar">
  <div id="topbar">
    <b>KLIDO PRO</b>
    <div>
      <select id="agencySel"><option value="tu_empresa">Mi empresa</option><option value="agencia_piloto">Piloto</option></select>
      <button id="themeBtn">🌙</button>
    </div>
  </div>
  <div id="chats"></div>
</div>
<div id="main">
  <div id="msgs"></div>
  <div id="input">
    <input id="txt" placeholder="Escribe..." style="flex:1;padding:10px">
    <button onclick="send()">Enviar</button>
  </div>
</div>
<script>
let curWa=null;
const agency=()=>document.getElementById('agencySel').value;
const pop=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3');
let lastUnread=0;

// tema
const tbtn=document.getElementById('themeBtn');
if(localStorage.getItem('klido-theme')==='dark'){document.body.classList.add('dark');tbtn.textContent='☀️'}
tbtn.onclick=()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');localStorage.setItem('klido-theme',d?'dark':'light');tbtn.textContent=d?'☀️':'🌙'};

async function loadChats(){
  const r=await fetch('/api/chats?agency_id='+agency()); const chats=await r.json();
  const unreadCount=chats.filter(c=>c.unread).length;
  if(unreadCount>lastUnread) pop.play().catch(()=>{});
  lastUnread=unreadCount;
  document.getElementById('chats').innerHTML=chats.map(c=>`
    <div class="chat ${c.unread?'unread':''}" onclick="openChat('${c.wa_id}','${c.name}')">
      <span>${c.unread?'<span class="dot"></span> ':''}${c.name}<br><small>${c.lastMessage||''}</small></span>
    </div>`).join('');
}
async function openChat(wa,name){
  curWa=wa;
  await fetch('/api/chats/'+wa+'/read?agency_id='+agency(),{method:'POST'});
  const r=await fetch('/api/messages/'+wa+'?agency_id='+agency()); const msgs=await r.json();
  document.getElementById('msgs').innerHTML=msgs.map(m=>{
    let inner=m.text;
    if(m.media_type==='image'&&m.media_url) inner=`<img src="${m.media_url}" style="max-width:200px;border-radius:8px"><br>${m.text}`;
    if(m.media_type==='audio'&&m.media_url) inner=`<audio controls src="${m.media_url}" style="max-width:200px"></audio>`;
    if(m.media_type==='video'&&m.media_url) inner=`<video controls src="${m.media_url}" style="max-width:200px"></video>`;
    return `<div class="msg ${m.direction==='in'?'in':'out'}">${inner}<br><small>${m.status||''}</small></div>`;
  }).join('');
  loadChats();
}
async function send(){
  const t=document.getElementById('txt').value; if(!t||!curWa) return;
  await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:curWa,text:t,agency_id:agency()})});
  document.getElementById('txt').value=''; openChat(curWa);
}
document.getElementById('agencySel').onchange=()=>{curWa=null;document.getElementById('msgs').innerHTML='';loadChats();};
setInterval(loadChats,3000); loadChats();
</script>
</body>
</html>
