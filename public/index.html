<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klido CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;display:flex;height:100vh;overflow:hidden;background:#111b21}
#sidebar{width:360px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
#chat-list{flex:1;overflow-y:auto}
.item{padding:12px 14px;border-bottom:1px solid #f2f2f2;cursor:pointer;display:flex;gap:10px}
.item.active{background:#e9edef}
.avatar{width:38px;height:38px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.bubble{max-width:65%;padding:8px 12px;border-radius:8px;font-size:14px;word-break:break-word;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.cliente{align-self:flex-start;background:#fff}
.agente{align-self:flex-end;background:#d9fdd3}
#chat-area{flex:1;display:flex;flex-direction:column;background:#efeae2}
#chat-header{height:56px;padding:0 16px;background:#f0f2f5;border-bottom:1px solid #ddd;display:flex;align-items:center;font-weight:700}
#chat-mensajes{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:6px}
#chat-input{height:62px;background:#f0f2f5;display:flex;align-items:center;gap:8px;padding:0 12px}
#input-mensaje{flex:1;padding:11px 16px;border-radius:22px;border:0;outline:none}
#btn-enviar{border:0;background:#000;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="sidebar"><div id="chat-list"></div></div>
<div id="chat-area">
<div id="chat-header">Selecciona un chat</div>
<div id="chat-mensajes"></div>
<div id="chat-input"><input id="input-mensaje" placeholder="Escribe un mensaje..."><button id="btn-enviar">Enviar</button></div>
</div>
<script>
let empresa_id = localStorage.getItem('empresa_id') || 'fermorales20020gmailcom_1234';
let chatActivo=null;
async function cargarChats(){
 const r=await fetch(`/api/chats/${empresa_id}`); const chats=await r.json();
 const list=document.getElementById('chat-list'); list.innerHTML='';
 chats.forEach(c=>{
  const div=document.createElement('div'); div.className='item'+(chatActivo===c.id?' active':'');
  div.innerHTML=`<div class="avatar">57</div><div><b>${c.id}</b><div style="font-size:12px;color:#666">${(c.mensajes?.slice(-1)[0]?.texto||'').slice(0,35)}</div></div>`;
  div.onclick=()=>abrirChat(c.id); list.appendChild(div);
 });
}
async function abrirChat(id){
 chatActivo=id; document.getElementById('chat-header').textContent=id;
 await fetch('/api/chat/leido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id,chat_id:id})});
 const r=await fetch(`/api/mensajes/${empresa_id}/${id}`); const msgs=await r.json();
 const cont=document.getElementById('chat-mensajes'); cont.innerHTML='';
 msgs.forEach(m=>{ const d=document.createElement('div'); d.className='bubble '+(m.from==='agente'?'agente':'cliente'); d.textContent=m.texto; cont.appendChild(d); });
 cont.scrollTop=cont.scrollHeight;
}
async function enviar(){
 const input=document.getElementById('input-mensaje'); const txt=input.value.trim(); if(!txt||!chatActivo) return;
 const cont=document.getElementById('chat-mensajes'); const b=document.createElement('div'); b.className='bubble agente'; b.textContent=txt; cont.appendChild(b); cont.scrollTop=cont.scrollHeight; input.value='';
 await fetch('/api/mensaje/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id,chat_id:chatActivo,texto:txt})});
}
document.getElementById('btn-enviar').onclick=enviar;
document.getElementById('input-mensaje').addEventListener('keydown',e=>{ if(e.key==='Enter') enviar(); });
setInterval(cargarChats,4000); cargarChats();
</script>
</body>
</html>
