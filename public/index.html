<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klido CRM</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Roboto}body{display:flex;height:100vh;background:#f0f2f5}#sidebar{width:360px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}#header{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #eee}#header b{font-size:16px}#filters{display:flex;gap:6px;padding:10px}.filter{padding:6px 10px;border-radius:20px;border:1px solid #ddd;font-size:12px;cursor:pointer;font-weight:600}.filter.active{background:#25D366;color:#fff;border-color:#25D366}#search{padding:0 10px 10px}#search input{width:100%;padding:10px 12px;border-radius:8px;border:none;background:#f0f2f5;outline:none}#chats{flex:1;overflow:auto}#main{flex:1;display:flex;flex-direction:column;background:#efeae2 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}#mainHeader{padding:12px;background:#f0f2f5;border-left:1px solid #ddd}#messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:6px}.msg{max-width:65%;padding:8px 10px;border-radius:8px;font-size:14px;box-shadow:0 1px 0.5px rgba(0,0,0,.2)}.msg.in{background:#fff;align-self:flex-start;border-top-left-radius:0}.msg.out{background:#d9fdd3;align-self:flex-end;border-top-right-radius:0}.meta{font-size:10px;color:#667781;display:flex;gap:4px;justify-content:flex-end;margin-top:4px}#inputArea{padding:10px;background:#f0f2f5;display:flex;gap:8px}#inputArea input{flex:1;padding:12px;border-radius:21px;border:none;outline:none}#inputArea button{background:#25D366;color:#fff;border:none;padding:0 18px;border-radius:50%;width:45px;height:45px;cursor:pointer;font-size:18px}</style></head><body>
<div id="sidebar"><div id="header"><b>Klido CRM</b><a href="/campaigns.html" style="background:#25D366;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:800">📢 CAMPAÑAS</a></div><div id="filters"><div class="filter active" data-f="all" onclick="setFilter('all')">Todos</div><div class="filter" data-f="unanswered" onclick="setFilter('unanswered')">🔴 Sin contestar</div><div class="filter" data-f="campaign" onclick="setFilter('campaign')">🟡 Campaña</div></div><div id="search"><input id="q" placeholder="Buscar chat..." oninput="render()"></div><div id="chats"></div></div>
<div id="main"><div id="mainHeader"><b id="cName">Selecciona un chat</b><div id="cSub" style="font-size:12px;color:#666"></div></div><div id="messages"><div style="margin:auto;text-align:center;color:#667781;margin-top:20%"><h3>👋 Bienvenido a Klido CRM</h3><p>Historial eterno + plantillas dinámicas + marquillas</p><p style="margin-top:10px">🔴 = sin contestar | 🟡 = viene de campaña</p></div></div><div id="inputArea" style="display:none"><input id="msgInput" placeholder="Escribe un mensaje" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div></div>
<script>
let allChats=[], currentWa=null, filter='all';
async function loadChats(){const r=await fetch('/api/chats'); allChats=await r.json(); render();}
function setFilter(f){filter=f; document.querySelectorAll('.filter').forEach(e=>e.classList.toggle('active',e.dataset.f===f)); render();}
function render(){
 const q=(document.getElementById('q').value||'').toLowerCase();
 let list=allChats.filter(c=>{if(filter==='unanswered'&&!c.unanswered) return false; if(filter==='campaign'&&c.source!=='campaign'&&!c.template_name) return false; if(q&&!c.wa_id.includes(q)) return false; return true;});
 document.getElementById('chats').innerHTML=list.map(c=>{
  const isCamp=c.source==='campaign'||!!c.template_name; const sin=c.unanswered;
  const time=new Date(c.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return `<div onclick="openChat('${c.wa_id}')" style="padding:10px 12px;border-bottom:1px solid #f0f2f5;cursor:pointer;display:flex;gap:10px;${sin?'background:#fff1f1':''};${currentWa===c.wa_id?'background:#f0f2f5':''}"><div style="width:42px;height:42px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">57</div><div style="flex:1;overflow:hidden"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">${c.wa_id}</b><span style="font-size:11px;color:#667781">${time}</span></div><div style="font-size:13px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(c.text||'').slice(0,40)}</div><div style="margin-top:3px;display:flex;gap:4px">${isCamp?'<span style="background:#FFD700;color:#000;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:800">CAMPAÑA</span>':''}${sin?'<span style="background:#FF3B30;color:#fff;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:800">● SIN CONTESTAR</span>':''}</div></div></div>`;
 }).join('');
}
async function openChat(wa){currentWa=wa; document.getElementById('inputArea').style.display='flex'; document.getElementById('cName').textContent=wa; const ch=allChats.find(c=>c.wa_id===wa); document.getElementById('cSub').textContent=ch?.source==='campaign'?'🟡 Viene de campaña':ch?.unanswered?'🔴 Sin contestar':''; render(); const r=await fetch('/api/messages/'+wa); const msgs=await r.json(); const box=document.getElementById('messages'); box.innerHTML=msgs.map(m=>`<div class="msg ${m.direction==='in'?'in':'out'}">${m.text}<div class="meta">${m.source==='campaign'?'<span style="background:#FFD700;padding:1px 4px;border-radius:4px;font-size:9px;font-weight:800">CAMPAÑA ${m.template_name||''}</span>':''}<span>${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div></div>`).join(''); box.scrollTop=box.scrollHeight;}
async function send(){const i=document.getElementById('msgInput'); if(!i.value.trim()||!currentWa) return; const t=i.value; i.value=''; document.getElementById('messages').innerHTML+=`<div class="msg out">${t}</div>`; await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:currentWa,message:t})}); openChat(currentWa);}
loadChats(); setInterval(loadChats,3000);
</script></body></html>
