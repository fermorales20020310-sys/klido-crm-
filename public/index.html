<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO AVANZA - CRM PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{display:flex;height:100vh;background:#0f172a;color:#fff}
.sidebar{width:260px;background:#111c30;border-right:1px solid #1e293b;padding:18px;display:flex;flex-direction:column}
.logo{font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:18px;letter-spacing:0.5px}
.logo span{font-size:10px;color:#94a3b8;font-weight:600;background:#1e293b;padding:2px 6px;border-radius:4px}
.badge{font-size:11px;background:#132a1e;color:#4ade80;padding:6px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;border:1px solid #1a3a26}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e}
.menu{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.menu a{padding:12px 14px;border-radius:10px;color:#94a3b8;text-decoration:none;display:flex;gap:10px;font-size:14px}
.menu a.active{background:#1a2b4a;color:#fff;font-weight:600}
.chats{width:360px;background:#162032;border-right:1px solid #1e293b;display:flex;flex-direction:column}
.chats h3{padding:16px;font-size:15px}
.search{margin:0 12px 12px 12px;background:#0f172a;border-radius:10px;padding:10px 12px;border:1px solid #1e293b}
.search input{width:100%;background:transparent;border:0;color:#fff;outline:none}
.chat-item{padding:12px 16px;border-bottom:1px solid #1e293b22;cursor:pointer}
.chat-item:hover,.chat-item.active{background:#1a2b4a}
.chat-item b{font-size:14px}
.chat-item p{font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;background:#0f172a}
.header{padding:12px 20px;background:#111c30;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px;height:60px}
.avatar{width:34px;height:34px;background:#1e3a8a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:65%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;word-break:break-word}
.recibido{background:#1e293b;align-self:flex-start}
.enviado{background:#0ea5e9;align-self:flex-end}
.msg a{color:#7dd3fc}
.msg img{max-width:220px;border-radius:10px;margin-top:6px;display:block}
.footer{padding:12px;display:flex;gap:10px;background:#111c30;border-top:1px solid #1e293b}
.footer input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:12px 18px;color:#fff;outline:none}
.footer button{background:#0ea5e9;border:0;color:#fff;padding:11px 22px;border-radius:24px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">🐙 KLIDO AVANZA <span>CRM PRO</span></div>
  <div class="badge"><span class="dot"></span> WhatsApp Conectado</div>
  <div class="menu">
    <a class="active">💬 Inbox</a>
    <a href="/campaigns.html">📢 Campaigns</a>
    <a href="/templates.html">📄 Templates</a>
  </div>
</div>

<div class="chats">
  <h3 id="chatCount">0 chats</h3>
  <div class="search"><input id="search" placeholder="Buscar contacto..."></div>
  <div id="chatList"></div>
</div>

<div class="main">
  <div class="header"><div class="avatar" id="avatarLetter">V</div><div><b id="chatName">Selecciona un chat</b><div style="font-size:11px;color:#94a3b8" id="chatPhone">Elige una conversación</div></div></div>
  <div class="messages" id="messages"><div style="color:#475569;text-align:center;margin-top:100px">👋 Selecciona un chat para ver los archivos</div></div>
  <div class="footer">
    <input id="msgInput" placeholder="Escribe un mensaje...">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
let currentWa = null;
let allChats = [];

async function loadChats(){
  try{
    const res = await fetch('/api/chats');
    const data = await res.json();
    // FIX undefined chats
    allChats = Array.isArray(data) ? data : (data.rows || data.chats || []);
    document.getElementById('chatCount').innerText = `${allChats.length} chats`;
    renderChats(allChats);
  }catch(e){
    document.getElementById('chatCount').innerText = `0 chats`;
  }
}

function renderChats(chats){
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  if(chats.length===0){ list.innerHTML='<div style="padding:20px;color:#64748b;font-size:13px">No hay chats aún</div>'; return; }
  chats.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.wa_id===currentWa?' active':'');
    const nombre = c.name || c.wa_id || 'Sin nombre';
    div.innerHTML = `<b>${nombre}</b><p>${(c.text||'').substring(0,40)}</p>`;
    div.onclick = ()=> openChat(c.wa_id, nombre);
    list.appendChild(div);
  });
}

async function openChat(wa_id, name){
  currentWa = wa_id;
  document.getElementById('chatName').innerText = name;
  document.getElementById('chatPhone').innerText = wa_id;
  document.getElementById('avatarLetter').innerText = name[0]?.toUpperCase()||'V';
  
  const res = await fetch(`/api/messages/${wa_id}`);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';
  
  msgs.forEach(m=>{
    const div = document.createElement('div');
    div.className = 'msg ' + (m.direction==='out' ? 'enviado' : 'recibido');
    let contenido = m.text || '';
    if(m.file_url){
      if(m.type==='image'){
        contenido = `${m.text}<br><a href="${m.file_url}" target="_blank"><img src="${m.file_url}"></a>`;
      } else if(m.type==='document'){
        contenido = `📄 <a href="${m.file_url}" target="_blank">${m.text} - Descargar</a>`;
      } else if(m.type==='audio'){
        contenido = `<audio controls src="${m.file_url}" style="width:200px"></audio><br>${m.text}`;
      } else {
        contenido = `<a href="${m.file_url}" target="_blank">📎 ${m.text}</a>`;
      }
    }
    const hora = new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.innerHTML = `${contenido}<div style="font-size:10px;opacity:0.6;margin-top:5px;text-align:right">${hora}</div>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentWa) return;
  await fetch('/api/send',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({to:currentWa, message:text}) });
  input.value='';
  openChat(currentWa, document.getElementById('chatName').innerText);
}

document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMessage(); });
document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  const filtered = allChats.filter(c=> (c.wa_id+(c.name||'')+(c.text||'')).toLowerCase().includes(q));
  renderChats(filtered);
});

loadChats();
setInterval(()=>{ if(currentWa){ fetch(`/api/messages/${currentWa}`).then(r=>r.json()).then(ms=>{ if(ms.length>document.getElementById('messages').children.length) openChat(currentWa, document.getElementById('chatName').innerText); }); } else loadChats(); }, 4000);
</script>
</body>
</html>
