<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klido CRM Pro</title>
<script>if(localStorage.getItem('klido_auth')!=='ok')location.href='/login.html';</script>
<style>
:root{--dark:#0A1931;--mid:#185ADB;--light:#E8F0FE;--bg:#Eef3ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui}
body{display:flex;height:100vh;background:var(--bg)}
#side{width:380px;background:var(--light);border-right:1px solid #c9d8f5;display:flex;flex-direction:column}
#topbar{background:linear-gradient(135deg,var(--dark),#143a7a);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
#topbar img{width:40px;height:40px;border-radius:12px;background:#fff;padding:4px}
#topbar .t{flex:1} #topbar .t b{font-size:15px;letter-spacing:1.5px;display:block} #topbar .t span{font-size:11px;opacity:.7}
.btn{border:none;cursor:pointer;font-weight:800;border-radius:10px;padding:9px 14px;font-size:12px;transition:.2s}
.btn-salir{background:rgba(255,59,48,.15);color:#ff6b60;border:1px solid rgba(255,59,48,.4)}
.btn-salir:hover{background:#ff3b30;color:#fff}
#search{margin:14px 14px 8px;padding:12px 16px;border-radius:14px;border:1.5px solid #b9ccf0;background:#fff;outline:none}
#list{flex:1;overflow-y:auto}
.chat{padding:14px 16px;border-bottom:1px solid #d8e3fa;display:flex;gap:12px;cursor:pointer;align-items:center;background:var(--light);transition:.15s}
.chat:hover{background:#dde8ff} .chat.on{background:#d6e4ff;border-left:4px solid var(--mid)}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.dot-red{width:12px;height:12px;background:#ff3b30;border-radius:50%;box-shadow:0 0 0 4px #ffd4d4;flex-shrink:0}
.dot-yellow{width:12px;height:12px;background:#ffcc00;border-radius:50%;box-shadow:0 0 0 4px #fff0b3;flex-shrink:0}
#campWrap{padding:16px;background:var(--light);border-top:1px solid #c9d8f5}
#campBtn{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;text-decoration:none;padding:14px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(24,90,219,.3)}
#main{flex:1;display:flex;flex-direction:column}
#chead{background:var(--dark);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}
#chead img{width:36px;height:36px;border-radius:50%;background:#fff;padding:3px}
#msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.m{max-width:72%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.in{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}
.out{background:linear-gradient(135deg,var(--mid),#2f6bff);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
#box{padding:16px 20px;background:var(--light);display:flex;gap:12px;border-top:1px solid #c9d8f5}
#box input{flex:1;padding:14px 18px;border-radius:14px;border:1.5px solid #b9ccf0;background:#fff;outline:none}
#box button{padding:14px 26px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;font-weight:800;cursor:pointer}
</style></head><body>
<div id="side">
<div id="topbar"><img src="/logo.png" onerror="this.style.display='none'"><div class="t"><b>KLIDO CRM</b><span>WhatsApp Business Platform</span></div><button class="btn btn-salir" onclick="localStorage.removeItem('klido_auth');location.href='/login.html'">⟲ Salir</button></div>
<input id="search" placeholder="🔍 Buscar por número..." oninput="render()">
<div id="list"></div>
<div id="campWrap"><a id="campBtn" href="/campaigns.html">📢 GESTIONAR CAMPAÑAS</a></div>
</div>
<div id="main">
<div id="chead" style="display:none"><img src="/logo.png" onerror="this.style.display='none'"><div><b id="cname"></b><div style="font-size:11px;opacity:.7">Historial completo • Tiempo real</div></div></div>
<div id="msgs"><div style="text-align:center;margin-top:80px;color:var(--dark)"><div style="font-size:48px">💬</div><h3>Bienvenido a Klido CRM Pro</h3><p style="color:#5a6a85;font-size:13px;margin-top:8px">Selecciona una conversación para ver historial, archivos y mensajes en tiempo real.<br>🔴 No leído • 🟡 Campaña</p></div></div>
<div id="box" style="display:none"><input id="txt" placeholder="Escribe un mensaje profesional..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Enviar ➤</button></div>
</div>
<script>
let chats=[],cur=null;
async function load(){try{const r=await fetch('/api/chats');chats=await r.json();render();}catch(e){}}
function render(){
const q=document.getElementById('search').value;const L=document.getElementById('list');
let f=chats.filter(c=>!q||c.wa_id.includes(q));f.sort((a,b)=>(b.unread_count||0)-(a.unread_count||0));
L.innerHTML=f.map(c=>{const isCamp=c.text&&c.text.includes('[Plantilla');const dot=c.unread_count>0?'<div class="dot-red" title="No leído"></div>':(isCamp?'<div class="dot-yellow" title="Campaña"></div>':'');
return `<div class="chat ${cur===c.wa_id?'on':''}" onclick="openC('${c.wa_id}')"><div class="av">${c.wa_id.slice(-2)}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#0A1931;font-size:14px">${c.wa_id}</b></div><div style="font-size:13px;color:#4a5a7a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.text||''}</div></div>${dot}</div>`}).join('')||'<div style="padding:30px;text-align:center;color:#5a6a85;font-size:13px">No hay conversaciones aún</div>';
}
async function openC(id){cur=id;document.getElementById('chead').style.display='flex';document.getElementById('box').style.display='flex';document.getElementById('cname').textContent=id;await fetch('/api/chats/'+id+'/read',{method:'PUT'});const r=await fetch('/api/messages/'+id);const ms=await r.json();const M=document.getElementById('msgs');
M.innerHTML=ms.map(m=>{let body=m.text||'';if(m.media_url){if((m.media_type||'').includes('image'))body=`<img src="${m.media_url}" style="max-width:260px;border-radius:12px"><div style="margin-top:6px">${m.text||''}</div>`;else if((m.media_type||'').includes('audio'))body=`<audio controls src="${m.media_url}" style="max-width:260px"></audio>`;else if((m.media_type||'').includes('video'))body=`<video controls src="${m.media_url}" style="max-width:260px;border-radius:12px"></video>`;else body=`<a href="${m.media_url}" target="_blank" style="color:#185ADB;font-weight:700">📎 Ver archivo adjunto</a>`;}
return `<div class="m ${m.direction==='in'?'in':'out'}">${body}<div style="font-size:10px;opacity:.6;margin-top:6px">${new Date(m.created_at).toLocaleString()} ${m.source==='campaign'?'• 📢 Campaña':''}</div></div>`}).join('');M.scrollTop=M.scrollHeight;load();}
async function send(){const t=document.getElementById('txt').value.trim();if(!t||!cur)return;document.getElementById('txt').value='';await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:cur,message:t})});openC(cur);}
load();setInterval(load,4000);
</script></body></html>
