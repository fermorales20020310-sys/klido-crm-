<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLIDO PRO</title>
<style>
:root{--bg:#fff;--side:#f8f9fa;--chat:#efeae2;--tx:#111;--in:#fff;--out:#d9fdd3}
body.dark{--bg:#0b141a;--side:#111b21;--chat:#0b141a;--tx:#e9edef;--in:#1f2c34;--out:#005c4b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}
#sidebar{width:330px;background:var(--side);border-right:1px solid #ddd;display:flex;flex-direction:column}
#top{padding:10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}
#top .left{display:flex;align-items:center;gap:8px}
#top img{height:38px;width:auto;max-width:140px;object-fit:contain;display:block}
#chats{flex:1;overflow-y:auto}
.chat{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}
.chat:hover{background:#eee}body.dark .chat:hover{background:#1f2c34}
.chat.unread{font-weight:700}.dot{width:9px;height:9px;background:#ff3b30;border-radius:50%;display:inline-block;margin-right:6px}
#main{flex:1;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:20px;background:var(--chat);display:flex;flex-direction:column}
.msg{max-width:70%;padding:8px 12px;margin:5px 0;border-radius:8px;word-break:break-word}
.in{background:var(--in);align-self:flex-start}.out{background:var(--out);align-self:flex-end}
#bar{padding:12px;display:flex;gap:8px;background:var(--bg)}
#bar input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px}
#bar button{padding:12px 18px;border:none;background:#00a884;color:#fff;border-radius:8px}
</style>
</head>
<body>
<div id="sidebar">
<div id="top">
<div class="left">
<img src="./logo.png" alt="KLIDO PRO" onerror="this.style.display='none';document.getElementById('fallback').style.display='block'">
<b id="fallback" style="display:none">KLIDO PRO</b>
</div>
<div style="display:flex;gap:6px;align-items:center">
<select id="agencySel"><option value="tu_empresa">Mi empresa</option><option value="agencia_piloto">Piloto</option></select>
<button id="themeBtn">🌙</button>
</div>
</div>
<div id="chats"></div>
</div>
<div id="main">
<div id="msgs"></div>
<div id="bar"><input id="txt" placeholder="Escribe..."><button onclick="send()">Enviar</button></div>
</div>
<script>
let cur=null;const ag=()=>document.getElementById('agencySel').value;
const pop=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-message-pop-alert-2354.mp3');let lastU=0;
const tb=document.getElementById('themeBtn');
if(localStorage.getItem('klido-theme')==='dark'){document.body.classList.add('dark');tb.textContent='☀️'}
tb.onclick=()=>{const d=document.body.classList.toggle('dark');localStorage.setItem('klido-theme',d?'dark':'light');tb.textContent=d?'☀️':'🌙'};
async function loadChats(){const r=await fetch('/api/chats?agency_id='+ag());const cs=await r.json();const u=cs.filter(c=>c.unread).length;if(u>lastU)pop.play().catch(()=>{});lastU=u;document.getElementById('chats').innerHTML=cs.map(c=>`<div class="chat ${c.unread?'unread':''}" onclick="openChat('${c.wa_id}')">${c.unread?'<span class="dot"></span>':''}<b>${c.name}</b><br><small>${(c.lastMessage||'').substring(0,40)}</small></div>`).join('');}
async function openChat(wa){cur=wa;await fetch('/api/chats/'+wa+'/read?agency_id='+ag(),{method:'POST'});const r=await fetch('/api/messages/'+wa+'?agency_id='+ag());const ms=await r.json();document.getElementById('msgs').innerHTML=ms.map(m=>{let h=m.text||'';if(m.media_type==='image'&&m.media_url)h=`<img src="${m.media_url}" style="max-width:220px;border-radius:8px"><br>${h}`;if(m.media_type==='audio'&&m.media_url)h=`<audio controls src="${m.media_url}" style="max-width:220px"></audio>`;if(m.media_type==='video'&&m.media_url)h=`<video controls src="${m.media_url}" style="max-width:220px"></video>`;return `<div class="msg ${m.direction==='in'?'in':'out'}">${h}</div>`}).join('');document.getElementById('msgs').scrollTop=1e9;loadChats();}
async function send(){const t=document.getElementById('txt').value;if(!t||!cur)return;await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:cur,text:t,agency_id:ag()})});document.getElementById('txt').value='';openChat(cur);}
document.getElementById('agencySel').onchange=()=>{cur=null;document.getElementById('msgs').innerHTML='';loadChats();};
setInterval(loadChats,3000);loadChats();
</script>
</body>
</html>
