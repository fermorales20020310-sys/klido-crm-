<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO GOLD CRM</title>
<style>
:root{--bg:#0a1931;--bg2:#10254d;--panel:#0f2347;--acc:#4da6ff;--acc2:#1e90ff;--tx:#fff;--mu:#8aa0c2}
body.light{--bg:#e8f1ff;--bg2:#d0e4ff;--panel:#fff;--tx:#0a1931;--mu:#5a6d8a}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--tx);height:100vh}
#loginDiv{position:fixed;inset:0;background:#071224;display:flex;align-items:center;justify-content:center;z-index:99}
.lbox{background:#0f2347;border:2px solid var(--acc);border-radius:18px;padding:32px;width:340px;text-align:center;color:#fff}
.lbox img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:12px;margin-bottom:8px}
.lbox input{width:100%;padding:11px;margin:7px 0;border-radius:10px;border:1px solid var(--acc);background:#071224;color:#fff}
.btn{background:var(--acc2);color:#fff;border:0;padding:11px;border-radius:10px;font-weight:700;cursor:pointer;width:100%}
#app{display:none;height:100vh}.side{width:340px;background:var(--panel);border-right:2px solid var(--acc);display:flex;flex-direction:column}
.sh{padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--acc)}.sh img{width:42px;height:42px;background:#fff;border-radius:8px;object-fit:contain}
.clist{flex:1;overflow-y:auto}.chat{padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1e3a6e;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%}.tag{font-size:10px;background:var(--acc);color:#fff;padding:2px 8px;border-radius:10px;margin-left:6px}
.main{flex:1;display:flex;flex-direction:column}.mh{padding:14px;background:var(--panel);border-bottom:2px solid var(--acc);display:flex;justify-content:space-between}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.m{max-width:72%;padding:10px 13px;border-radius:14px;font-size:14px}.m.in{background:#1e3a6e;color:#fff;align-self:flex-start;border-left:4px solid transparent}
.m.in.camp{border-left-color:#ffdd00;background:#333000}.m.out{background:var(--acc2);color:#fff;align-self:flex-end}
.m img{max-width:230px;border-radius:10px}.bar{padding:12px;background:var(--panel);display:flex;gap:10px}
.bar input{flex:1;padding:12px;border-radius:22px;border:1px solid var(--acc);background:var(--bg);color:var(--tx)}
.tb{display:flex;gap:6px;padding:10px;flex-wrap:wrap}.tb button{padding:6px 9px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;font-size:12px}
.hid{display:none!important}.pad{padding:14px}
</style></head><body>
<div id="loginDiv"><div class="lbox"><img src="logo.png"><h2 style="color:#4da6ff">KLIDO GOLD</h2>
<input id="ag" placeholder="agencia" value="acol"><input id="us" placeholder="usuario"><input id="pw" type="password" placeholder="contraseña">
<button class="btn" onclick="doLogin()">Ingresar</button><div id="lerr" style="color:#ff8080;margin-top:8px;font-size:13px"></div></div></div>
<div id="app" style="display:none"><div class="side"><div class="sh"><img src="logo.png"><b>KLIDO GOLD</b><button onclick="document.body.classList.toggle('light')" style="margin-left:auto;background:none;border:0;font-size:18px;cursor:pointer">🌓</button></div>
<div class="tb"><button onclick="sec('c')">Chats</button><button onclick="sec('p')">Campañas</button></div>
<div id="s-c" class="clist"></div>
<div id="s-p" class="clist hid"><div class="pad"><h4>Campaña (50 cada 6h anti-baneo)</h4><select id="tpl" style="width:100%;margin:6px 0;padding:8px"></select><input type="file" id="ex" accept=".xlsx,.csv"><button class="btn" onclick="upCamp()">Subir Excel y encolar</button><div id="cl"></div></div></div>
</div><div class="main"><div class="mh"><b id="cn">Chat</b><select id="tagSel" onchange="setTag()"><option value="nuevo">nuevo</option><option value="interesado">interesado</option><option value="cliente">cliente</option><option value="descartado">descartado</option></select></div><div id="msgs"></div><div class="bar"><input id="mi" placeholder="Escribe..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" style="width:90px" onclick="sendMsg()">Enviar</button></div></div></div>
<audio id="nt" src="https://notificationsounds.com/storage/sounds/file-sounds-1150-pristine.mp3"></audio>
<script>
let AG='',WA=null,lastN=0;
async function doLogin(){
  AG=document.getElementById('ag').value.trim();
  let u=document.getElementById('us').value.trim();
  let p=document.getElementById('pw').value;
  document.getElementById('lerr').textContent='Conectando...';
  try{
    let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:AG,username:u,password:p})});
    if(!r.ok){document.getElementById('lerr').textContent='Login incorrecto';return;}
    document.getElementById('loginDiv').style.display='none';
    document.getElementById('app').style.display='flex';
    loadC();loadTpl();setInterval(loadC,5000);
  }catch(e){document.getElementById('lerr').textContent='Error red';}
}
function sec(x){document.getElementById('s-c').classList.toggle('hid',x!=='c');document.getElementById('s-p').classList.toggle('hid',x!=='p');if(x==='p')loadCamp();}
async function loadC(){
  let r=await fetch('/api/chats?agency_id='+encodeURIComponent(AG));let cs=await r.json();
  let el=document.getElementById('s-c');el.innerHTML='';
  cs.forEach(c=>{
    let d=document.createElement('div');d.className='chat';
    d.innerHTML='<div class="dot" style="background:'+(c.dot||'transparent')+'"></div><div style="flex:1"><b style="font-size:13px">'+(c.name||c.wa_id)+'</b><span class="tag">'+c.tag+'</span><div style="font-size:12px;color:var(--mu)">'+(c.lastMessage||'')+'</div></div>';
    d.onclick=()=>openC(c.wa_id,c.name);el.appendChild(d);
  });
}
async function openC(wa,n){WA=wa;document.getElementById('cn').textContent=n||wa;await fetch('/api/chats/'+wa+'/read?agency_id='+AG,{method:'POST'});loadM();loadC();}
async function loadM(){
  if(!WA)return;let r=await fetch('/api/messages/'+WA+'?agency_id='+AG);let ms=await r.json();
  let el=document.getElementById('msgs');el.innerHTML='';
  ms.forEach(m=>{
    let d=document.createElement('div');d.className='m '+(m.direction==='in'?'in':'out')+(m.is_campaign&&m.direction==='in'?' camp':'');
    let h='';
    if(m.media_type==='image'&&m.media_url) h='<img src="/api/media?mid='+m.media_url+'">';
    else if(m.media_type==='audio'&&m.media_url) h='<audio controls src="/api/media?mid='+m.media_url+'" style="width:200px"></audio>';
    else h=(m.text||'').replace(/</g,'&lt;');
    if(m.is_campaign) h='🟡 '+h;
    d.innerHTML=h;el.appendChild(d);
  });
  el.scrollTop=el.scrollHeight;
  if(ms.length>lastN&&lastN>0){document.getElementById('nt').play().catch(()=>{});}lastN=ms.length;
}
async function sendMsg(){let t=document.getElementById('mi').value.trim();if(!t||!WA)return;await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:WA,text:t,agency_id:AG})});document.getElementById('mi').value='';loadM();}
async function setTag(){await fetch('/api/chats/'+WA+'/tag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag:document.getElementById('tagSel').value,agency_id:AG})});loadC();}
async function loadTpl(){let r=await fetch('/api/templates?agency_id='+AG);let l=await r.json();document.getElementById('tpl').innerHTML=l.map(t=>'<option>'+t.name+'</option>').join('');}
async function upCamp(){let f=document.getElementById('ex').files[0];if(!f)return alert('sube excel');let rd=new FileReader();rd.onload=async()=>{let r=await fetch('/api/campaigns/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:AG,template:document.getElementById('tpl').value,fileBase64:rd.result})});let j=await r.json();alert('Encolados '+j.total);loadCamp();};rd.readAsDataURL(f);}
async function loadCamp(){let r=await fetch('/api/campaigns?agency_id='+AG);let l=await r.json();document.getElementById('cl').innerHTML=l.map(c=>'<div style="border:1px solid var(--acc);padding:8px;border-radius:8px;margin-top:8px;font-size:13px">#'+c.id+' '+c.template+' '+c.sent+'/'+c.total+' '+c.status+'</div>').join('');}
setInterval(()=>{if(WA)loadM();},4000);
</script></body></html>
