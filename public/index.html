<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klido CRM Pro</title>
<style>:root{--dark:#0A1931;--mid:#185ADB;--light:#E8F0FE;--bg:#F4F6FB}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Roboto}body{display:flex;height:100vh;background:var(--bg)}
#sidebar{width:390px;background:white;display:flex;flex-direction:column;border-right:1px solid #e6ebf3}
#topbar{background:linear-gradient(135deg,var(--dark),#132E57);padding:14px 16px;display:flex;align-items:center;gap:12px}
#topbar img{width:40px;height:40px;border-radius:12px;background:white;padding:4px;object-fit:contain}
#topbar div b{color:white;font-size:15px;letter-spacing:.5px;display:block}#topbar div span{color:#8fb0e3;font-size:11px}
#topbar a{margin-left:auto;background:var(--mid);color:white;padding:8px 16px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:800}
#stats{display:flex;gap:8px;padding:12px;background:var(--light)}
.stat{flex:1;background:white;border-radius:10px;padding:8px;text-align:center;border:1px solid #dbe7ff}.stat b{display:block;color:var(--dark);font-size:16px}.stat span{font-size:10px;color:#6b7a90;font-weight:700}
#filters{display:flex;gap:6px;padding:10px 12px}.filter{flex:1;text-align:center;padding:8px;border-radius:10px;border:1.5px solid #e6ebf3;font-size:11px;font-weight:800;cursor:pointer;color:var(--dark);background:white}.filter.active{background:var(--dark);color:white;border-color:var(--dark)}
#search{padding:0 12px 12px}#search input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #e6ebf3;background:#f8fafd;outline:none}
#chats{flex:1;overflow:auto}.chat{padding:12px 14px;border-bottom:1px solid #f1f4f9;display:flex;gap:12px;cursor:pointer}.chat:hover{background:var(--light)}.chat.active{background:#e3ecff;border-left:4px solid var(--mid)}.chat.unread{background:#fff6f6;border-left:4px solid #ff3b30}.avatar{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--dark),var(--mid));color:white;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}.badges{margin-top:5px;display:flex;gap:5px}.b-camp{background:#FFD700;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:900}.b-unread{background:#ff3b30;color:white;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:800}
#main{flex:1;display:flex;flex-direction:column}#mainHeader{background:linear-gradient(135deg,var(--dark),#1a3a6b);padding:14px 22px;color:white;display:flex;align-items:center;gap:14px}#mainHeader img{width:42px;height:42px;border-radius:12px;background:white;padding:3px}
#messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#eef3ff 0%,var(--bg) 100%)}.msg{max-width:60%;padding:11px 15px;border-radius:16px;font-size:14px;box-shadow:0 2px 8px rgba(10,25,49,.08)}.msg.in{background:white;align-self:flex-start;border-bottom-left-radius:6px}.msg.out{background:linear-gradient(135deg,var(--mid),#2f6df6);color:white;align-self:flex-end;border-bottom-right-radius:6px}.meta{font-size:10px;opacity:.7;margin-top:5px;display:flex;gap:6px;justify-content:flex-end}
#inputArea{padding:14px 18px;background:white;display:flex;gap:10px;border-top:1px solid #e6ebf3}#inputArea input{flex:1;padding:14px 18px;border-radius:14px;border:1.5px solid #e6ebf3;background:#f8fafd;outline:none}#inputArea button{width:50px;height:50px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--dark),var(--mid));color:white;font-size:18px;cursor:pointer}
</style></head><body>
<div id="sidebar"><div id="topbar"><img src="/logo.png" onerror="this.style.display='none'"><div><b>KLIDO CRM PRO</b><span>Azul profesional</span></div><a href="/campaigns.html">📢</a></div>
<div id="stats"><div class="stat"><b id="sTotal">0</b><span>TOTAL</span></div><div class="stat"><b id="sUnread" style="color:#ff3b30">0</b><span>SIN LEER</span></div><div class="stat"><b id="sCamp" style="color:#b89500">0</b><span>CAMPAÑA</span></div></div>
<div id="filters"><div class="filter active" data-f="all" onclick="setFilter('all')">Todos</div><div class="filter" data-f="unread" onclick="setFilter('unread')">🔴 Sin leer</div><div class="filter" data-f="camp" onclick="setFilter('camp')">🟡 Campaña</div></div>
<div id="search"><input id="q" placeholder="🔍 Buscar..." oninput="render()"></div><div id="chats"></div></div>
<div id="main"><div id="mainHeader"><img src="/logo.png" onerror="this.style.display='none'"><div><b id="cName" style="font-size:15px">Selecciona un chat</b><div id="cSub" style="font-size:12px;color:#8fb0e3">Panel profesional Klido</div></div></div>
<div id="messages"><div style="margin:auto;text-align:center;color:#8a9ab5"><img src="/logo.png" style="width:90px;border-radius:20px;background:white;padding:10px;margin-bottom:12px" onerror="this.style.display='none'"><h3 style="color:var(--dark)">Klido CRM Pro 🔵</h3><p style="font-size:13px;margin-top:6px">Selecciona un chat para ver el historial eterno</p></div></div>
<div id="inputArea" style="display:none"><input id="msgInput" placeholder="Escribe un mensaje profesional..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div></div>
<script>
if(localStorage.getItem('klido_auth')!=='ok'&&location.pathname.includes('index')) location.href='/';
let allChats=[],currentWa=null,filter='all';
async function loadChats(){const r=await fetch('/api/chats');allChats=await r.json();document.getElementById('sTotal').textContent=allChats.length;document.getElementById('sUnread').textContent=allChats.filter(c=>c.unanswered).length;document.getElementById('sCamp').textContent=allChats.filter(c=>c.source==='campaign'||c.template_name).length;render();}
function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(e=>e.classList.toggle('active',e.dataset.f===f));render();}
function render(){const q=(document.getElementById('q').value||'').toLowerCase();let list=allChats.filter(c=>{if(filter==='unread'&&!c.unanswered)return false;if(filter==='camp'&&(c.source!=='campaign'&&!c.template_name))return false;if(q&&!c.wa_id.includes(q))return false;return true;});
document.getElementById('chats').innerHTML=list.map(c=>{const isCamp=c.source==='campaign'||!!c.template_name;const isUnread=c.unanswered;const time=new Date(c.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `<div class="chat ${isUnread?'unread':''} ${currentWa===c.wa_id?'active':''}" onclick="openChat('${c.wa_id}')"><div class="avatar">${c.wa_id.slice(-2)}</div><div style="flex:1;overflow:hidden"><div style="display:flex;justify-content:space-between"><b style="font-size:14px;color:#0A1931">${c.wa_id}</b><span style="font-size:11px;color:#8a9ab5">${time}</span></div><div style="font-size:13px;color:#6b7a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(c.text||'').slice(0,38)}</div><div class="badges">${isCamp?'<span class="b-camp">CAMPAÑA</span>':''}${isUnread?`<span class="b-unread">● SIN LEER ${c.unread_count||''}</span>`:''}</div></div></div>`;}).join('');}
async function openChat(wa){currentWa=wa;document.getElementById('inputArea').style.display='flex';document.getElementById('cName').textContent=wa;fetch(`/api/chats/${wa}/read`,{method:'PUT'});const r=await fetch('/api/messages/'+wa);const msgs=await r.json();const box=document.getElementById('messages');box.innerHTML=msgs.map(m=>`<div class="msg ${m.direction==='in'?'in':'out'}">${m.text}<div class="meta">${m.source==='campaign'?`<span style="background:#FFD700;color:#000;padding:2px 6px;border-radius:6px;font-weight:800">CAMPAÑA</span>`:''}<span>${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div></div>`).join('');box.scrollTop=box.scrollHeight;render();}
async function send(){const i=document.getElementById('msgInput');if(!i.value.trim())return;const t=i.value;i.value='';await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:currentWa,message:t})});openChat(currentWa);loadChats();}
loadChats();setInterval(loadChats,3000);
</script></body></html>
