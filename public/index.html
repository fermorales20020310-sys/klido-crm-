<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO Avanza Consulting - CRM Pro</title><style>/* COPIA AQUI TODO EL CSS DARK DEL V213 */*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#0b1020;color:#e2e8f0;height:100vh;overflow:hidden}.app{display:flex;flex-direction:column;height:100vh;padding:12px}.topbar{height:56px;background:#131b2e;border:1px solid #1e2a4a;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand img{width:32px;height:32px;border-radius:8px;background:#fff;object-fit:contain}.main{flex:1;display:flex;background:#131b2e;border:1px solid #1e2a4a;border-top:0;border-radius:0 0 14px 14px;overflow:hidden}.menu{width:200px;background:#0f172a;border-right:1px solid #1e2a4a;padding:12px}.m{padding:10px 12px;border-radius:10px;margin:4px 0;cursor:pointer;color:#94a3b8}.m.active{background:#3b82f6;color:#fff}.inbox{width:340px;background:#0f172a;border-right:1px solid #1e2a4a;display:flex;flex-direction:column}.chat{flex:1;background:#0f172a;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}.b{max-width:65%;padding:10px 12px;border-radius:14px;font-size:13px}.b.cli{background:#1e293b;align-self:flex-start}.b.age{background:#bfdbfe;color:#000;align-self:flex-end}.profile{width:300px;background:#0f172a;border-left:1px solid #1e2a4a;padding:14px}</style></head><body><div class="app"><div class="topbar"><div class="brand"><img src="/logo.png"><span>KLIDO Avanza Consulting</span><span style="background:#3b82f6;padding:4px 10px;border-radius:20px;font-size:12px;margin-left:8px">Pro Plan</span></div><div id="uInfo"></div></div><div class="main"><div class="menu"><div class="m active">💬 Inbox</div><div class="m">👥 Contacts</div><div class="m">📢 Campaigns</div><div class="m">📊 Analytics</div><div class="m">⚙️ Settings</div><button onclick="document.getElementById('login').style.display='flex'" style="width:100%;margin-top:20px;padding:8px;border-radius:8px;background:#1e293b;border:1px solid #2a3a5c;color:#fff">Login</button></div><div class="inbox"><div style="padding:14px;border-bottom:1px solid #1e2a4a"><b>Inbox</b><input id="q" placeholder="Search..." style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #2a3a5c;background:#1e293b;color:#fff"></div><div id="list" style="flex:1;overflow:auto"></div></div><div class="chat"><div style="padding:14px;border-bottom:1px solid #1e2a4a"><b id="chatName">Selecciona un chat</b></div><div class="msgs" id="msgs"></div><div style="padding:10px;border-top:1px solid #1e2a4a;display:flex;gap:8px"><input id="txt" placeholder="Type a message..." style="flex:1;padding:10px;border-radius:20px;border:1px solid #2a3a5c;background:#1e293b;color:#fff"><button onclick="send()" style="width:40px;height:40px;border-radius:50%;background:#3b82f6;border:0;color:#fff">▶</button></div></div><div class="profile"><b>Customer Profile</b><div id="pBox" style="margin-top:12px;font-size:13px;color:#94a3b8"></div></div></div></div>
<div id="login" style="position:fixed;inset:0;background:#0b1020e6;display:flex;align-items:center;justify-content:center"><div style="background:#131b2e;border:1px solid #1e2a4a;border-radius:14px;padding:20px;width:360px"><h3>Login KLIDO</h3><select id="eid" style="width:100%;padding:8px;margin:4px 0;background:#0f172a;color:#fff;border:1px solid #2a3a5c;border-radius:8px"></select><input id="le" placeholder="Email" style="width:100%;padding:8px;margin:4px 0;background:#0f172a;color:#fff;border:1px solid #2a3a5c;border-radius:8px"><input id="lp" type="password" placeholder="Pass" style="width:100%;padding:8px;margin:4px 0;background:#0f172a;color:#fff;border:1px solid #2a3a5c;border-radius:8px"><button onclick="login()" style="width:100%;padding:10px;background:#3b82f6;border:0;border-radius:8px;color:#fff;font-weight:700">Entrar</button><div id="msg" style="font-size:12px;color:#f87171"></div><button onclick="this.parentElement.parentElement.style.display='none'" style="width:100%;margin-top:8px;padding:6px;background:transparent;border:1px solid #2a3a5c;color:#94a3b8;border-radius:8px">Cerrar</button></div></div>
<script>let S={},cur=null;async function loadEmpresas(){const r=await fetch('/api/empresas');const emps=await r.json();const s=document.getElementById('eid');s.innerHTML='';emps.forEach(e=>{const o=document.createElement('option');o.value=e.empresa_id;o.textContent=e.nombre+' '+(e.activo?'✅':'🔒');s.appendChild(o);});}
async function login(){const eid=document.getElementById('eid').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:eid,email:le.value,pass:lp.value})});const j=await r.json();if(!j.ok){msg.innerText=j.bloqueado?'PLAN BLOQUEADO':j.error;return;}S={eid, user:j.user};document.getElementById('login').style.display='none';loadChats();}
async function loadChats(){if(!S.eid) return;const r=await fetch('/api/chats/'+S.eid+'/admin');const chats=await r.json();const q=document.getElementById('q').value.toLowerCase();list.innerHTML='';chats.filter(c=>!q||c.id.includes(q)).forEach(c=>{const d=document.createElement('div');d.style.padding='10px';d.style.borderBottom='1px solid #1e2a4a';d.style.cursor='pointer';d.innerHTML='<b>'+c.id+'</b><br><small style=color:#94a3b8>'+(c.mensajes?.slice(-1)[0]?.texto||'').slice(0,30)+'</small>';d.onclick=()=>openChat(c.id);list.appendChild(d);});}
async function openChat(id){cur=id;const r=await fetch('/api/mensajes/'+S.eid+'/'+id);const j=await r.json();chatName.innerText=j.profile.nombre||id;pBox.innerHTML=id;const m=msgs;m.innerHTML='';(j.mensajes||[]).forEach(x=>{const d=document.createElement('div');d.className='b '+(x.from==='agente'?'age':'cli');d.innerText=x.texto;m.appendChild(d);});m.scrollTop=m.scrollHeight;}
async function send(){const t=txt.value;if(!t||!cur) return;txt.value='';await fetch('/api/mensaje/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:S.eid,chat_id:cur,texto:t})});openChat(cur);}q.addEventListener('input',loadChats);setInterval(loadChats,3000);loadEmpresas();</script></body></html>
