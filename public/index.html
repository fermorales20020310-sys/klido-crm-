<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO AVANZA</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');*{font-family:Inter}body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#2563eb}.card{background:#fff;padding:32px;border-radius:18px;width:360px;box-shadow:0 20px 40px rgba(0,0,0,.2);text-align:center}input{width:100%;padding:12px;margin:8px 0;border:1px solid #e2e8f0;border-radius:10px;box-sizing:border-box}button{width:100%;padding:12px;background:#111827;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin-top:10px}</style>
</head><body><div class="card"><img src="logo.png" style="height:50px"><h2>KLIDO AVANZA</h2><input id="u" placeholder="Usuario"><input id="p" type="password" placeholder="Clave"><button onclick="login()">Entrar</button><p id="e" style="color:red;font-size:12px"></p></div>
<script>function login(){if(u.value==='admin'&&p.value==='alion2025'){localStorage.setItem('klido_auth','1');location.href='/bandeja'}else e.innerText='Credenciales incorrectas'}</script></body></html>
