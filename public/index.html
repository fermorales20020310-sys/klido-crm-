<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO AVANZA - CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a101f;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:#111a2f;border-right:1px solid #1e2a45;padding:24px;display:flex;flex-direction:column}
.logo-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo-wrap img{width:52px;height:52px;border-radius:14px;background:#0e172c;object-fit:contain;padding:6px;border:1px solid #1e2a45}
.logo-wrap h1{font-size:14px;line-height:1.1;font-weight:700}.logo-wrap h1 span{color:#38bdf8;font-size:10px;font-weight:400;letter-spacing:1px}
.status{font-size:12px;background:#132036;padding:7px 12px;border-radius:20px;display:flex;align-items:center;gap:8px;margin-bottom:28px;width:fit-content;border:1px solid #1e2a45}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 10px #22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav button{background:transparent;border:none;color:#94a3b8;padding:13px 14px;border-radius:12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;transition:0.2s}
.nav button.active{background:#1a2744;color:white;border:1px solid #24365f}
.nav button:hover{background:#16233f;color:white}
.upgrade{margin-top:auto;background:linear-gradient(135deg,#0ea5e9,#38bdf8);padding:12px;border-radius:12px;text-align:center;font-weight:700;cursor:pointer;border:none;color:white}
.main{flex:1;display:flex}
.list{width:380px;background:#0f1a30;border-right:1px solid #1e2a45;display:flex;flex-direction:column}
.list-head{padding:20px;border-bottom:1px solid #1e2a45}
.search{width:100%;background:#16233f;border:1px solid #1e2a45;padding:11px 14px;border-radius:12px;color:white;outline:none}
.search:focus{border-color:#0ea5e9}
.filters{display:flex;gap:8px;margin-top:14px}
.filters button{padding:6px 14px;border-radius:20px;border:1px solid #1e2a45;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px}
.filters button.active{background:#0ea5e9;color:white;border-color:#0ea5e9}
.contacts{flex:1;overflow-y:auto}
.contact{padding:16px 20px;border-bottom:1px solid #16233f;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:0.2s}
.contact:hover{background:#16233f}.contact.active{background:#1a2744;border-left:3px solid #0ea5e9}
.contact b{font-size:14px}.contact small{color:#64748b;font-size:12px;display:block;margin-top:2px}
.unread{background:#0ea5e9;color:white;font-size:11px;padding:3px 8px;border-radius:12px;font-weight:700}
.chat{flex:1;display:flex;flex-direction:column;background:#0a101f;position:relative}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0.7;text-align:center}
.chat-empty img{width:100px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(14,165,233,0.3))}
.msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:68%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.in{background:#1a2744;align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:#0ea5e9;align-self:flex-end;border-bottom-right-radius:4px;color:white}
.input-bar{padding:16px;background:#111a2f;border-top:1px solid #1e2a45;display:flex;gap:12px;align-items:center}
.input-bar input{flex:1;background:#16233f;border:1px solid #1e2a45;padding:13px 18px;border-radius:14px;color:white;outline:none}
.input-bar button{background:#0ea5e9;border:none;width:46px;height:46px;border-radius:12px;color:white;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.profile{width:300px;background:#0f1a30;border-left:1px solid #1e2a45;padding:24px;display:flex;flex-direction:column;gap:16px}
.profile h3{font-size:14px;color:#94a3b8}.profile.avatar{width:64px;height:64px;background:#0ea5e9;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-bottom:12px}
.btn-profile{padding:12px;background:#0ea5e9;border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo-wrap"><img src="logo.png" alt="K"><h1>KLIDO<br>AVANZA<br><span>CRM BDNS & WA</span></h1></div>
<div class="status"><div class="dot"></div> WhatsApp Conectado</div>
<div class="nav">
<button class="active" onclick="location.href='index.html'">💬 Inbox</button>
<button onclick="location.href='index.html'">👥 Contacts</button>
<button onclick="location.href='campanas.html'">📢 Campaigns</button>
<button onclick="location.href='campanas.html'">⚡ Automation</button>
<button onclick="location.href='index.html'">📊 Analytics</button>
<button onclick="location.href='campanas.html'">📄 Templates</button>
</div>
<button class="upgrade" onclick="location.href='campanas.html'">Upgrade Pro</button>
</div>

<div class="main">
<div class="list">
<div class="list-head">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="font-size:16px">Inbox</h2><span id="count" style="background:#1a2744;padding:4px 10px;border-radius:20px;font-size:12px">0 chats</span></div>
<input class="search" id="search" placeholder="🔍 Buscar..." oninput="filterContacts()">
<div class="filters"><button class="active">Todos</button><button>No leídos</button></div>
</div>
<div class="contacts" id="contacts"><p style="padding:20px;opacity:0.5">Cargando chats...</p></div>
</div>

<div class="chat" id="chatArea">
<div class="chat-empty" id="empty">
<img src="logo.png">
<h3>Selecciona un chat</h3>
<p style="color:#64748b;font-size:13px;margin-top:6px">Elige una conversación de la izquierda</p>
</div>
<div class="msgs" id="msgs" style="display:none"></div>
<div class="input-bar" id="inputBar" style="display:none">
<input id="msgInput" placeholder="Escribe un mensaje...">
<button onclick="sendMsg()">➤</button>
</div>
</div>

<div class="profile" id="profile" style="display:none">
<h3>Customer Profile</h3>
<div style="display:flex;align-items:center;gap:12px"><div class="avatar" id="av">K</div><div><b id="pName">-</b><br><small id="pPhone" style="color:#64748b">-</small></div></div>
<button class="btn-profile" style="background:#1a2744">+ Add note</button>
<button class="btn-profile">Edit profile</button>
</div>
</div>
</div>

<script>
let current=null, allContacts=[];
async function loadContacts(){
 try{
  let r=await fetch('/api/contacts'); allContacts=await r.json();
  document.getElementById('count').textContent=allContacts.length+' chats';
  renderContacts(allContacts);
 }catch(e){document.getElementById('contacts').innerHTML='<p style="padding:20px">Error cargando</p>'}
}
function renderContacts(list){
 let h=''; list.forEach(c=>{
  let active = current==c.phone?' active':'';
  h+=`<div class="contact${active}" onclick="openChat('${c.phone}')"><div><b>${c.name||c.phone}</b><small>${(c.lastMessage||'').substring(0,32)}</small></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div>`;
 }); if(list.length==0) h='<p style="padding:20px;opacity:0.5">No hay chats aún.<br><small>Escribe al WhatsApp conectado</small></p>';
 document.getElementById('contacts').innerHTML=h;
}
function filterContacts(){
 let q=document.getElementById('search').value.toLowerCase();
 let f=allContacts.filter(c=>(c.name||'').toLowerCase().includes(q)||c.phone.includes(q));
 renderContacts(f);
}
async function openChat(phone){
 current=phone;
 document.getElementById('empty').style.display='none';
 document.getElementById('msgs').style.display='flex';
 document.getElementById('inputBar').style.display='flex';
 document.getElementById('profile').style.display='flex';
 document.getElementById('pPhone').textContent=phone;
 document.getElementById('pName').textContent=phone;
 document.getElementById('av').textContent=phone[0]||'K';
 fetch('/api/read/'+phone,{method:'POST'});
 renderContacts(allContacts);
 loadMsgs();
}
async function loadMsgs(){
 if(!current) return;
 let r=await fetch('/api/messages/'+current); let d=await r.json();
 let h=''; d.forEach(m=>h+=`<div class="msg ${m.direction}">${m.text}</div>`);
 let el=document.getElementById('msgs'); el.innerHTML=h; el.scrollTop=999999;
 if(d.length>0){let last=d[d.length-1]; document.getElementById('pName').textContent=current;}
}
async function sendMsg(){
 let t=document.getElementById('msgInput').value; if(!t||!current) return;
 document.getElementById('msgInput').value='';
 await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:current,message:t})});
 loadMsgs(); loadContacts();
}
setInterval(()=>{loadContacts(); if(current) loadMsgs()},3000);
loadContacts();
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter') sendMsg()});
</script>
</body>
</html>
