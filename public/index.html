<!doctype html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Klido CRM - Oficial V11</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#0A1931;--blue:#3B82F6;--bg:#070F22;--green:#22C55E;--yellow:#FFC93C;--red:#EF4444}
*{box-sizing:border-box;font-family:Inter}body{margin:0;background:var(--bg);color:#fff;min-height:100vh}
.login{display:flex;min-height:100vh}.left{width:48%;background:linear-gradient(160deg,#0A1931,#102542);padding:56px;display:flex;flex-direction:column;justify-content:center}
.right{width:52%;background:#0C1A33;padding:40px;display:flex;flex-direction:column;justify-content:center}
.card{background:#102542;border-radius:20px;padding:22px;margin:12px 0;border:1px solid #1A335F}
.btn{background:linear-gradient(90deg,#3B82F6,#60A5FA);border:none;padding:14px;border-radius:12px;color:#fff;font-weight:800;cursor:pointer;width:100%}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid #1A335F;margin:8px 0;background:#E8F0FF;color:#0A1931;font-weight:600}
</style></head><body>
<div id="login" class="login">
<div class="left"><h1 style="font-size:44px;font-weight:800">Gestiona tu<br><span style="color:#60A5FA">WhatsApp Business</span><br>como empresa real.</h1><p style="color:#9FB3D1">✅ API Oficial Meta · Inbox real · Campañas · Workers · Llamadas</p></div>
<div class="right"><div class="card">
<h3>Ingresar a Klido CRM Oficial</h3>
<input id="ag" class="input" placeholder="Empresa ID (ej: avanza)"/>
<input id="em" class="input" placeholder="Correo"/>
<input id="pa" class="input" type="password" placeholder="Contraseña"/>
<button class="btn" onclick="login()">Ingresar →</button>
<div id="msg" style="color:var(--yellow);font-size:13px;margin-top:8px"></div>
<p style="font-size:13px"><a href="#" onclick="alert('Usa /api/crear-jefe?agency_id=TUEMPRESA&username=tu@mail.com&password=123&plan=gold')" style="color:#60A5FA">¿Crear empresa?</a> Soporte 3133181851</p>
</div></div></div>

<div id="app" style="display:none;padding:20px"><h2 id="welcome"></h2><div id="stats" class="card"></div><div style="display:flex;gap:12px"><div style="width:350px"><h3>Chats</h3><div id="chats"></div></div><div style="flex:1"><h3 id="chatName">Selecciona chat</h3><div id="msgs" style="height:400px;overflow:auto;background:#0A1931;padding:12px;border-radius:12px"></div><div style="display:flex;gap:8px;margin-top:8px"><input id="msgInput" class="input" style="flex:1" placeholder="Escribe..."/><button class="btn" style="width:100px" onclick="send()">Enviar</button></div></div></div><button class="btn" style="background:#1F2937;margin-top:20px" onclick="localStorage.clear();location.reload()">Salir</button></div>

<script>
let AGENCIA='', USER='', WA_ACTIVO='';
async function login(){
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:ag.value,username:em.value,password:pa.value})});
  const j=await res.json(); if(j.error) return msg.innerText=j.error;
  localStorage.setItem('ag',j.agency_id); localStorage.setItem('user',j.username);
  goApp(j);
}
function goApp(j){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; AGENCIA=j.agency_id; USER=j.username; welcome.innerText=j.agency_id+' - '+j.username+' ('+j.plan+')'; loadStats(); loadChats(); setInterval(()=>{loadChats(); loadStats()},5000); }
async function loadStats(){ const r=await fetch('/api/stats?agency_id='+AGENCIA); const s=await r.json(); stats.innerHTML=`Plan: <b>${s.currentPlan}</b> | Total chats: ${s.totalChats} | No leídos: ${s.unread} | Hoy: ${s.today}`; }
async function loadChats(){ const r=await fetch('/api/chats?agency_id='+AGENCIA); const data=await r.json(); chats.innerHTML=data.map(c=>`<div class="card" style="cursor:pointer;margin:6px 0" onclick="openChat('${c.wa_id}','${c.name||c.wa_id}')"><b>${c.name||c.wa_id}</b><br><small>${c.last_message||''}</small> ${c.unread?'<span style="background:#EF4444;padding:2px 8px;border-radius:10px;font-size:11px">'+c.unread+'</span>':''}</div>`).join(''); }
async function openChat(wa,name){ WA_ACTIVO=wa; chatName.innerText=name+' - '+wa; const r=await fetch('/api/messages/'+wa+'?agency_id='+AGENCIA); const msgs=await r.json(); msgs_div=document.getElementById('msgs'); msgs_div.innerHTML=msgs.map(m=>`<div style="margin:6px 0;padding:8px 12px;border-radius:12px;max-width:70%;${m.direction=='out'?'margin-left:auto;background:#1E3A8A':'background:#102542'}">${m.text}<br><small style="opacity:.6">${new Date(Number(m.timestamp)).toLocaleTimeString()} ${m.sent_by||''}</small></div>`).join(''); msgs_div.scrollTop=9999; await fetch('/api/chats/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:AGENCIA,wa_id:wa})}); }
async function send(){ const txt=msgInput.value; if(!txt||!WA_ACTIVO) return; msgInput.value=''; await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:AGENCIA,wa_id:WA_ACTIVO,text:txt,username:USER})}); openChat(WA_ACTIVO,WA_ACTIVO); }
const savedAg=localStorage.getItem('ag'); if(savedAg){ fetch('/api/workers?agency_id='+savedAg).then(()=>{ AGENCIA=savedAg; USER=localStorage.getItem('user'); goApp({agency_id:AGENCIA,username:USER,plan:'cargando'}) }); }
</script></body></html>
