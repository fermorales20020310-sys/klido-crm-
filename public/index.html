<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KLIDO - Avanza Consulting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* logo grande 68px, KLIDO 32px, soporte solo WPP */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{display:flex;min-height:100vh;background:#0f172a}
.left{flex:1;background:radial-gradient(120% 120% at 20% 0%, #1e293b 0%, #0f172a 55%, #020617 100%);padding:28px 48px;display:flex;flex-direction:column;justify-content:space-between;color:white}
.logo-row{display:flex;align-items:center;gap:14px}
.logo-box{width:68px;height:68px;background:white;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.logo-box img{width:100%;height:100%;object-fit:cover}
.brand-title{font-size:32px;font-weight:900;line-height:.9}
.brand-sub{font-size:11px;letter-spacing:3px;font-weight:600;color:#94a3b8}
.hero{max-width:540px;margin-top:60px}
.hero h1{font-size:56px;font-weight:900;line-height:.95;letter-spacing:-1px}
.hero h1 span{color:#60a5fa}
.hero p{margin-top:18px;font-size:14px;line-height:1.5;color:#cbd5e1}
.badge{margin-top:22px;display:inline-flex;border:1px solid #334155;background:rgba(30,58,95,.6);color:#93c5fd;font-size:10px;font-weight:700;padding:8px 14px;border-radius:999px}
.bottom-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px}
.tag{border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:10px;font-weight:700;padding:7px 12px;border-radius:999px}
.right{flex:1;background:#f1f5f9;display:flex;align-items:center;justify-content:center;padding:30px}
.card{background:white;width:100%;max-width:480px;border-radius:22px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.tabs{display:flex;background:#eef2ff;border-radius:14px;padding:4px;margin-bottom:18px}
.tab{flex:1;padding:10px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;cursor:pointer;color:#64748b}
.tab.active{background:#0f172a;color:white}
.input{background:#eef6ff;border:1px solid #dbeafe;border-radius:12px;padding:12px 14px;width:100%;font-size:13px;margin-bottom:10px;outline:none}
.check-row{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:11px;color:#475569}
.btn-main{width:100%;background:#1e3a8a;color:white;border:none;border-radius:12px;padding:13px;font-weight:800;font-size:13px;cursor:pointer}
.links{margin-top:12px;text-align:center;display:flex;flex-direction:column;gap:6px}
.links a{font-size:11px;color:#1e40af;font-weight:700;text-decoration:none;cursor:pointer}
.wpp-float{position:fixed;right:18px;bottom:18px;width:52px;height:52px;background:#22c55e;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(34,197,94,.5);z-index:50}
.wpp-float svg{width:26px;height:26px;fill:white}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.modal-box{background:white;border-radius:18px;padding:22px;max-width:420px;width:100%}
</style>
</head>
<body>
