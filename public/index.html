<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klido V10.8.3 - Avanza Consulting</title>
<style>
:root{--v:#6c5ce7;--bg:#f5f6fb}*{box-sizing:border-box;font-family:Inter,Arial}body{margin:0;background:var(--bg)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:28px;width:100%;max-width:420px}
h1{margin:0 0 4px;color:#111} .sub{color:#666;font-size:13px;margin-bottom:18px}
input,button,select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:14px}
button{background:var(--v);color:#fff;border:none;font-weight:700;cursor:pointer} button:disabled{opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #eee}
.layout{display:flex;height:calc(100vh - 57px)} .left{width:320px;background:#fff;border-right:1px solid #eee;display:flex;flex-direction:column}
.right{flex:1;display:flex;flex-direction:column;background:#fafafd}
.chats{overflow:auto;flex:1} .chat-item{padding:12px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer} .chat-item.active{background:#f0edff}
.chat-item b{display:block;font-size:14px} .chat-item span{font-size:12px;color:#666}
.msgs{flex:1;overflow:auto;padding:16px} .msg{max-width:70%;padding:10px 12px;border-radius:14px;margin:6px 0;font-size:14px}
.out{background:var(--v);color:#fff;margin-left:auto} .in{background:#fff;border:1px solid #eee}
.bar{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #eee}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px} .stat{background:#fff;padding:12px;border-radius:12px;border:1px solid #eee} .stat h3{margin:0;font-size:20px} .stat p{margin:2px 0 0;color:#666;font-size:12px}
.badge{font-size:11px;background:#eee;padding:3px 8px;border-radius:20px}
.hidden{display:none} a.link{color:var(--v);font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
<div class="card">
<h1>KLIDO V10.8.3</h1>
<div class="sub">Avanza Consulting - El mejor CRM para tu empresa - FIX REAL</div>
<input id="agency_id" placeholder="ID Empresa (ej: avanza)">
<input id="username" placeholder="Correo">
<input id="password" type="password" placeholder="Contraseña">
<button id="btnLogin" onclick="login()">Entrar</button>
<div style="display:flex;justify-content:space-between;margin-top:10px">
<a class="link" onclick="showForgot()">¿Olvidaste contraseña?</a>
<a class="link" onclick="showRegister()">Crear empresa</a>
</div>
<div id="loginMsg" style="font-size:13px;color:#c00;margin-top:10px"></div>
<div style="margin-top:12px;font-size:11px;color:#888">Health: <span id="health">...</span></div>
</div>
</div>

<div id="appView" class="hidden">
<div class="top">
<div><b id="agencyLabel"></b> - <span id="userLabel"></span> <span id="planLabel" class="badge"></span> <span class="badge">V10.8.3 FIX REAL</span></div>
<div><button onclick="logout()" style="width:auto;padding:6px 12px">Salir</button></div>
</div>
<div class="stats" id="stats"></div>
<div class="layout">
<div class="left">
<div style="padding:10px;display:flex;gap:6px">
<input id="searchChat" placeholder="Buscar chat" oninput="renderChats()">
<button onclick="loadChats()" style="width:auto">↻</button>
</div>
<div id="chats" class="chats"></div>
<div style="padding:10px;border-top:1px solid #eee">
<b>Equipo</b>
<div id="workers" style="margin-top:6px;font-size:13px"></div>
<input id="newWorkerEmail" placeholder="Nuevo trabajador email">
<input id="newWorkerPass" placeholder="Password" type="password">
<select id="newWorkerRole"><option value="trabajador">Trabajador</option><option value="admin">Admin</option></select>
<button onclick="addWorker()">Agregar</button>
<div style="margin-top:10px">
<label style="font-size:13px"><input type="checkbox" id="aiToggle" onchange="toggleAI()"> IA Activada</label>
</div>
</div>
</div>
<div class="right">
<div id="msgs" class="msgs"></div>
<div class="bar">
<input id="msgText" placeholder="Mensaje..." onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()" style="width:100px">Enviar</button>
</div>
</div>
</div>
</div>

<!-- Modals simple -->
<div id="registerModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center">
<div class="card">
<h3>Crear empresa (Jefe)</h3>
<input id="r_agency" placeholder="ID empresa">
<input id="r_user" placeholder="Correo jefe">
<input id="r_pass" placeholder="Contraseña" type="password">
<input id="r_name" placeholder="Nombre">
<select id="r_plan"><option value="premium">Premium</option><option value="pro">Pro</option><option value="starter">Starter</option></select>
<button onclick="crearJefe()">Crear</button>
<button onclick="hideRegister()" style="background:#eee;color:#111;margin-top:6px">Cerrar</button>
<div id="r_msg" style="font-size:13px;margin-top:8px"></div>
</div>
</div>

<div id="forgotModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center">
<div class="card">
<h3>Recuperar contraseña</h3>
<input id="f_email" placeholder="Tu correo">
<button onclick="forgot()">Enviar código</button>
<div id="f_codeWrap" class="hidden">
<input id="f_code" placeholder="Código recibido">
<input id="f_new" type="password" placeholder="Nueva contraseña">
<button onclick="reset()">Cambiar</button>
</div>
<button onclick="hideForgot()" style="background:#eee;color:#111;margin-top:6px">Cerrar</button>
<div id="f_msg" style="font-size:13px;margin-top:8px"></div>
</div>
</div>

<script>
let ME={}; let chats=[]; let activeWa=null;
async function api(p,o){ const r=await fetch(p,o); return r.json(); }
fetch('/health').then(r=>r.json()).then(j=>document.getElementById('health').innerText=j.v).catch(()=>document.getElementById('health').innerText='offline');

function showRegister(){document.getElementById('registerModal').classList.remove('hidden'); document.getElementById('registerModal').style.display='flex'}
function hideRegister(){document.getElementById('registerModal').classList.add('hidden'); document.getElementById('registerModal').style.display='none'}
function showForgot(){document.getElementById('forgotModal').classList.remove('hidden'); document.getElementById('forgotModal').style.display='flex'}
function hideForgot(){document.getElementById('forgotModal').classList.add('hidden'); document.getElementById('forgotModal').style.display='none'}

async function crearJefe(){
 const ag=document.getElementById('r_agency').value.trim().toLowerCase();
 const us=document.getElementById('r_user').value.trim().toLowerCase();
 const pw=document.getElementById('r_pass').value;
 const nm=document.getElementById('r_name').value||us;
 const pl=document.getElementById('r_plan').value;
 const j=await api(`/api/crear-jefe?agency_id=${encodeURIComponent(ag)}&username=${encodeURIComponent(us)}&password=${encodeURIComponent(pw)}&name=${encodeURIComponent(nm)}&plan=${pl}`);
 document.getElementById('r_msg').innerText=j.ok?`Creado plan ${j.plan} - ya puedes logearte`:'Error: '+(j.error||'');
}

async function login(){
 const ag=document.getElementById('agency_id').value.trim().toLowerCase();
 const u=document.getElementById('username').value.trim().toLowerCase();
 const pw=document.getElementById('password').value;
 document.getElementById('btnLogin').disabled=true; document.getElementById('loginMsg').innerText='Ingresando...';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:ag,username:u,email:u,password:pw})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||'Error login');
  ME=j; localStorage.setItem('klido_me',JSON.stringify(j));
  startApp();
 }catch(e){ document.getElementById('loginMsg').innerText=e.message; }
 document.getElementById('btnLogin').disabled=false;
}
function startApp(){
 if(!ME.agency_id){ try{ME=JSON.parse(localStorage.getItem('klido_me')||'{}')}catch(e){} }
 if(!ME.agency_id) return;
 document.getElementById('loginView').classList.add('hidden');
 document.getElementById('appView').classList.remove('hidden');
 document.getElementById('agencyLabel').innerText=ME.agency_id;
 document.getElementById('userLabel').innerText=ME.username+' ('+ME.role+')';
 document.getElementById('planLabel').innerText=ME.plan||'premium';
 loadStats(); loadChats(); loadWorkers(); loadAI();
}
function logout(){ localStorage.clear(); location.reload(); }
async function loadStats(){
 const j=await api(`/api/stats?agency_id=${ME.agency_id}`);
 document.getElementById('stats').innerHTML=`<div class=stat><h3>${j.today}</h3><p>Hoy</p></div><div class=stat><h3>${j.unread}</h3><p>No leídos</p></div><div class=stat><h3>${j.totalChats}</h3><p>Total chats</p></div><div class=stat><h3>${j.campaign}</h3><p>Campañas</p></div><div class=stat><h3>${j.ia}</h3><p>Mensajes IA</p></div><div class=stat><h3>${j.calls}</h3><p>Llamadas</p></div>`;
}
async function loadChats(){
 let url=`/api/chats?agency_id=${ME.agency_id}`;
 if(ME.role!=='jefe') url+=`&worker=${ME.username}`;
 chats=await api(url); renderChats();
}
function renderChats(){
 const q=(document.getElementById('searchChat').value||'').toLowerCase();
 const c=document.getElementById('chats'); c.innerHTML='';
 chats.filter(x=>!q|| (x.name||'').toLowerCase().includes(q) || x.wa_id.includes(q)).forEach(ch=>{
  const d=document.createElement('div'); d.className='chat-item'+(activeWa===ch.wa_id?' active':'');
  d.innerHTML=`<b>${ch.name||ch.wa_id}</b><span>${(ch.last_message||'').slice(0,40)}</span>`;
  d.onclick=()=>openChat(ch.wa_id); c.appendChild(d);
 });
}
async function openChat(wa){
 activeWa=wa; renderChats();
 const msgs=await api(`/api/messages/${wa}?agency_id=${ME.agency_id}`);
 const box=document.getElementById('msgs'); box.innerHTML='';
 msgs.forEach(m=>{
  const div=document.createElement('div'); div.className='msg '+(m.direction==='out'?'out':'in');
  div.innerText=m.text+(m.sent_by?` [${m.sent_by}]`:''); box.appendChild(div);
 });
 box.scrollTop=box.scrollHeight;
 fetch('/api/chats/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:ME.agency_id,wa_id:wa})});
}
async function sendMsg(){
 const t=document.getElementById('msgText').value.trim(); if(!t||!activeWa) return;
 document.getElementById('msgText').value='';
 await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:ME.agency_id,wa_id:activeWa,text:t,username:ME.username})});
 openChat(activeWa); loadChats();
}
async function loadWorkers(){
 const w=await api(`/api/workers?agency_id=${ME.agency_id}`);
 document.getElementById('workers').innerHTML=w.map(x=>`${x.username} (${x.role}) <a class=link onclick="delWorker('${x.username}')">[x]</a>`).join('<br>');
}
async function addWorker(){
 const email=document.getElementById('newWorkerEmail').value.trim().toLowerCase();
 const pw=document.getElementById('newWorkerPass').value;
 const role=document.getElementById('newWorkerRole').value;
 if(!email||!pw) return alert('Falta datos');
 await fetch('/api/workers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:ME.agency_id,email,password:pw,role})});
 loadWorkers();
}
async function delWorker(id){
 if(!confirm('Borrar '+id+'?')) return;
 await fetch(`/api/workers/${encodeURIComponent(id)}?agency_id=${ME.agency_id}`,{method:'DELETE'}); loadWorkers();
}
async function loadAI(){
 const j=await api(`/api/ai/config?agency_id=${ME.agency_id}`); document.getElementById('aiToggle').checked=!!j.enabled;
}
async function toggleAI(){
 const en=document.getElementById('aiToggle').checked;
 await fetch('/api/ai/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:ME.agency_id,enabled:en})});
}
async function forgot(){
 const email=document.getElementById('f_email').value.trim().toLowerCase();
 const j=await api('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
 if(j.ok){ document.getElementById('f_msg').innerText='Código: '+j.code+' (demo). Ingresalo abajo'; document.getElementById('f_codeWrap').classList.remove('hidden'); }
 else document.getElementById('f_msg').innerText=j.error||'Error';
}
async function reset(){
 const email=document.getElementById('f_email').value.trim().toLowerCase();
 const token=document.getElementById('f_code').value.trim();
 const np=document.getElementById('f_new').value;
 const j=await api('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,token,newPassword:np})});
 document.getElementById('f_msg').innerText=j.ok?'Contraseña cambiada, ya puedes entrar':'Error: '+(j.error||'');
}
(function(){ try{const m=JSON.parse(localStorage.getItem('klido_me')||'null'); if(m&&m.agency_id){ME=m; startApp();}}catch(e){} })();
</script>
</body>
</html>
