<!DOCTYPE html><html><head><meta charset="utf-8"><title>Campañas KLIDO</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>body{margin:0;background:#f8fafc;font-family:Arial}.top{height:68px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.card{max-width:900px;margin:30px auto;background:white;border-radius:16px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.06)}.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:40px;text-align:center;cursor:pointer}select,input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:8px;margin:8px 0}.btn{background:#2563eb;color:white;border:none;padding:12px;border-radius:8px;width:100%;font-weight:700;cursor:pointer}</style></head><body>
<div class="top"><div style="display:flex;align-items:center;gap:12px"><img src="./logo.png" style="height:42px" onerror="this.src='/logo.png'"><b>KLIDO AVANZA</b></div><button onclick="location.href='/'" style="padding:8px 14px;border:1px solid #e5e7eb;background:white;border-radius:8px;cursor:pointer">← Bandeja</button></div>
<div class="card"><h2>Lanzar nueva campaña</h2><p style="color:#64748b;font-size:13px">Tus plantillas aprobadas aparecen automático. Si Meta aprueba una nueva, sale aquí sola.</p><label>Plantilla aprobada (API)</label><select id="tpl"><option>Cargando...</option></select><label>Nombre campaña</label><input id="name" placeholder="Ej: Alianza Agosto - alion_co"><label>Excel (columna A)</label><div class="drop" id="drop" onclick="document.getElementById('file').click()">📊<br><b>Arrastra tu Excel aquí</b><br><small>o clic para seleccionar</small><input type="file" id="file" accept=".xlsx,.xls,.csv" style="display:none"><div id="info" style="margin-top:10px"></div></div><div id="prev" style="margin-top:10px;font-size:12px;background:#f8fafc;padding:10px;border-radius:8px;display:none"></div><button class="btn" id="btn" disabled onclick="send()">Enviar campaña ahora</button><div id="res" style="margin-top:12px"></div><h3>Historial</h3><div id="hist"></div></div>
<script>let nums=[];async function loadTpl(){try{let r=await fetch('/api/templates');let t=await r.json();let s=document.getElementById('tpl');if(!t.length){s.innerHTML='<option>No hay plantillas - revisa tu WABA_ID en Railway</option>';return;}s.innerHTML=t.map(x=>`<option value="${x.name}">${x.name} - ${x.status}</option>`).join('');check();}catch(e){}}function check(){document.getElementById('btn').disabled=!(nums.length>0&&document.getElementById('tpl').value);}document.getElementById('file').onchange=e=>handle(e.target.files[0]);let d=document.getElementById('drop');d.ondragover=e=>{e.preventDefault();d.style.borderColor='#2563eb';};d.ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files[0]);};function handle(f){if(!f)return;document.getElementById('info').innerText=f.name;let rd=new FileReader();rd.onload=e=>{let wb=XLSX.read(e.target.result,{type:'binary'});let ws=wb.Sheets[wb.SheetNames[0]];let data=XLSX.utils.sheet_to_json(ws,{header:1});nums=data.flat().map(v=>String(v||'').replace(/\D/g,'')).filter(v=>v.length>=10);nums=[...new Set(nums)];document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=nums.length+' números: '+nums.slice(0,10).join(', ');check();};rd.readAsBinaryString(f);}async function send(){let tpl=document.getElementById('tpl').value;let nm=document.getElementById('name').value||tpl;if(!confirm(`Enviar ${tpl} a ${nums.length}?`))return;document.getElementById('btn').innerText='Enviando...';let r=await fetch('/api/send-campaign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl,campaignName:nm})});let res=await r.json();document.getElementById('res').innerHTML=`Enviados ${res.sent} - Fallidos ${res.failed}`;document.getElementById('btn').innerText='Enviar campaña ahora';loadHist();}async function loadHist(){let r=await fetch('/api/campaigns');let h=await r.json();document.getElementById('hist').innerHTML=h.map(c=>`<div style="border:1px solid #e5e7eb;padding:10px;border-radius:8px;margin:5px 0"><b>${c.name}</b> - ${c.sent}/${c.total} - ${new Date(c.date).toLocaleString()}</div>`).join('');}loadTpl();loadHist();setInterval(loadTpl,30000);</script></body></html>
