<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klido CRM</title>
<script>
if(localStorage.getItem('klido_auth')!=='ok') location.href='/login.html';
</script>
<style>
:root{--dark:#0A1931;--mid:#185ADB;--light:#E8F0FE;--bg:#E8F0FE}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif}
body{display:flex;height:100vh;background:var(--bg)}
#side{width:360px;background:var(--light);border-right:1px solid #c9d8f5;display:flex;flex-direction:column;min-width:300px}
#topbar{background:linear-gradient(135deg,var(--dark),#1a3a6b);color:#fff;padding:12px;display:flex;align-items:center;gap:10px}
#topbar img{width:36px;height:36px;border-radius:10px;background:#fff;padding:3px}
#topbar b{font-size:15px;letter-spacing:.5px;flex:1}
#btnCamp{background:var(--mid);color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800;white-space:nowrap}
#btnSalir{background:#ff3b30;color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;margin-left:auto;white-space:nowrap}
#filters{display:flex;gap:8px;padding:12px}
.f{padding:8px 14px;border-radius:20px;border:1px solid #b9ccf0;background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--dark)}
.f.on{background:var(--dark);color:#fff;border-color:var(--dark)}
#search{margin:0 12px 12px;padding:11px 14px;border-radius:12px;border:1.5px solid #b9ccf0;background:#fff;outline:none;font-size:14px}
#list{flex:1;overflow-y:auto;background:var(--light)}
.chat{padding:14px;border-bottom:1px solid #d0ddf7;display:flex;gap:12px;cursor:pointer;background:var(--light);align-items:center}
.chat:hover{background:#d6e4ff}
.chat.on{background:#d6e4ff;border-left:4px solid var(--mid)}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0}
#chead{background:var(--dark);color:#fff;padding:14px 20px;font-size:15px}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.m{max-width:70%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.45;word-wrap:break-word}
.in{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.06);color:#1a2332}
.out{background:linear-gradient(135deg,var(--mid),#2f6bff);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
#box{padding:16px;background:var(--light);display:flex;gap:10px;border-top:1px solid #c9d8f5}
#box input{flex:1;padding:14px;border-radius:12px;border:1.5px solid #b9ccf0;outline:none;background:#fff;font-size:14px}
#box button{padding:14px 22px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;font-weight:800;cursor:pointer;font-size:14px}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dark);text-align:center;padding:20px}
#welcome img{width:90px;border-radius:20px;margin-bottom:16px;background:#fff;padding:8px}
</style>
</head>
<body>
<div id="side">
<div id="topbar">
<img src="/logo.png" onerror="this.style.display='none'">
<b>KLIDO CRM</b>
<a id="btnCamp" href="/campaigns.html">📢 CAMPAÑAS</a>
<button id="btnSalir" onclick="localStorage.removeItem('klido_auth');location.href='/login.html'">Salir</button>
</div>
<div id="filters">
<div class="f on" onclick="setF('all',this)">Todos</div>
<div class="f" onclick="setF('unread',this)">🔴 Sin leer</div>
</div>
<input id="search" placeholder="🔍 Buscar número..." oninput="render()">
<div id="list"></div>
</div>

<div id="main">
<div id="chead" style="display:none"><b id="cname"></b></div>
<div id="msgs">
<div id="welcome">
<img src="/logo.png" onerror="this.style.display='none'">
<h2>Bienvenido a Klido CRM</h2>
<p style="color:#4a5a7a;margin-top:8px">🔵 Azul oscuro • Azul claro • Historial eterno activo</p>
</div>
</div>
<div id="box" style="display:none">
<input id="txt" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Enviar</button>
</div>
</div>

<script>
let chats=[], cur=null, filter='all';
async function load(){
  try{
    const r=await fetch('/api/chats');
    chats=await r.json();
    render();
  }catch(e){}
}
function setF(f,el){
  filter=f;
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  render();
}
function render(){
  const q=document.getElementById('search').value.trim();
  const L=document.getElementById('list');
  let f=chats.filter(c=>!q||c.wa_id.includes(q));
  if(filter==='unread') f=f.filter(c=>c.unread_count>0);
  if(!f.length){
    L.innerHTML='<div style="padding:24px;color:#5a6a85;font-size:13px;text-align:center">No hay chats aún.<br>Envía un WhatsApp a tu número para probar.<br><br>Revisa <b>/health</b> para ver si la DB está conectada.</div>';
    return;
  }
  L.innerHTML=f.map(c=>`
    <div class="chat ${cur===c.wa_id?'on':''}" onclick="openC('${c.wa_id}')">
      <div class="av">${String(c.wa_id).slice(-2)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="color:#0A1931;font-size:14px">${c.wa_id}</b>
          <span style="font-size:11px;color:#5a6a85">${c.created_at?new Date(c.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</span>
        </div>
        <div style="font-size:13px;color:#4a5a7a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${(c.text||'').replace(/</g,'&lt;')}</div>
      </div>
      ${c.unread_count?`<div style="background:#ff3b30;color:#fff;border-radius:50%;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 6px">${c.unread_count}</div>`:''}
    </div>`).join('');
}
async function openC(id){
  cur=id;
  document.getElementById('chead').style.display='block';
  document.getElementById('box').style.display='flex';
  document.getElementById('cname').textContent=id;
  await fetch('/api/chats/'+id+'/read',{method:'PUT'}).catch(()=>{});
  try{
    const r=await fetch('/api/messages/'+id);
    const ms=await r.json();
    const M=document.getElementById('msgs');
    M.innerHTML=ms.length?ms.map(m=>`
      <div class="m ${m.direction==='in'?'in':'out'}">${String(m.text||'').replace(/</g,'&lt;')}
        <div style="font-size:10px;opacity:.6;margin-top:6px">${m.created_at?new Date(m.created_at).toLocaleString():''} ${m.source==='campaign'?'• 📢 campaña':''}</div>
      </div>`).join(''):'<div style="text-align:center;color:#5a6a85;margin-top:20px">Sin mensajes en este chat</div>';
    M.scrollTop=M.scrollHeight;
  }catch(e){}
  load();
}
async function send(){
  const t=document.getElementById('txt').value.trim();
  if(!t||!cur) return;
  document.getElementById('txt').value='';
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:cur,message:t})});
  openC(cur);
}
load();
setInterval(load,5000);
</script>
</body>
</html>
