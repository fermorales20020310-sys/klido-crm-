<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klido</title>
<style>
body{margin:0;font-family:Arial;display:flex;height:100vh}
#l{width:340px;border-right:1px solid #ccc;overflow:auto;background:#fff}
#r{flex:1;display:flex;flex-direction:column;background:#e5ddd5}
#h{padding:12px;background:#f0f0f0;border-bottom:1px solid #ccc;font-weight:bold}
#m{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.i{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.i b{display:block}
.b{padding:8px 12px;border-radius:8px;max-width:70%;font-size:14px}
.c{background:#fff;align-self:flex-start}
.a{background:#dcf8c6;align-self:flex-end}
#in{display:flex;padding:8px;background:#f0f0f0;gap:6px}
#t{flex:1;padding:10px;border-radius:20px;border:1px solid #ccc}
#s{padding:10px 16px;border-radius:20px;border:0;background:#000;color:#fff}
</style>
</head>
<body>
<div id="l"></div>
<div id="r">
<div id="h">Selecciona chat</div>
<div id="m"></div>
<div id="in"><input id="t" placeholder="Escribe..."><button id="s">Enviar</button></div>
</div>
<script>
var eid=localStorage.getItem('empresa_id')||'default';
var cur=null;
function loadChats(){
 fetch('/api/chats/'+eid).then(r=>r.json()).then(chats=>{
  var l=document.getElementById('l');l.innerHTML='';
  chats.forEach(function(c){
   var d=document.createElement('div');d.className='i';
   d.innerHTML='<b>'+c.id+'</b><span style="font-size:12px;color:#666">'+((c.mensajes&&c.mensajes.slice(-1)[0]&&c.mensajes.slice(-1)[0].texto)||'').substring(0,30)+'</span>';
   d.onclick=function(){openChat(c.id)};l.appendChild(d);
  });
 });
}
function openChat(id){
 cur=id;document.getElementById('h').innerText=id;
 fetch('/api/chat/leido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:eid,chat_id:id})});
 fetch('/api/mensajes/'+eid+'/'+id).then(r=>r.json()).then(msgs=>{
  var m=document.getElementById('m');m.innerHTML='';
  msgs.forEach(function(x){
   var b=document.createElement('div');b.className='b '+(x.from==='agente'?'a':'c');b.innerText=x.texto;m.appendChild(b);
  });
  m.scrollTop=m.scrollHeight;
 });
}
function send(){
 var inp=document.getElementById('t');var txt=inp.value.trim();if(!txt||!cur)return;
 var m=document.getElementById('m');var b=document.createElement('div');b.className='b a';b.innerText=txt;m.appendChild(b);m.scrollTop=m.scrollHeight;inp.value='';
 fetch('/api/mensaje/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:eid,chat_id:cur,texto:txt})});
}
document.getElementById('s').onclick=send;
document.getElementById('t').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
setInterval(loadChats,5000);loadChats();
</script>
</body>
</html>
