<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{ --azul-oscuro:#0f2a44; --azul-claro:#e6f0ff; --azul-medio:#1e4b8a; }
.bg-azul-oscuro{ background:var(--azul-oscuro) }
.bg-azul-claro{ background:var(--azul-claro) }
.text-azul-oscuro{ color:var(--azul-oscuro) }
.chat-active{ background:#dbeafe }
.unread-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body class="bg-azul-claro h-screen overflow-hidden">
<!-- LOGIN -->
<div id="loginView" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-[#e6f0ff] to-[#c7d9f5]">
  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-[#0f2a44]">
    <div class="flex flex-col items-center mb-6">
      <img src="/logo.png" alt="KLIDO" class="h-14 mb-3 object-contain" onerror="this.style.display='none'">
      <h1 class="text-3xl font-black text-azul-oscuro">KLIDO CRM</h1>
      <p class="text-sm text-[#1e4b8a] font-semibold">Inmobiliaria - WhatsApp</p>
    </div>
    <input id="agency" placeholder="Agencia (ej: acol)" class="w-full border border-blue-200 p-3 rounded-xl mb-3 focus:ring-2 focus:ring-[#1e4b8a] outline-none">
    <input id="email" placeholder="Correo" class="w-full border border-blue-200 p-3 rounded-xl mb-3 focus:ring-2 focus:ring-[#1e4b8a] outline-none">
    <input id="password" type="password" placeholder="Clave" class="w-full border border-blue-200 p-3 rounded-xl mb-4 focus:ring-2 focus:ring-[#1e4b8a] outline-none">
    <button onclick="login()" class="w-full bg-azul-oscuro text-white py-3 rounded-xl font-bold hover:bg-[#12365f] transition">Entrar</button>
    <div class="flex justify-between mt-4 text-sm">
      <button onclick="forgot()" class="text-[#1e4b8a] underline font-semibold">¿Olvidaste clave?</button>
      <a href="/reset.html" class="text-gray-500 underline">Tengo token</a>
    </div>
    <p id="loginMsg" class="text-center mt-4 text-sm text-red-500"></p>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden h-screen flex">
  <!-- SIDEBAR CHATS -->
  <div class="w-[380px] bg-white border-r border-blue-100 flex flex-col">
    <div class="p-4 border-b bg-azul-oscuro text-white flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="/logo.png" class="h-8 bg-white rounded p-1" onerror="this.style.display='none'">
        <div><b id="agencyLabel"></b><br><small id="userLabel" class="text-blue-200"></small></div>
      </div>
      <button onclick="logout()" class="text-sm bg-white/20 px-3 py-1 rounded hover:bg-white/30">Salir</button>
    </div>
    <div class="p-3 flex gap-2 bg-[#f0f6ff]">
      <button onclick="loadChats()" class="flex-1 bg-azul-oscuro text-white py-2 rounded text-sm">Chats</button>
      <button onclick="showCampaigns()" class="flex-1 bg-white border border-blue-200 py-2 rounded text-sm">Campañas</button>
      <button onclick="showTeam()" class="flex-1 bg-white border border-blue-200 py-2 rounded text-sm">Equipo</button>
    </div>
    <div id="chats" class="flex-1 overflow-y-auto"></div>
  </div>
  <!-- MAIN -->
  <div class="flex-1 flex flex-col bg-[#e6f0ff]">
    <div id="chatHeader" class="bg-white p-4 border-b border-blue-100 font-bold text-azul-oscuro shadow-sm">Selecciona un chat</div>
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    <div class="bg-white p-3 flex gap-2 border-t border-blue-100">
      <input id="msgInput" placeholder="Escribe mensaje..." class="flex-1 border border-blue-200 p-3 rounded-xl focus:ring-2 focus:ring-[#1e4b8a] outline-none" onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()" class="bg-azul-oscuro text-white px-6 rounded-xl"><i class="fa fa-paper-plane"></i></button>
    </div>
  </div>
  <!-- PANEL DERECHO -->
  <div class="w-[300px] bg-white border-l border-blue-100 p-4 overflow-y-auto" id="rightPanel">
    <h3 class="font-bold mb-3 text-azul-oscuro">Acciones</h3>
    <div class="space-y-2">
      <button onclick="showAiConfig()" class="w-full text-left p-2 bg-[#f0f6ff] rounded text-sm">🤖 Config IA</button>
      <button onclick="showTemplates()" class="w-full text-left p-2 bg-[#f0f6ff] rounded text-sm">📋 Plantillas</button>
      <div class="pt-4">
        <label class="text-xs font-bold text-azul-oscuro">Tag conversación</label>
        <select id="tagSelect" onchange="changeTag()" class="w-full border border-blue-200 p-2 rounded mt-1 text-sm">
          <option value="nuevo">Nuevo</option>
          <option value="interesado">Interesado</option>
          <option value="cita">Cita</option>
          <option value="cerrado">Cerrado</option>
        </select>
      </div>
    </div>
    <div id="panelContent" class="mt-6"></div>
  </div>
</div>

<script>
let currentWa=null;
let agency_id=localStorage.getItem('agency_id')||'';
let username=localStorage.getItem('username')||'';
let role=localStorage.getItem('role')||'';
if(agency_id)document.getElementById('agency').value=agency_id;
if(username)document.getElementById('email').value=username;
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden')}
function showApp(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('agencyLabel').textContent=agency_id;document.getElementById('userLabel').textContent=username+' ('+role+')'; loadChats();}
if(agency_id && username && role) showApp();
async function login(){
  const a=document.getElementById('agency').value.trim().toLowerCase();
  const e=document.getElementById('email').value.trim();
  const p=document.getElementById('password').value;
  const msg=document.getElementById('loginMsg');
  if(!a||!e||!p){msg.textContent='Completa todo';return}
  try{
    let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id:a, username:e, email:e, password:p, acepto_terminos:true})});
    let j=await r.json();
    if(!r.ok){msg.textContent=j.error||'Error';return}
    localStorage.setItem('agency_id', j.agency_id);localStorage.setItem('username', j.username);localStorage.setItem('role', j.role);
    agency_id=j.agency_id;username=j.username;role=j.role;showApp();
  }catch(err){msg.textContent='Error conexion: '+err.message}
}
function logout(){localStorage.clear();showLogin()}
async function forgot(){
  let email=prompt('Escribe tu CORREO registrado:');
  if(!email) return;
  email=email.trim();
  try{
    let r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    let txt = await r.text(); let j; try{ j=JSON.parse(txt); }catch{ j={error:txt} }
    if(r.ok){ alert('✅ Correo enviado a '+email+'. Revisa bandeja y SPAM. Agencias encontradas: '+(j.count||1)); }
    else{ alert('❌ ERROR '+r.status+': '+(j.error||txt)); }
  }catch(e){ alert('❌ Error de conexion: '+e.message); }
}
async function loadChats(){
  let r=await fetch('/api/chats?agency_id='+agency_id);let data=await r.json();
  let html='';data.forEach(c=>{
    let dotColor=c.dot||'transparent';
    html+=`<div onclick="openChat('${c.wa_id}')" class="p-3 border-b border-blue-50 hover:bg-[#e6f0ff] cursor-pointer flex justify-between">
      <div><b class="text-azul-oscuro">${c.name||c.wa_id}</b><br><small class="text-gray-500">${(c.lastMessage||'').substring(0,40)}</small><br><small class="text-xs text-[#1e4b8a]">${c.tag||''} ${c.assigned_to||''}</small></div>
      <div><span class="unread-dot" style="background:${dotColor}"></span></div>
    </div>`;
  });
  document.getElementById('chats').innerHTML=html||'<p class="p-4 text-sm text-gray-500">Sin chats</p>';
}
let chatInterval=null;
function openChat(wa){
  currentWa=wa;
  document.getElementById('chatHeader').textContent=wa;
  loadMessages();
  fetch('/api/chats/'+wa+'/read?agency_id='+agency_id,{method:'POST'});
  if(chatInterval)clearInterval(chatInterval);
  chatInterval=setInterval(loadMessages,3000);
}
async function loadMessages(){
  if(!currentWa) return;
  let r=await fetch('/api/messages/'+currentWa+'?agency_id='+agency_id);let data=await r.json();
  let html='';data.forEach(m=>{
    let cls=m.direction==='in'?'bg-white':'bg-[#d9fdd3] ml-auto border border-blue-100';
    html+=`<div class="max-w-[70%] ${cls} p-2 rounded-lg shadow text-sm"><div>${m.text}</div><small class="text-[10px] text-gray-500">${new Date(m.timestamp).toLocaleTimeString()} ${m.sent_by||''}</small></div>`;
  });
  document.getElementById('messages').innerHTML=html;
  document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}
async function sendMessage(){
  let t=document.getElementById('msgInput').value; if(!t||!currentWa) return;
  await fetch('/api/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wa_id:currentWa,text:t,agency_id,username})});
  document.getElementById('msgInput').value='';loadMessages();
}
async function changeTag(){
  if(!currentWa) return; let tag=document.getElementById('tagSelect').value;
  await fetch('/api/chats/'+currentWa+'/tag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag,agency_id})});
}
async function showCampaigns(){
  let r=await fetch('/api/campaigns?agency_id='+agency_id);let data=await r.json();
  let html='<h4 class="font-bold mb-2 text-azul-oscuro">Campañas</h4>';data.forEach(c=>{html+=`<div class="text-xs border border-blue-100 p-2 rounded mb-1">${c.template} - ${c.sent}/${c.total} - ${c.status}</div>`});
  html+=`<div class="mt-4"><input type="file" id="excel" class="text-xs"><input id="tpl" placeholder="plantilla" class="border border-blue-200 p-1 w-full mt-2 text-xs"><button onclick="uploadCampaign()" class="bg-azul-oscuro text-white w-full py-2 rounded mt-2 text-xs">Subir campaña</button></div>`;
  document.getElementById('panelContent').innerHTML=html;
}
async function uploadCampaign(){
  let file=document.getElementById('excel').files[0]; let tpl=document.getElementById('tpl').value; if(!file||!tpl){alert('Excel y plantilla');return}
  let reader=new FileReader(); reader.onload=async e=>{
    let res=await fetch('/api/campaigns/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id,template:tpl,fileBase64:e.target.result})});
    let j=await res.json(); alert(j.ok?'Campaña creada: '+j.total: j.error);
  }; reader.readAsDataURL(file);
}
async function showTeam(){
  let r=await fetch('/api/team?agency_id='+agency_id);let data=await r.json();
  let html='<h4 class="font-bold mb-2 text-azul-oscuro">Equipo</h4>';data.forEach(u=>{html+=`<div class="text-xs flex justify-between border-b py-1">${u.username} - ${u.role} ${u.role==='trabajador'?`<button onclick="delUser('${u.username}')" class="text-red-500">x</button>`:''}</div>`});
  if(role==='jefe')html+=`<div class="mt-4"><input id="newUser" placeholder="correo" class="border p-1 w-full text-xs"><input id="newPass" placeholder="clave" class="border p-1 w-full text-xs mt-1"><input id="newName" placeholder="nombre" class="border p-1 w-full text-xs mt-1"><button onclick="createUser()" class="bg-azul-oscuro text-white w-full py-2 rounded mt-2 text-xs">Crear trabajador</button></div>`;
  document.getElementById('panelContent').innerHTML=html;
}
async function createUser(){
  let username=document.getElementById('newUser').value; let password=document.getElementById('newPass').value; let display_name=document.getElementById('newName').value;
  let r=await fetch('/api/team/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id,username,password,display_name,role_req:localStorage.getItem('username')})});
  let j=await r.json(); alert(j.ok?'Creado':j.error); showTeam();
}
async function delUser(u){
  if(!confirm('Borrar '+u+'?')) return;
  let r=await fetch('/api/team/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id,username:u,role_req:localStorage.getItem('username')})});
  let j=await r.json(); alert(j.ok?'Borrado':j.error); showTeam();
}
async function showAiConfig(){
  let r=await fetch('/api/ai-config?agency_id='+agency_id);let c=await r.json();
  let html=`<h4 class="font-bold mb-2 text-azul-oscuro">IA</h4><label class="text-xs"><input type="checkbox" id="aiEnabled" ${c.enabled?'checked':''}> Activada</label><br><label class="text-xs"><input type="checkbox" id="aiHuman" ${c.human_takeover?'checked':''}> Human takeover</label><textarea id="aiPrompt" class="border border-blue-200 w-full h-24 text-xs mt-2 p-2">${c.prompt||''}</textarea><button onclick="saveAi()" class="bg-azul-oscuro text-white w-full py-2 rounded mt-2 text-xs">Guardar IA</button>`;
  document.getElementById('panelContent').innerHTML=html;
}
async function saveAi(){
  let enabled=document.getElementById('aiEnabled').checked; let human_takeover=document.getElementById('aiHuman').checked; let prompt=document.getElementById('aiPrompt').value;
  await fetch('/api/ai-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id,enabled,prompt,human_takeover})}); alert('Guardado');
}
async function showTemplates(){
  let r=await fetch('/api/templates?agency_id='+agency_id);let data=await r.json();
  let html='<h4 class="font-bold mb-2 text-azul-oscuro">Plantillas aprobadas</h4>';data.forEach(t=>{html+=`<div class="text-xs border border-blue-100 p-1 rounded mb-1">${t.name} - ${t.status}</div>`});
  document.getElementById('panelContent').innerHTML=html;
}
</script>
</body>
</html>
