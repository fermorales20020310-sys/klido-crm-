<!-- CAMPAÑAS KLIDO -->
<div id="campanas" class="tab">
  <h2>📢 Campañas</h2>
  
  <div style="display:flex;gap:10px;margin-bottom:15px">
    <input type="text" id="camp-name" placeholder="Nombre campaña" style="flex:1;padding:8px">
    <select id="camp-template" style="flex:1;padding:8px"><option>Cargando plantillas...</option></select>
  </div>

  <div style="border:2px dashed #ccc;padding:20px;text-align:center;margin-bottom:15px">
    <input type="file" id="camp-excel" accept=".xlsx,.xls,.csv">
    <p>Sube tu Excel - detecto automáticamente la columna de números (numero / phone / telefono)</p>
    <button onclick="crearCampana()" style="padding:10px 20px;background:#25D366;color:white;border:none;border-radius:8px;cursor:pointer">🚀 Enviar campaña</button>
  </div>
  <div id="camp-status"></div>

  <h3>Historial de campañas</h3>
  <table id="camp-history" border="1" style="width:100%;border-collapse:collapse">
    <tr><th>Nombre</th><th>Plantilla</th><th>Total</th><th>Enviados</th><th>Fallidos</th><th>Estado</th><th>Fecha</th></tr>
  </table>
</div>

<script>
// Cargar plantillas aprobadas automáticamente
async function loadTemplates(){
  const r = await fetch('/api/templates'); const tpls = await r.json();
  document.getElementById('camp-template').innerHTML = tpls.map(t=>`<option value="${t.name}">${t.name} (${t.language})</option>`).join('') || '<option>No hay aprobadas</option>';
}
// Crear campaña desde Excel
async function crearCampana(){
  const file = document.getElementById('camp-excel').files[0];
  const template = document.getElementById('camp-template').value;
  const name = document.getElementById('camp-name').value || 'Campaña';
  if(!file || !template) return alert('Sube Excel y elige plantilla');
  const fd = new FormData(); fd.append('file', file); fd.append('template', template); fd.append('name', name);
  document.getElementById('camp-status').innerHTML = '⏳ Enviando con anti-spam (3s entre mensajes)...';
  const r = await fetch('/api/campaigns/excel',{method:'POST', body:fd});
  const j = await r.json();
  document.getElementById('camp-status').innerHTML = `✅ Campaña #${j.campaign_id} iniciada: ${j.total} números`;
  loadHistory();
}
// Historial
async function loadHistory(){
  const r = await fetch('/api/campaigns'); const rows = await r.json();
  document.getElementById('camp-history').innerHTML = '<tr><th>Nombre</th><th>Plantilla</th><th>Total</th><th>Enviados</th><th>Fallidos</th><th>Estado</th><th>Fecha</th></tr>' +
    rows.map(c=>`<tr><td>${c.name}</td><td>${c.template}</td><td>${c.total}</td><td>${c.sent}</td><td>${c.failed}</td><td>${c.status}</td><td>${new Date(c.created_at).toLocaleString()}</td></tr>`).join('');
}
loadTemplates(); loadHistory();
</script>
