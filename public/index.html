<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo"><!-- TU LOGO AQUÍ, no se toca --><img src="logo.png" alt="KLIDO"></div>
    <div class="tabs"><button id="tab-chats" class="active">Chats</button><button id="tab-camp">Campañas</button></div>
    <div id="chat-list"></div>
    <div id="camp-panel" style="display:none">
      <h3>Campañas</h3>
      <button onclick="syncTemplates()">Sincronizar plantillas API</button>
      <select id="template-select"></select>
      <input type="text" id="camp-name" placeholder="Nombre campaña">
      <input type="file" id="excel-file" accept=".xlsx,.xls">
      <button onclick="uploadCampaign()">Subir Excel y crear</button>
      <div id="camp-list"></div>
      <div id="camp-history"></div>
    </div>
  </aside>
  <main id="chat-window">
    <div id="chat-header"></div>
    <div id="messages"></div>
    <div id="input-bar"><input id="msg-input" placeholder="Escribe..."><button onclick="markRead()">✓</button></div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
