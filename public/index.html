<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO CRM Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial}
body{background:#060a14;display:flex;justify-content:center;padding:18px;min-height:100vh}
.app{width:100%;max-width:1480px;height:94vh;background:#0b1120;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #1e293b}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #1e293b}
.hleft{display:flex;align-items:center;gap:12px}.hleft img{width:42px;height:42px;border-radius:10px;background:#fff;padding:4px;object-fit:contain}
.hleft h1{color:#fff;font-size:22px;font-weight:800}.badge{background:#3b82f6;color:#fff;font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600}
.hright{display:flex;align-items:center;gap:16px}.hright button{background:#0A1931;color:#fff;border:1px solid #1e3a5f;padding:8px 18px;border-radius:10px;cursor:pointer}
.body{flex:1;display:flex;overflow:hidden}.menu{width:210px;border-right:1px solid #1e293b;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.menu small{color:#64748b;font-size:11px;letter-spacing:1px;margin:10px 8px 6px}
.mi{padding:11px 14px;border-radius:10px;color:#94a3b8;cursor:pointer;font-size:14px;display:flex;gap:10px;align-items:center}
.mi.active{background:#2563eb;color:#fff}.inbox{width:340px;border-right:1px solid #1e293b;display:flex;flex-direction:column}
.inbox-top{padding:18px}.inbox-top h2{color:#fff;font-size:20px}.search{margin:0 18px 12px;background:#131c2e;border-radius:10px;padding:10px 14px;display:flex;gap:8px}
.search input{background:none;border:none;outline:none;color:#fff;width:100%}.tabs{display:flex;gap:8px;padding:0 18px 12px}
.tab{flex:1;text-align:center;padding:8px;font-size:13px;border-radius:8px;cursor:pointer;color:#64748b;background:#131c2e;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.active{color:#fff;background:#1e293b}.dot{width:8px;height:8px;border-radius:50%}.dot.g{background:#22c55e}.dot.r{background:#ef4444}
#list{flex:1;overflow-y:auto;padding:0 12px}.chat{padding:12px;border-radius:12px;cursor:pointer;display:flex;gap:12px;margin-bottom:4px}
.chat.active,.chat:hover{background:#131c2e}.avatar{width:44px;height:44px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.chat b{color:#fff;font-size:14px}.chat small{color:#64748b;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.conv{flex:1;display:flex;flex-direction:column;background:#0a0f1d}.conv-head{padding:16px 22px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:12px}
.conv-head b{color:#fff}.msgs{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:10px}
.m{max-width:68%;padding:12px 16px;border-radius:16px;font-size:14px}.in{background:#1a2332;color:#e2e8f0;align-self:flex-start}
.out{background:#a8d8ff;color:#0a1931;align-self:flex-end}.sendbox{padding:16px 22px;display:flex;gap:12px;border-top:1px solid #1e293b}
.sendbox input{flex:1;background:#131c2e;border:none;padding:13px 18px;border-radius:24px;color:#fff;outline:none}
.sendbtn{width:44px;height:44px;border-radius:50%;background:#3b82f6;border:none;color:#fff;cursor:pointer}
.profile{width:300px;border-left:1px solid #1e293b;padding:20px;color:#fff}
</style></head><body><div class="app">
<div class="header"><div class="hleft"><img src="/logo.png"><h1>KLIDO CRM Pro</h1><span class="badge">Pro Plan</span></div><div class="hright"><button onclick="localStorage.clear();location.href='/login.html'">Salir</button></div></div>
<div class="body">
<div class="menu"><small>MENU</small><div class="mi active">💬 Inbox</div><div class="mi" onclick="location.href='/campaigns.html'">📢 Campaigns</div><div class="mi" onclick="location.href='/templates.html'">📄 Templates</div></div>
<div class="inbox"><div class="inbox-top"><h2>Inbox</h2></div><div class="search">🔍<input id="q" placeholder="Search conversations..." oninput="render()"></div>
<div class="tabs"><div id="t1" class="tab active" onclick="setF('all')"><span class="dot g"></span>Bandeja</div><div id="t2" class="tab" onclick="setF('unread')"><span class="dot r"></span>No leídos</div></div><div id="list"></div></div>
<div class="conv"><div class="conv-head" id="chead"><div class="avatar">KL</div><div><b>Selecciona un chat</b></div></div><div class="msgs" id="msgs"></div>
<div class="sendbox"><input id="txt" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()"><button class="sendbtn" onclick="send()">➤</button></div></div>
<div class="profile"><h3>Customer Profile</h3><div id="prof"><div style="background:#131c2e;border-radius:14px;padding:16px;color:#64748b">Selecciona una conversación</div></div></div>
</div></div>
<script>
if(!localStorage.getItem('k'))location.href='/login.html';let cur=null,f='all',all=[];
async function load(){const r=await fetch('/api/chats');all=await r.json();render();}
function render(){const q=(document.getElementById('q').value||'').toLowerCase();const l=document.getElementById('list');l.innerHTML='';let d=f==='unread'?all.filter(c=>c.unread_count>0):all;d=d.filter(c=>c.wa_id.toLowerCase().includes(q));d.forEach(c=>{const e=document.createElement('div');e.className='chat'+(cur===c.wa_id?' active':'');e.innerHTML=`<div class="avatar">${c.wa_id.slice(-2)}</div><div><b>${c.wa_id}</b><small>${(c.text||'').substring(0,38)}</small></div>`;e.onclick=()=>open(c.wa_id);l.appendChild(e);});}
function setF(v){f=v;document.getElementById('t1').classList.toggle('active',v==='all');document.getElementById('t2').classList.toggle('active',v==='unread');render();}
async function open(id){cur=id;await fetch('/api/chats/'+id+'/read',{method:'PUT'});document.getElementById('chead').innerHTML=`<div class="avatar">${id.slice(-2)}</div><div><b>${id}</b><br><small style="color:#22c55e">● Online • WhatsApp</small></div>`;document.getElementById('prof').innerHTML=`<div style="background:#131c2e;border-radius:14px;padding:16px;margin-bottom:12px"><b>${id}</b><br><small style="color:#64748b">Customer • WhatsApp</small></div><div style="background:#131c2e;border-radius:14px;padding:16px">📞 ${id}</div>`;loadMsgs();render();}
async function loadMsgs(){if(!cur)return;const r=await fetch('/api/messages/'+cur);const m=await r.json();const b=document.getElementById('msgs');b.innerHTML='';m.forEach(x=>{const d=document.createElement('div');d.className='m '+(x.direction==='in'?'in':'out');let h=x.text||'';if(x.media_url){if((x.media_type||'').includes('image'))h=`<img src="${x.media_url}" style="max-width:220px;border-radius:10px"><br>${h}`;else h=`<a href="${x.media_url}" target="_blank">📎 Archivo</a><br>${h}`}d.innerHTML=h;b.appendChild(d)});b.scrollTop=b.scrollHeight;}
async function send(){const v=document.getElementById('txt').value;if(!v||!cur)return;await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:cur,message:v})});document.getElementById('txt').value='';loadMsgs();}
setInterval(async()=>{await load();if(cur)loadMsgs()},3000);load();
</script></body></html>
