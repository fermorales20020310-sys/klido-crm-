<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO - CRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:white;font-family:Inter,sans-serif;display:flex;height:100vh}
.sidebar{width:250px;background:#1e293b;padding:20px;display:flex;flex-direction:column;gap:10px}
.sidebar img{width:80px;margin:0 auto 10px;display:block}
.sidebar h2{text-align:center;font-size:18px;margin-bottom:20px}
.btn{padding:12px;background:#334155;border:none;color:white;border-radius:8px;cursor:pointer;text-align:left}
.btn.active{background:#0ea5e9}
.main{flex:1;display:flex}
.contacts{width:300px;background:#1e293b;border-right:1px solid #334155;overflow-y:auto}
.contact{padding:15px;border-bottom:1px solid #334155;cursor:pointer}
.contact:hover{background:#334155}
.chat{flex:1;display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:70%;padding:10px 15px;border-radius:15px}
.msg.in{background:#334155;align-self:flex-start}
.msg.out{background:#0ea5e9;align-self:flex-end}
.input-area{display:flex;padding:15px;gap:10px;background:#1e293b}
.input-area input{flex:1;padding:12px;border-radius:8px;border:none;background:#334155;color:white}
.input-area button{padding:12px 20px;background:#0ea5e9;border:none;border-radius:8px;color:white;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0ea5e9;padding:10px 20px;border-radius:20px;display:none}
</style>
</head>
<body>
<div class="sidebar">
<img src="logo.png" alt="K">
<h2>KLIDO AVANZA</h2>
<button class="btn active" onclick="location.href='index.html'">💬 Bandeja</button>
<button class="btn" onclick="location.href='campanas.html'">📢 Campañas</button>
<button class="btn" onclick="location.href='bandeja.html'">📥 Mensajes</button>
<button class="btn" onclick="showToast('Próximamente')">⚙️ Configuración</button>
</div>
<div class="main">
<div class="contacts" id="contacts">Cargando...</div>
<div class="chat">
<div class="messages" id="messages"><p style="text-align:center;margin-top:100px;opacity:0.5">Selecciona un chat</p></div>
<div class="input-area">
<input id="msgInput" placeholder="Escribe un mensaje...">
<button onclick="sendMsg()">Enviar</button>
</div>
</div>
</div>
<div class="toast" id="toast">Próximamente</div>
<script>
let currentPhone=null;
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2000)}
async function loadContacts(){
  try{
    let r=await fetch('/api/contacts'); let data=await r.json();
    let html='';
    if(data.length==0) html='<p style="padding:20px;opacity:0.6">0 chats</p>';
    data.forEach(c=>{
      html+=`<div class="contact" onclick="openChat('${c.phone}')"><b>${c.name||c.phone}</b><br><small>${c.lastMessage||''}</small> ${c.unread?'<span style="background:#0ea5e9;border-radius:50%;padding:2px 6px;float:right">'+c.unread+'</span>':''}</div>`;
    });
    document.getElementById('contacts').innerHTML=html;
  }catch(e){console.log(e)}
}
async function openChat(phone){
  currentPhone=phone;
  fetch('/api/read/'+phone,{method:'POST'});
  loadMessages();
}
async function loadMessages(){
  if(!currentPhone) return;
  let r=await fetch('/api/messages/'+currentPhone); let data=await r.json();
  let html=''; data.forEach(m=>{html+=`<div class="msg ${m.direction}">${m.text}</div>`});
  document.getElementById('messages').innerHTML=html;
  document.getElementById('messages').scrollTop=99999;
}
async function sendMsg(){
  let txt=document.getElementById('msgInput').value; if(!txt||!currentPhone) return;
  document.getElementById('msgInput').value='';
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:currentPhone,message:txt})});
  loadMessages(); loadContacts();
}
setInterval(()=>{loadContacts(); if(currentPhone) loadMessages()},3000);
loadContacts();
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter') sendMsg()});
</script>
</body>
</html>
