<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO CRM - WhatsApp Business Platform</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
.msg-campaign{border-left:4px solid #fbbf24;background:#fefce8!important}
.badge-camp{background:#fbbf24;color:#000;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}
.online-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>
<body class="bg-gray-100">
<div id="login" class="min-h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-xl shadow-lg w-96">
<h1 class="text-2xl font-bold mb-1">KLIDO CRM</h1>
<p class="text-sm text-gray-500 mb-6">WhatsApp Business Platform</p>
<input id="email" placeholder="Email" class="w-full border p-3 rounded mb-3">
<input id="pass" type="password" placeholder="Password" class="w-full border p-3 rounded mb-4">
<button onclick="doLogin()" class="w-full bg-green-600 text-white p-3 rounded font-bold">Ingresar</button>
<p class="text-xs text-gray-400 mt-4 text-center">Uso exclusivo con WhatsApp Business API<br>Plantillas aprobadas por Meta</p>
</div></div>

<div id="app" class="hidden h-screen flex">
<!-- Sidebar -->
<div class="w-80 bg-white border-r flex flex-col">
<div class="p-4 border-b"><h2 class="font-bold">Chats <span class="online-dot"></span> <span class="text-xs text-green-600">online</span></h2></div>
<div id="chatList" class="flex-1 overflow-y-auto"></div>
<div class="p-2 border-t flex gap-2">
<button onclick="showTab('chats')" class="flex-1 bg-gray-100 p-2 rounded text-sm">Chats</button>
<button onclick="showTab('campaigns')" class="flex-1 bg-gray-100 p-2 rounded text-sm">Campañas</button>
</div></div>

<!-- Chat view -->
<div id="tab-chats" class="flex-1 flex flex-col">
<div id="chatHeader" class="p-4 bg-white border-b font-bold">Selecciona un chat</div>
<div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-50"></div>
<div class="p-4 bg-white border-t flex gap-2">
<input id="msgInput" placeholder="Escribe..." class="flex-1 border p-2 rounded" onkeypress="if(event.key==='Enter')sendMsg()">
<input type="file" id="fileInput" class="hidden" onchange="sendFile()">
<button onclick="document.getElementById('fileInput').click()" class="bg-gray-200 px-3 rounded">📎</button>
<button onclick="sendMsg()" class="bg-green-600 text-white px-4 rounded">Enviar</button>
</div></div>

<!-- Campaigns view -->
<div id="tab-campaigns" class="flex-1 hidden flex-col p-6 overflow-y-auto">
<h2 class="text-xl font-bold mb-4">Campañas 100% Meta Compliance</h2>
<div class="bg-white p-4 rounded shadow mb-4">
<label class="font-bold text-sm">1. Plantilla aprobada (auto desde API)</label>
<select id="tplSelect" class="w-full border p-2 rounded mt-2"></select>
<label class="font-bold text-sm mt-4 block">2. Subir Excel con números</label>
<input type="file" id="excelInput" accept=".xlsx,.xls,.csv" class="mt-2">
<div id="numsPreview" class="text-sm text-gray-600 mt-2"></div>
<button onclick="sendCampaign()" class="mt-4 bg-yellow-500 text-black font-bold px-6 py-2 rounded">Enviar campaña legal</button>
<p class="text-xs text-gray-500 mt-2">✓ Solo plantillas APPROVED ✓ Solo contactos con opt-in ✓ Incluye opción de baja</p>
</div>
<h3 class="font-bold mb-2">Historial de campañas</h3>
<div id="campHistory" class="space-y-2"></div>
</div>
</div>

<script>
let token=localStorage.getItem('t'), currentWa=null, excelNumbers=[];
const api=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(o.headers||{})}}).then(r=>r.json());

async function doLogin(){
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pass').value})}).then(r=>r.json());
 if(r.ok){token=r.token;localStorage.setItem('t',token);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAll();}else alert('Login fallido');
}
function showTab(t){
 document.getElementById('tab-chats').style.display=t==='chats'?'flex':'none';
 document.getElementById('tab-campaigns').style.display=t==='campaigns'?'flex':'none';
 if(t==='campaigns')loadTemplates()+loadCampHistory();
}
async function loadAll(){loadChats();setInterval(()=>{loadChats();if(currentWa)loadMessages(true)},3000);}
async function loadChats(){
 const d=await api('/api/chats');if(!d.ok)return;
 document.getElementById('chatList').innerHTML=d.chats.map(c=>`
 <div onclick="openChat('${c.wa_id}')" class="p-3 border-b hover:bg-gray-50 cursor-pointer ${c.has_campaign?'bg-yellow-50':''}">
 <div class="flex justify-between"><b>${c.wa_id}</b>${c.has_campaign?'<span class="badge-camp">CAMPANA</span>':''}</div>
 <div class="text-sm text-gray-500 truncate">${c.last_msg||''}</div></div>`).join('');
}
async function openChat(wa){currentWa=wa;document.getElementById('chatHeader').innerHTML=wa+' <span class="online-dot"></span>';loadMessages();}
async function loadMessages(silent){
 if(!currentWa)return;const d=await api('/api/chats/'+currentWa+'/messages');if(!d.ok)return;
 const box=document.getElementById('messages');
 box.innerHTML=d.messages.map(m=>`
 <div class="p-2 rounded max-w-xs ${m.direction==='out'?'ml-auto bg-green-100':'bg-white shadow'} ${m.is_campaign?'msg-campaign':''}">
 ${m.is_campaign?'<span class="badge-camp">CAMPANA</span><br>':''}
 ${m.type==='image'?'📷 ':m.type==='document'?'📄 ':m.type==='video'?'🎥 ':m.type==='audio'?'🎙️ ':''}${m.body}
 <div class="text-xs text-gray-400">${new Date(m.created_at).toLocaleString()}</div></div>`).join('');
 if(!silent)box.scrollTop=box.scrollHeight;
}
async function sendMsg(){
 const b=document.getElementById('msgInput').value;if(!b||!currentWa)return;
 await api('/api/chats/send',{method:'POST',body:JSON.stringify({to:currentWa,body:b})});
 document.getElementById('msgInput').value='';loadMessages();
}
async function sendFile(){alert('Sube el archivo a tu CDN y pega la URL. Demo: se envía como documento.');}
async function loadTemplates(){
 const d=await fetch('/api/templates',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
 document.getElementById('tplSelect').innerHTML=(d||[]).map(t=>`<option value="${t.name}">${t.name} (${t.language})</option>`).join('')||'<option>Sin plantillas aprobadas</option>';
}
document.getElementById('excelInput')?.addEventListener('change',async e=>{
 const fd=new FormData();fd.append('file',e.target.files[0]);
 const d=await fetch('/api/campaigns/upload-excel',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd}).then(r=>r.json());
 if(d.ok){excelNumbers=d.numbers;document.getElementById('numsPreview').innerText=d.count+' números detectados automáticamente';}
});
async function sendCampaign(){
 const tpl=document.getElementById('tplSelect').value;
 if(!excelNumbers.length)return alert('Sube un Excel primero');
 const d=await api('/api/campaigns/send-bulk',{method:'POST',body:JSON.stringify({numbers:excelNumbers,templateName:tpl})});
 alert(`Enviados: ${d.sent}, Fallidos: ${d.failed}, Omitidos sin opt-in: ${d.skipped}`);loadCampHistory();
}
async function loadCampHistory(){
 const d=await api('/api/campaigns');
 document.getElementById('campHistory').innerHTML=(d||[]).map(c=>`
 <div class="bg-white p-3 rounded shadow text-sm"><b>${c.name}</b> - ${c.status}<br>Total:${c.total} Enviados:${c.sent} Fallidos:${c.failed}<br><span class="text-gray-400">${new Date(c.created_at).toLocaleString()}</span></div>`).join('');
}
if(token){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadAll();}
</script>
</body></html>
