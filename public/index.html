<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KLIDO CRM</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}body{background:#0a101f;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}.sidebar{width:260px;background:#111a2f;border-right:1px solid #1e2a45;padding:24px;display:flex;flex-direction:column}.logo-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo-wrap img{width:48px;height:48px;border-radius:12px;background:#0e172c;padding:6px}.status{font-size:12px;background:#132036;padding:6px 10px;border-radius:20px;display:flex;gap:6px;align-items:center;width:fit-content;margin-bottom:20px}.dot{width:8px;height:8px;background:#22c55e;border-radius:50%}.nav button{background:transparent;border:none;color:#94a3b8;padding:12px;border-radius:10px;text-align:left;cursor:pointer;width:100%;margin-bottom:6px}.nav button.active{background:#1a2744;color:white}.main{flex:1;display:flex}.list{width:360px;background:#0f1a30;border-right:1px solid #1e2a45;display:flex;flex-direction:column}.list-head{padding:20px;border-bottom:1px solid #1e2a45}.search{width:100%;background:#16233f;border:1px solid #1e2a45;padding:10px;border-radius:10px;color:white}.contacts{flex:1;overflow-y:auto}.contact{padding:14px 20px;border-bottom:1px solid #16233f;cursor:pointer;display:flex;justify-content:space-between}.contact:hover,.contact.active{background:#16233f}.contact b{font-size:14px}.contact small{color:#64748b;font-size:12px}.unread{background:#0ea5e9;padding:2px 7px;border-radius:50%;font-size:11px;color:white}.chat{flex:1;display:flex;flex-direction:column}.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0.6}.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.msg{max-width:70%;padding:10px 14px;border-radius:16px;font-size:14px}.msg.in{background:#1a2744;align-self:flex-start}.msg.out{background:#0ea5e9;color:white;align-self:flex-end}.input-bar{padding:14px;background:#111a2f;border-top:1px solid #1e2a45;display:flex;gap:10px}.input-bar input{flex:1;background:#16233f;border:1px solid #1e2a45;padding:12px;border-radius:12px;color:white}.input-bar button{background:#0ea5e9;border:none;padding:12px 18px;border-radius:12px;color:white;cursor:pointer}</style></head><body>
<div class="sidebar"><div class="logo-wrap"><img src="logo.png"><h1 style="font-size:14px">KLIDO AVANZA</h1></div><div class="status"><div class="dot"></div> WhatsApp Conectado</div><div class="nav"><button class="active">💬 Inbox</button><button onclick="location.href='campanas.html'">📢 Campaigns</button><button onclick="location.href='campanas.html'">📄 Templates</button></div></div>
<div class="main"><div class="list"><div class="list-head"><h2 id="count">0 chats</h2><input class="search" id="search" placeholder="Buscar..." oninput="filterContacts()"></div><div class="contacts" id="contacts"></div></div><div class="chat"><div class="chat-empty" id="empty"><img src="logo.png" style="width:80px"><h3>Selecciona un chat</h3></div><div class="msgs" id="msgs" style="display:none"></div><div class="input-bar" id="inputBar" style="display:none"><input id="msgInput" placeholder="Escribe..."><button onclick="sendMsg()">Enviar</button></div></div></div>
<script>let current=null,all=[];async function loadContacts(){let r=await fetch('/api/contacts');all=await r.json();document.getElementById('count').textContent=all.length+' chats';render(all)}function render(list){let h='';list.forEach(c=>{h+=`<div class="contact ${current==c.phone?'active':''}" onclick="openChat('${c.phone}')"><div><b>${c.name||c.phone}</b><br><small>${(c.lastMessage||'').substring(0,30)}</small></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div>`});document.getElementById('contacts').innerHTML=h||'<p style="padding:20px;opacity:.5">No hay chats</p>'}function filterContacts(){let q=document.getElementById('search').value.toLowerCase();render(all.filter(c=>(c.name||'').toLowerCase().includes(q)||c.phone.includes(q)))}async function openChat(p){current=p;document.getElementById('empty').style.display='none';document.getElementById('msgs').style.display='flex';document.getElementById('inputBar').style.display='flex';fetch('/api/read/'+p,{method:'POST'});loadMsgs()}async function loadMsgs(){if(!current)return;let r=await fetch('/api/messages/'+current);let d=await r.json();let h='';d.forEach(m=>h+=`<div class="msg ${m.direction}">${m.text}</div>`);let el=document.getElementById('msgs');el.innerHTML=h;el.scrollTop=9999}async function sendMsg(){let t=document.getElementById('msgInput').value;if(!t||!current)return;document.getElementById('msgInput').value='';await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:current,message:t})});loadMsgs();loadContacts()}setInterval(()=>{loadContacts();if(current)loadMsgs()},3000);loadContacts();document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key=='Enter')sendMsg()});</script></body></html>
