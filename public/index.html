<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO CRM PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0f1e;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:#101a30;border-right:1px solid #1d2b4a;padding:20px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;gap:10px;align-items:center;font-weight:800}
.badge{background:#122040;border:1px solid #1d2b4a;padding:6px 12px;border-radius:20px;font-size:11px;display:flex;gap:6px;align-items:center;width:fit-content}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 8px #22c55e}
.nav a{padding:11px 12px;border-radius:10px;color:#8da0c3;text-decoration:none;display:block;margin-bottom:6px}
.nav a.active{background:#182848;color:white;font-weight:600}
.list{width:380px;background:#0f1b31;border-right:1px solid #1d2b4a;display:flex;flex-direction:column}
.list-top{padding:18px;border-bottom:1px solid #1d2b4a}
.search{width:100%;background:#162447;border:1px solid #1d2b4a;color:white;padding:10px 12px;border-radius:10px;outline:none}
.contacts{flex:1;overflow-y:auto}
.c{padding:14px 18px;border-bottom:1px solid #162447;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.c:hover{background:#162447}.c.sel{background:#1a2d52;border-left:3px solid #0ea5e9}
.c.campaign{border-left:3px solid #facc15;background:linear-gradient(90deg,rgba(250,204,21,0.12),transparent)}
.badge-camp{background:#facc15;color:#000;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;margin-left:6px}
.c b{font-size:13px;display:block}.c small{color:#6b7da0;font-size:11px}
.unread{background:#0ea5e9;color:white;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.chat{flex:1;display:flex;flex-direction:column}
.chat-head{padding:14px 18px;border-bottom:1px solid #1d2b4a;background:#101a30;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;background:#1e3a8a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.chat-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:65%;padding:10px 14px;border-radius:16px;font-size:13px}
.bubble.in{background:#1c2e52;align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:#0ea5e9;color:white;align-self:flex-end;border-bottom-right-radius:4px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.5}
.input-wrap{padding:14px;background:#101a30;border-top:1px solid #1d2b4a;display:flex;gap:10px}
.input-wrap input{flex:1;background:#162447;border:1px solid #1d2b4a;padding:12px 14px;border-radius:22px;color:white;outline:none}
.input-wrap button{background:#0ea5e9;border:none;color:white;padding:10px 20px;border-radius:22px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo">🚀 KLIDO AVANZA</div>
<div class="badge"><div class="dot"></div>WhatsApp Conectado</div>
<div class="nav"><a class="active">💬 Inbox</a><a href="campanas.html">📢 Campaigns</a></div>
</div>
<div class="list"><div class="list-top"><h3 id="count">0 chats</h3><input id="q" class="search" placeholder="Buscar..." oninput="filter()"></div><div class="contacts" id="contactsList"></div></div>
<div class="chat">
<div class="chat-head" id="chatHead" style="display:none"><div class="avatar" id="av">F</div><div><b id="chatName"></b><small id="chatPhone" style="color:#6b7da0"></small></div></div>
<div class="chat-body" id="chatBody"><div class="empty"><div style="font-size:50px">💬</div><p>Selecciona un chat</p></div></div>
<div class="input-wrap" id="inputWrap" style="display:none"><input id="msgInput" placeholder="Escribe..."><button onclick="send()">Enviar</button></div>
</div>
<script>
let all=[],cur=null;
async function loadContacts(){let r=await fetch('/api/contacts'); all=await r.json(); document.getElementById('count').innerText=all.length+' chats'; render(all);}
function render(list){
  let h=''; list.forEach(c=>{
    h+=`<div class="c ${cur===c.phone?'sel':''} ${c.source==='campaign'?'campaign':''}" onclick="openChat('${c.phone}','${(c.name||'').replace(/'/g,'')}')">
    <div style="flex:1"><b>${c.name||c.phone} ${c.source==='campaign'?`<span class="badge-camp">📢 ${c.campaign_name||'CAMPAÑA'}</span>`:''}</b><small>${(c.lastMessage||'').substring(0,38)}</small></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}</div>`;
  }); document.getElementById('contactsList').innerHTML=h;
}
function filter(){let q=document.getElementById('q').value.toLowerCase(); render(all.filter(c=>(c.name||'').toLowerCase().includes(q)||c.phone.includes(q)));}
async function openChat(phone,name){cur=phone; document.getElementById('chatHead').style.display='flex'; document.getElementById('inputWrap').style.display='flex'; document.getElementById('chatName').innerText=name||phone; document.getElementById('chatPhone').innerText=phone; document.getElementById('av').innerText=(name||phone)[0].toUpperCase(); render(all); fetch('/api/read/'+phone,{method:'POST'}); loadMessages();}
async function loadMessages(){if(!cur) return; let r=await fetch('/api/messages/'+cur); let msgs=await r.json(); let body=document.getElementById('chatBody'); if(!msgs.length){body.innerHTML=`<div class="empty"><p>Sin mensajes</p></div>`;return;} let h=''; msgs.forEach(m=>{h+=`<div class="bubble ${m.direction==='in'?'in':'out'}">${m.text}</div>`}); body.innerHTML=h; body.scrollTop=body.scrollHeight;}
async function send(){let inp=document.getElementById('msgInput'); let t=inp.value.trim(); if(!t||!cur) return; inp.value=''; document.getElementById('chatBody').innerHTML+=`<div class="bubble out">${t}</div>`; await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:cur,message:t})}); loadMessages();}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
setInterval(()=>{loadContacts(); if(cur) loadMessages();},3000); loadContacts();
</script>
</body>
</html>
