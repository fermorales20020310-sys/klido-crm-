<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO CRM PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0f1e;color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
.sidebar{width:280px;background:#101a30;border-right:1px solid #1d2b4a;padding:24px;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:12px}.logo img{width:42px;height:42px;border-radius:12px}
.badge{background:#122040;border:1px solid #1d2b4a;padding:6px 12px;border-radius:20px;font-size:12px;display:flex;gap:8px;align-items:center;width:fit-content}.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 10px #22c55e}
.nav{display:flex;flex-direction:column;gap:8px}.nav a{padding:12px 14px;border-radius:10px;color:#8da0c3;text-decoration:none;display:flex;gap:10px}.nav a.active{background:#182848;color:white;font-weight:600}
.list{width:380px;background:#0f1b31;border-right:1px solid #1d2b4a;display:flex;flex-direction:column}
.list-top{padding:20px;border-bottom:1px solid #1d2b4a}.list-top h2{font-size:18px;margin-bottom:12px}
.search{width:100%;background:#162447;border:1px solid #1d2b4a;color:white;padding:11px 14px;border-radius:12px;outline:none}
.contacts{flex:1;overflow-y:auto}
.c{padding:16px 20px;border-bottom:1px solid #162447;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.c:hover{background:#162447}.c.sel{background:#1a2d52;border-left:3px solid #0ea5e9}
.c b{display:block;font-size:14px;margin-bottom:4px}.c small{color:#6b7da0;font-size:12px}
.unread{background:#0ea5e9;color:white;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:700}
.chat{flex:1;display:flex;flex-direction:column;background:#0a0f1e}
.chat-head{padding:16px 20px;border-bottom:1px solid #1d2b4a;background:#101a30;display:flex;align-items:center;gap:12px}
.chat-head .avatar{width:36px;height:36px;background:#1e3a8a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.chat-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 20% 30%, #101a30 0%, #0a0f1e 60%)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.5;gap:12px}
.bubble{max-width:65%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4;word-wrap:break-word}
.bubble.in{background:#1c2e52;align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:white;align-self:flex-end;border-bottom-right-radius:4px}
.time{font-size:10px;opacity:.6;margin-top:6px;display:block}
.input-wrap{padding:16px;background:#101a30;border-top:1px solid #1d2b4a;display:flex;gap:12px;align-items:center}
.input-wrap input{flex:1;background:#162447;border:1px solid #1d2b4a;padding:14px 16px;border-radius:24px;color:white;outline:none}
.input-wrap button{background:#0ea5e9;border:none;color:white;padding:12px 22px;border-radius:24px;font-weight:700;cursor:pointer}
.input-wrap button:hover{background:#0284c7}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo"><img src="logo.png" onerror="this.style.display='none'"><div><div style="font-weight:800">KLIDO AVANZA</div><div style="font-size:11px;color:#6b7da0">CRM PRO</div></div></div>
<div class="badge"><div class="dot"></div>WhatsApp Conectado</div>
<div class="nav">
<a class="active">💬 Inbox</a>
<a href="campanas.html">📢 Campaigns</a>
<a href="campanas.html">📄 Templates</a>
</div>
</div>

<div class="list">
<div class="list-top"><h2 id="count">0 chats</h2><input id="q" class="search" placeholder="Buscar contacto..." oninput="filter()"></div>
<div class="contacts" id="contactsList"></div>
</div>

<div class="chat">
<div class="chat-head" id="chatHead" style="display:none"><div class="avatar" id="av">F</div><div><b id="chatName">Nombre</b><small id="chatPhone" style="color:#6b7da0">phone</small></div></div>
<div class="chat-body" id="chatBody"><div class="empty"><div style="font-size:60px">💬</div><h3>KLIDO CRM PRO</h3><p>Selecciona un chat para ver la conversación</p></div></div>
<div class="input-wrap" id="inputWrap" style="display:none"><input id="msgInput" placeholder="Escribe un mensaje..."><button onclick="send()">Enviar</button></div>
</div>

<script>
let all=[], cur=null;
async function loadContacts(){
  let r=await fetch('/api/contacts'); all=await r.json();
  document.getElementById('count').innerText=all.length+' chats';
  render(all);
}
function render(list){
  let h='';
  list.forEach(c=>{
    h+=`<div class="c ${cur===c.phone?'sel':''}" onclick="openChat('${c.phone}','${(c.name||c.phone).replace(/'/g,'')}')">
    <div style="flex:1"><b>${c.name||c.phone}</b><small>${(c.lastMessage||'Sin mensajes').substring(0,40)}</small></div>
    ${c.unread?`<span class="unread">${c.unread}</span>`:''}
    </div>`;
  });
  document.getElementById('contactsList').innerHTML=h||'<p style="padding:20px;color:#6b7da0">No hay chats aún. Escríbele a tu número</p>';
}
function filter(){
  let q=document.getElementById('q').value.toLowerCase();
  render(all.filter(c=>(c.name||'').toLowerCase().includes(q)||c.phone.includes(q)));
}
async function openChat(phone,name){
  cur=phone;
  document.getElementById('chatHead').style.display='flex';
  document.getElementById('inputWrap').style.display='flex';
  document.getElementById('chatName').innerText=name||phone;
  document.getElementById('chatPhone').innerText=phone;
  document.getElementById('av').innerText=(name||phone).charAt(0).toUpperCase();
  render(all); // para marcar seleccionado
  fetch('/api/read/'+phone,{method:'POST'});
  loadMessages();
}
async function loadMessages(){
  if(!cur) return;
  let r=await fetch('/api/messages/'+cur);
  let msgs=await r.json();
  let body=document.getElementById('chatBody');
  if(msgs.length===0){
    body.innerHTML=`<div class="empty"><p>No hay mensajes aún con ${cur}</p></div>`;
    return;
  }
  let h='';
  msgs.forEach(m=>{
    h+=`<div class="bubble ${m.direction==='in'?'in':'out'}">${m.text}<span class="time">${m.direction==='in'?'Recibido':'Enviado'}</span></div>`;
  });
  body.innerHTML=h;
  body.scrollTop=body.scrollHeight;
}
async function send(){
  let inp=document.getElementById('msgInput'); let t=inp.value.trim(); if(!t||!cur) return;
  inp.value='';
  // optimista
  let body=document.getElementById('chatBody');
  body.innerHTML+=`<div class="bubble out">${t}<span class="time">Enviando...</span></div>`;
  body.scrollTop=body.scrollHeight;
  await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:cur,message:t})});
  loadMessages(); loadContacts();
}
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')send()});
setInterval(()=>{loadContacts(); if(cur) loadMessages();},3000);
loadContacts();
</script>
</body>
</html>
