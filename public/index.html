<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Klido CRM</title>
<style>body{margin:0;font-family:Arial;display:flex;height:100vh} #list{width:30%;border-right:1px solid #ddd;overflow:auto} #chat{flex:1;display:flex;flex-direction:column} .c{padding:12px;border-bottom:1px solid #eee;cursor:pointer} .c.active{background:#eef} #msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px} .m{padding:8px 12px;border-radius:12px;max-width:70%} .me{align-self:flex-end;background:#dcf8c6} .them{align-self:flex-start;background:#fff;border:1px solid #ddd} #send{display:flex;padding:10px;border-top:1px solid #ddd} #send input{flex:1;padding:10px}</style>
</head><body>
<div id="list"></div>
<div id="chat"><div id="msgs"></div><div id="send"><input id="txt" placeholder="Escribe..."><button onclick="enviar()">Enviar</button></div></div>
<script>
let sel=null;
async function loadCons(){let r=await fetch('/api/conversations');let d=await r.json();list.innerHTML=d.map(x=>`<div class=c onclick="openChat('${x.phone}')"><b>${x.name}</b><br>${x.phone}</div>`).join('')}
async function openChat(phone){sel=phone;let r=await fetch('/api/messages/'+phone);let d=await r.json();msgs.innerHTML=d.map(m=>`<div class="m ${m.from_me?'me':'them'}">${m.body}</div>`).join(''); msgs.scrollTop=9999}
async function enviar(){let t=txt.value; if(!t||!sel) return; await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:sel,text:t})}); txt.value=''; openChat(sel); }
setInterval(()=>{if(sel)openChat(sel);loadCons()},3000); loadCons();
</script>
</body></html>
