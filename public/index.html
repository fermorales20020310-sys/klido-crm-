<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO Campañas</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');*{font-family:Inter,sans-serif;box-sizing:border-box}body{margin:0;background:#f6f7fb}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.card{max-width:760px;margin:32px auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.drop{border:2px dashed #d1d5db;border-radius:16px;padding:36px;text-align:center;cursor:pointer;background:#f9fafb}.drop:hover{border-color:#111827;background:#f3f4f6}select,input{width:100%;padding:12px 14px;border:1px solid #e5e7eb;border-radius:10px;margin-top:8px;font-size:14px}.btn{width:100%;padding:14px;background:#111827;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer}.btn:disabled{background:#9ca3af}</style></head><body>
<div class="top"><div style="display:flex;align-items:center;gap:10px"><img src="/logo.png" style="height:36px;object-fit:contain"><b>KLIDO AVANZA</b><span style="font-size:12px;color:#6b7280;margin-left:8px">Campañas API Oficial</span></div><button onclick="location.href='/'" style="padding:8px 14px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;cursor:pointer">← Bandeja</button></div>
<div class="card"><h2 style="margin:0">Lanzar nueva campaña</h2><p style="color:#6b7280;font-size:13px;margin:8px 0 20px">Tus plantillas se cargan automático de la API de Meta. Si apruebas una nueva, aparece aquí sola.</p>
<label style="font-size:13px;font-weight:600">Plantilla aprobada (API)</label><select id="tpl"><option>Cargando plantillas...</option></select><div id="info" style="font-size:11px;color:#6b7280;margin-top:4px"></div>
<label style="font-size:13px;font-weight:600;margin-top:16px;display:block">Nombre campaña (para amarillo)</label><input id="cname" placeholder="Ej: Alianza Agosto - alion_co">
<label style="font-size:13px;font-weight:600;margin-top:16px;display:block">Excel con números</label><div class="drop" id="drop" onclick="document.getElementById('f').click()"><div style="font-size:28px">📊</div><b>Arrastra tu Excel aquí</b><div style="font-size:12px;color:#6b7280">o haz clic para seleccionar</div><input type="file" id="f" accept=".xlsx,.xls,.csv" style="display:none"><div id="fname" style="margin-top:10px;font-size:12px"></div></div><div id="prev" style="display:none;margin-top:12px;background:#f9fafb;padding:12px;border-radius:10px;font-size:12px"></div>
<button class="btn" id="btn" disabled onclick="go()">Enviar campaña ahora</button><div id="res" style="margin-top:12px"></div><h3 style="margin-top:28px">Historial y seguimiento</h3><div id="hist" style="font-size:13px"></div></div>
<script>let nums=[];async function loadTpl(){try{let r=await fetch('/api/templates');let t=await r.json();let s=document.getElementById('tpl');if(!t.length){s.innerHTML='<option>No hay plantillas - verifica WABA_ID</option>';return;}s.innerHTML=t.map(x=>`<option value="${x.name}">${x.name} (${x.language})</option>`).join('');document.getElementById('info').innerText=t.length+' plantillas aprobadas cargadas automático';check();}catch(e){}}function check(){document.getElementById('btn').disabled=!(nums.length>0&&document.getElementById('tpl').value);}document.getElementById('f').onchange=e=>h(e.target.files[0]);let d=document.getElementById('drop');d.ondragover=e=>{e.preventDefault();d.style.borderColor='#111827';};d.ondrop=e=>{e.preventDefault();h(e.dataTransfer.files[0]);};function h(file){if(!file)return;document.getElementById('fname').innerText='📁 '+file.name;let rd=new FileReader();rd.onload=e=>{let wb=XLSX.read(e.target.result,{type:'binary'});let ws=wb.Sheets[wb.SheetNames[0]];let data=XLSX.utils.sheet_to_json(ws,{header:1});nums=data.flat().map(v=>String(v||'').replace(/\D/g,'')).filter(v=>v.length>=10);nums=[...new Set(nums)];document.getElementById('prev').style.display='block';document.getElementById('prev').innerText=nums.length+' contactos: '+nums.slice(0,15).join(', ');check();};rd.readAsBinaryString(file);}async function go(){let tpl=document.getElementById('tpl').value;let nm=document.getElementById('cname').value||tpl;if(!confirm(`Enviar ${tpl} a ${nums.length} contactos?`))return;document.getElementById('btn').innerText='Enviando...';let r=await fetch('/api/send-campaign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({numbers:nums,templateName:tpl,campaignName:nm})});let res=await r.json();document.getElementById('res').innerHTML=`<div style="background:#dcfce7;padding:10px;border-radius:8px">✅ Enviados ${res.sent} - Fallidos ${res.failed}. Aparecerán en amarillo, al responder entran a Hot con puntico rojo.</div>`;document.getElementById('btn').innerText='Enviar campaña ahora';loadH();}async function loadH(){let r=await fetch('/api/campaigns');let h=await r.json();document.getElementById('hist').innerHTML=h.map(c=>`<div style="border:1px solid #e5e7eb;padding:10px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between"><div><b>${c.name}</b><br><small>${new Date(c.date).toLocaleString()} - ${c.template}</small></div><div>${c.sent}/${c.total}</div></div>`).join('')||'Sin campañas';}loadTpl();loadH();setInterval(loadTpl,30000);</script></body></html>
