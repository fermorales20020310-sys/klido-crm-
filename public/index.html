<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO AVANZA - CRM PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{display:flex;height:100vh;background:#0f172a;color:#fff}
.sidebar{width:240px;background:#111c30;border-right:1px solid #1e293b;padding:16px;display:flex;flex-direction:column}
.logo{font-weight:900;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:20px}
.badge{font-size:11px;background:#132a1e;color:#4ade80;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%}
.menu{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.menu a{padding:10px 12px;border-radius:10px;color:#94a3b8;text-decoration:none;display:flex;gap:8px}
.menu a.active{background:#1a2b4a;color:#fff}
.chats{width:340px;background:#162032;border-right:1px solid #1e293b;display:flex;flex-direction:column}
.chats h3{padding:16px}
.search{margin:0 12px 12px 12px;background:#0f172a;border-radius:10px;padding:8px 12px}
.search input{width:100%;background:transparent;border:0;color:#fff;outline:none}
.chat-item{padding:12px 16px;border-bottom:1px solid #1e293b22;cursor:pointer}
.chat-item:hover,.chat-item.active{background:#1a2b4a}
.chat-item b{font-size:14px}
.chat-item p{font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{background:#0ea5e9;color:#fff;font-size:11px;padding:2px 7px;border-radius:20px;float:right}
.main{flex:1;display:flex;flex-direction:column;background:#0f172a}
.header{padding:12px 20px;background:#111c30;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;background:#1e3a8a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#0f172a}
.msg{max-width:60%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4}
.recibido{background:#1e293b;align-self:flex-start}
.enviado{background:#0ea5e9;align-self:flex-end}
.msg a{color:#7dd3fc}
.msg img{max-width:220px;border-radius:10px;margin-top:6px;display:block}
.footer{padding:12px;display:flex;gap:10px;background:#111c30;border-top:1px solid #1e293b}
.footer input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:12px 16px;color:#fff;outline:none}
.footer button{background:#0ea5e9;border:0;color:#fff;padding:10px 20px;border-radius:20px;cursor:pointer;font-weight:bold}
.file-preview{color:#94a3b8;font-size:12px;margin-bottom:4px}
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">🐙 KLIDO AVANZA <span style="font-size:10px;color:#94a3b8">CRM PRO</span></div>
  <div class="badge"><span class="dot"></span> WhatsApp Conectado</div>
  <div class="menu">
    <a class="active">💬 Inbox</a>
    <a href="/campanas.html">📢 Campaigns</a>
    <a href="/templates.html">📄 Templates</a>
  </div>
</div>

<div class="chats">
  <h3 id="chatCount">5 chats</h3>
  <div class="search"><input id="search" placeholder="Buscar contacto..."></div>
  <div id="chatList"></div>
</div>

<div class="main">
  <div class="header" id="headerChat"><div class="avatar">V</div><div><b id="chatName">Selecciona un chat</b><div style="font-size:11px;color:#94a3b8" id="chatPhone"></div></div></div>
  <div class="messages" id="messages"></div>
  <div class="footer">
    <input id="msgInput" placeholder="Escribe un mensaje...">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
let currentWa = null;
let allChats = [];

async function loadChats(){
  const res = await fetch('/api/chats');
  allChats = await res.json();
  document.getElementById('chatCount').innerText = `${allChats.length} chats`;
  renderChats(allChats);
}

function renderChats(chats){
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c=>{
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.wa_id===currentWa?' active':'');
    div.innerHTML = `<b>${c.name||c.wa_id}</b> ${c.unread?`<span class="unread">1</span>`:''}<p>${c.text?.substring(0,40)||''}</p>`;
    div.onclick = ()=> openChat(c.wa_id, c.name||c.wa_id);
    list.appendChild(div);
  });
}

async function openChat(wa_id, name){
  currentWa = wa_id;
  document.getElementById('chatName').innerText = name;
  document.getElementById('chatPhone').innerText = wa_id;
  document.querySelectorAll('.chat-item').forEach(e=>e.classList.remove('active'));
  loadChats();
  
  const res = await fetch(`/api/messages/${wa_id}`);
  const msgs = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = '';
  
  msgs.forEach(m=>{
    const div = document.createElement('div');
    div.className = 'msg ' + (m.direction==='out' ? 'enviado' : 'recibido');
    
    let contenido = m.text || '';
    
    // --- ESTA ES LA PARTE ARREGLADA DE ARCHIVOS ---
    if(m.file_url){
      if(m.type==='image'){
        contenido = `<div class="file-preview">${m.text}</div><a href="${m.file_url}" target="_blank"><img src="${m.file_url}"></a>`;
      } else if(m.type==='document'){
        contenido = `📄 <a href="${m.file_url}" target="_blank" download>${m.text}<br><small>Click para ver/descargar PDF</small></a>`;
      } else if(m.type==='audio'){
        contenido = `<audio controls src="${m.file_url}" style="width:200px"></audio><br>${m.text}`;
      } else {
        contenido = `<a href="${m.file_url}" target="_blank">📎 ${m.text}</a>`;
      }
    }
    
    const hora = new Date(m.created_at).toLocaleTimeString();
    div.innerHTML = `${contenido}<div style="font-size:10px;opacity:0.6;margin-top:4px">${m.direction==='out'?'Enviado':'Recibido'} • ${hora}</div>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentWa) return;
  
  await fetch('/api/send',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({to:currentWa, message:text})
  });
  input.value='';
  openChat(currentWa, document.getElementById('chatName').innerText);
}

document.getElementById('msgInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') sendMessage();
});

document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  const filtered = allChats.filter(c=> (c.wa_id+c.name+c.text).toLowerCase().includes(q));
  renderChats(filtered);
});

loadChats();
setInterval(()=>{ if(currentWa) openChat(currentWa, document.getElementById('chatName').innerText); else loadChats(); }, 4000);
</script>
</body>
</html>
