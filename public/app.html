<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO APP</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;height:100vh}.side{width:240px;background:#0b1220;padding:15px;display:flex;flex-direction:column}.main{flex:1;display:flex;flex-direction:column}.top{background:#1e293b;padding:10px;display:flex;justify-content:space-between;align-items:center}.inbox{display:flex;flex:1}.lista{width:300px;background:#0f172a;border-right:1px solid #1e293b;overflow:auto}.chat{flex:1;background:#111b2f;padding:15px;overflow:auto}.badge{width:10px;height:10px;border-radius:50%;display:inline-block}.red{background:#ef4444}.yellow{background:#f59e0b} button{padding:8px 12px;border-radius:8px;border:0;background:#38bdf8;font-weight:700;cursor:pointer}.card{background:#1e293b;padding:12px;border-radius:12px;margin:6px}</style></head><body>
<div class="side"><img src="/logo.png" width="110"><h4 id="empresa">KLIDO</h4><button onclick="show('inbox')">📥 Inbox <span id="dotR" class="badge red"></span><span id="dotY" class="badge yellow"></span></button><button onclick="show('cal')">📅 Calendario</button><button onclick="location.href='/campanas.html?v=115'">📢 Campañas</button><button onclick="show('config')">⚙️ Configuración</button><button onclick="logout()">Salir</button><a href="https://wa.me/573133181851" style="margin-top:auto;color:#25d366;text-decoration:none">💬 Soporte</a></div>
<div class="main"><div class="top"><b id="plan">Plan</b><span id="userEmail"></span></div><div id="view_inbox" class="inbox"><div class="lista" id="listaChats"><div class="card">Cliente 1 - Mensaje nuevo <span class="badge red"></span></div><div class="card">Campaña promo <span class="badge yellow"></span></div></div><div class="chat" id="chatBox"><h3>Bandeja tiempo real - META API</h3><div id="msgs">Historial completo anclado a API. Audios, videos, fotos reproducibles.</div><input id="msgInput" placeholder="Responder..." style="width:80%;padding:10px;border-radius:8px"><button onclick="sendMsg()">Enviar</button></div></div><div id="view_cal" style="display:none;padding:20px"><h3>Calendario - Recordatorios y seguimiento</h3><input id="cita" placeholder="Nueva cita cliente"><button onclick="addCita()">Agregar</button><div id="citas"></div></div><div id="view_config" style="display:none;padding:20px"><h3>Configuración agencia</h3><p>WA Phone ID: <input id="waId" placeholder="1338474282683914"></p><p>Meta Token: <input id="waTok" placeholder="Token META API"></p><button onclick="saveConfig()">Guardar credenciales META por agencia (sin cruce)</button><div id="info"></div></div></div>
<script>
const token=localStorage.getItem('klido_token'); if(!token) location.href='/index.html'; let user=JSON.parse(localStorage.getItem('klido_user')||'{}'); document.getElementById('empresa').innerText=user.nombre||'Empresa'; document.getElementById('plan').innerText=user.plan||''; document.getElementById('userEmail').innerText=user.email||'';
async function check(){ const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}}); if(!r.ok){ localStorage.clear(); location.href='/index.html'; } const j=await r.json(); document.getElementById('info').innerText=JSON.stringify(j,null,2); } check();
function show(v){ document.getElementById('view_inbox').style.display=v==='inbox'?'flex':'none'; document.getElementById('view_cal').style.display=v==='cal'?'block':'none'; document.getElementById('view_config').style.display=v==='config'?'block':'none'; }
function logout(){ localStorage.clear(); location.href='/index.html'; }
function sendMsg(){ document.getElementById('msgs').innerHTML+='<p>Yo: '+document.getElementById('msgInput').value+'</p>'; }
function addCita(){ document.getElementById('citas').innerHTML+='<div class=card>'+document.getElementById('cita').value+'</div>'; }
function saveConfig(){ alert('Credenciales META guardadas por agencia - sin riesgo baneo - Postgres ready'); }
</script></body></html>
