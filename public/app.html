<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO APP - Trabajador v121</title><link rel="icon" href="/logo.png">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}body{display:flex;height:100vh;background:#020617;color:white}
.side{width:260px;background:#0f172a;border-right:1px solid #1e293b;padding:16px}
.main{flex:1;display:flex;flex-direction:column}
.top{height:52px;background:#0f172a;border-bottom:1px solid #1e293b;display:flex;align-items:center;padding:0 16px;justify-content:space-between}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:12px;margin-bottom:8px}
</style></head><body>
<div class="side">
<div style="display:flex;gap:10px;align-items:center"><img src="/logo.png" style="width:40px;border-radius:8px"><div><b id="empNombre">KLIDO</b><br><span id="empPlan" style="font-size:10px;color:#60a5fa"></span></div></div>
<button onclick="show('inbox')" id="bInbox" style="margin-top:16px;width:100%;padding:10px;border-radius:10px;background:#6366f1;color:white;border:none;font-weight:800">📥 Inbox Asignados</button>
<button onclick="show('cal')" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;background:#020617;color:#94a3b8;border:1px solid #1e293b">📅 Calendario</button>
<a href="/campanas.html" style="display:block;margin-top:8px;padding:10px;border-radius:10px;background:#020617;color:#94a3b8;border:1px solid #1e293b;text-decoration:none;text-align:center">📢 Campañas</a>
<a href="https://wa.me/573133181851" target="_blank" style="display:block;margin-top:20px;background:#25D366;color:white;padding:10px;border-radius:999px;text-align:center;font-weight:800;text-decoration:none">Soporte 3133181851</a>
<button onclick="logout()" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;background:#ef4444;color:white;border:none">Salir</button>
</div>

<div class="main">
<div class="top"><div><b id="userNombre">Trabajador</b> - <span id="userEmail" style="color:#94a3b8;font-size:11px"></span></div><div style="font-size:10px;color:#16a34a">● v121 Conectado API Autónoma - <span class="badge-yellow" style="background:#fef08a;color:#854d0e;padding:2px 8px;border-radius:999px">Amarillo = respondió campaña</span></div></div>

<div id="v_inbox" style="flex:1;display:flex">
<div style="width:340px;background:#0f172a;border-right:1px solid #1e293b;display:flex;flex-direction:column">
<input id="search" placeholder="🔍 Buscar cliente asignado" style="margin:12px;padding:10px;border-radius:10px;background:#020617;border:1px solid #1e293b;color:white" onkeyup="filtrar()">
<div id="listaClientes" style="flex:1;overflow:auto;padding:8px"></div>
</div>
<div style="flex:1;display:flex;flex-direction:column;background:#020617">
<div id="chatHead" style="padding:12px;border-bottom:1px solid #1e293b;font-weight:800">Selecciona chat asignado</div>
<div id="chatBox" style="flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px"></div>
<div style="display:flex;gap:8px;padding:12px;border-top:1px solid #1e293b"><input id="msgInput" placeholder="Escribe mensaje..." style="flex:1;padding:12px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;color:white"><button onclick="enviar()" style="padding:12px 18px;border-radius:10px;background:#6366f1;color:white;border:none;font-weight:800">Enviar</button></div>
</div>
</div>

<div id="v_cal" style="display:none;padding:20px;overflow:auto">
<h3>📅 Recordatorios con Alarma - Solo tus asignados</h3>
<div class="card"><input id="citaCli" placeholder="Tel cliente Ej: 573001234567" style="width:100%;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white"><input id="citaFecha" type="datetime-local" style="width:100%;margin-top:8px;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white"><input id="citaNota" placeholder="Nota" style="width:100%;margin-top:8px;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white"><button onclick="crearCita()" style="width:100%;margin-top:8px;padding:10px;background:#16a34a;color:white;border-radius:8px;font-weight:800;border:none">Agregar alarma</button></div>
<div id="listaCitas"></div>
</div>
</div>

<script>
const token=localStorage.getItem('klido_token'); if(!token) location.href='/';
let user={}; try{ user=JSON.parse(atob(token.split('.')[1])); }catch{}
document.getElementById('userNombre').innerText=user.email||'Trabajador'; document.getElementById('userEmail').innerText=user.email||'';

async function api(url,method='GET',body){ const o={method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}}; if(body) o.body=JSON.stringify(body); const r=await fetch(url,o); const j=await r.json(); if(!r.ok) throw new Error(j.error); return j; }

function show(v){ document.getElementById('v_inbox').style.display=v==='inbox'?'flex':'none'; document.getElementById('v_cal').style.display=v==='cal'?'block':'none'; document.getElementById('bInbox').style.background=v==='inbox'?'#6366f1':'#020617'; if(v==='inbox') cargarClientes(); if(v==='cal') cargarCitas(); }
function logout(){ localStorage.clear(); location.href='/'; }

let clientes=[]; let chatActual=null;
async function cargarClientes(){
  const cls=await api('/api/clientes'); clientes=cls;
  // Trabajador solo ve asignados si tiene asesor_id - si es jefe ve todo
  document.getElementById('listaClientes').innerHTML=cls.map(c=>`
    <div onclick="abrir('${c.id}','${c.telefono}','${c.nombre}')" style="padding:10px;border:1px solid #1e293b;border-radius:12px;margin-bottom:6px;cursor:pointer;background:${chatActual===c.id?'#1e293b':'#020617'}">
      <div style="display:flex;justify-content:space-between"><b style="font-size:13px">${c.nombre||c.telefono}</b> ${c.etiqueta==='respuesta_campana'?'<span style="background:#fef08a;color:#854d0e;padding:2px 6px;border-radius:999px;font-size:9px">AMARILLO CAMPAÑA</span>':''}</div>
      <div style="font-size:11px;color:#94a3b8">${c.telefono} - ${c.estado_embudo} ${c.score?'| Score '+c.score:''}</div>
    </div>`).join('')||'<p style="color:#64748b;padding:20px">Sin chats asignados</p>';
}
function filtrar(){ const q=document.getElementById('search').value.toLowerCase(); document.getElementById('listaClientes').innerHTML=clientes.filter(c=>(c.nombre+c.telefono).toLowerCase().includes(q)).map(c=>`<div onclick="abrir('${c.id}','${c.telefono}','${c.nombre}')" style="padding:10px;border:1px solid #1e293b;border-radius:12px;margin-bottom:6px;cursor:pointer"><b>${c.nombre||c.telefono}</b></div>`).join(''); }
async function abrir(id,tel,nom){ chatActual=id; document.getElementById('chatHead').innerText=`${nom||tel} - ${tel} ${clientes.find(c=>c.id===id)?.etiqueta==='respuesta_campana'?'🟡 Respondió campaña':''}`; const msgs=await api('/api/mensajes/'+id); document.getElementById('chatBox').innerHTML=msgs.map(m=>`<div style="max-width:70%;padding:10px;border-radius:12px;background:${m.direccion==='saliente'?'#6366f1':'#1e293b'};align-self:${m.direccion==='saliente'?'flex-end':'flex-start'}">${m.contenido} ${m.url?`<br><img src="${m.url}" style="max-width:200px;border-radius:8px">`:''}<br><small style="font-size:10px;opacity:0.6">${new Date(Number(m.timestamp)).toLocaleString()}</small></div>`).join(''); }
async function enviar(){ const txt=document.getElementById('msgInput').value.trim(); if(!txt||!chatActual) return; // tu server v121 guarda mensajes al recibir webhook, para enviar usas tu API directa
  document.getElementById('msgInput').value=''; document.getElementById('chatBox').innerHTML+=`<div style="max-width:70%;padding:10px;border-radius:12px;background:#6366f1;align-self:flex-end">${txt}</div>`;
}
async function cargarCitas(){ const cls=await api('/api/clientes'); const conRec=cls.filter(c=>c.recordatorio); document.getElementById('listaCitas').innerHTML=conRec.map(c=>`<div class="card"><b>${c.nombre||c.telefono}</b> - ${new Date(c.recordatorio).toLocaleString()}<br><span style="color:#94a3b8;font-size:11px">${c.datos?JSON.stringify(c.datos):''}</span> ${new Date(c.recordatorio)<new Date()?'<span style="background:#ef4444;color:white;padding:2px 6px;border-radius:999px;font-size:10px">🔔 ALARMA VENCIDA</span>':''}</div>`).join('')||'Sin recordatorios'; }
async function crearCita(){ const tel=document.getElementById('citaCli').value.trim(); const fecha=document.getElementById('citaFecha').value; const nota=document.getElementById('citaNota').value.trim(); if(!tel||!fecha) return alert('Falta tel y fecha'); const cli=clientes.find(c=>c.telefono.includes(tel))||{id:'cli_'+tel}; await api('/api/clientes/'+cli.id+'/datos','POST',{recordatorio:fecha, datos:{nota}}); alert('✅ Alarma guardada'); cargarCitas(); }

show('inbox'); cargarClientes();
</script></body></html>
