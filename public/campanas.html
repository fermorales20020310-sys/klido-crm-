<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campañas - KLIDO</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0f1e;color:white;display:flex;height:100vh}
.sidebar{width:260px;background:#101a30;border-right:1px solid #1d2b4a;padding:20px}
.nav a{padding:11px 12px;border-radius:10px;color:#8da0c3;text-decoration:none;display:block;margin-bottom:6px}
.nav a.active{background:#182848;color:white}
.main{flex:1;padding:30px;overflow-y:auto}
.card{background:#101a30;border:1px solid #1d2b4a;border-radius:16px;padding:24px;margin-bottom:20px}
input,textarea{width:100%;background:#162447;border:1px solid #1d2b4a;color:white;padding:12px;border-radius:10px;margin-top:8px;outline:none}
button{background:#facc15;color:#000;border:none;padding:12px 22px;border-radius:10px;font-weight:800;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5}
.progress{height:8px;background:#162447;border-radius:10px;overflow:hidden;margin-top:12px}
.bar{height:100%;background:#facc15;width:0%;transition:.3s}
table{width:100%;margin-top:12px;border-collapse:collapse;font-size:12px}
td,th{padding:8px;border-bottom:1px solid #1d2b4a;text-align:left}
.tag{background:#facc15;color:#000;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800}
</style>
</head>
<body>
<div class="sidebar"><div style="font-weight:800;margin-bottom:20px">🚀 KLIDO AVANZA</div><div class="nav"><a href="index.html">💬 Inbox</a><a class="active">📢 Campaigns</a></div></div>
<div class="main">
<h1 style="margin-bottom:6px">Campañas PRO <span class="tag">AMARILLO TRACKING</span></h1>
<p style="color:#6b7da0;margin-bottom:20px">Sube Excel y los contactos quedarán con distintivo amarillo en el Inbox</p>

<div class="card">
<label>Nombre de la campaña (aparecerá en amarillo)</label>
<input id="campName" placeholder="Ej: Promo Septiembre - Sedes Bogotá">
<label style="margin-top:14px;display:block">Mensaje</label>
<textarea id="msg" rows="4" placeholder="Hola {nombre}, te saluda KLIDO..."></textarea>
<label style="margin-top:14px;display:block">Excel (.xlsx) con columna phone / telefono / celular</label>
<input type="file" id="file" accept=".xlsx,.xls">
<div id="preview"></div>
<button id="btnSend" onclick="sendCamp()" disabled>🚀 Enviar campaña y marcar en amarillo</button>
<div class="progress" id="prog" style="display:none"><div class="bar" id="bar"></div></div>
<div id="log" style="margin-top:12px;color:#6b7da0;font-size:12px"></div>
</div>

<div class="card"><h3>Historial de campañas</h3><div id="hist"></div></div>
</div>

<script>
let phones=[];
document.getElementById('file').addEventListener('change',async(e)=>{
  let f=e.target.files[0]; if(!f) return;
  let data=await f.arrayBuffer(); let wb=XLSX.read(data); let ws=wb.Sheets[wb.SheetNames[0]];
  let json=XLSX.utils.sheet_to_json(ws);
  phones=json.map(r=>String(r.phone||r.Phone||r.telefono||r.Telefono||r.celular||r.Celular||'')).filter(Boolean);
  document.getElementById('preview').innerHTML=`<table><tr><th>Detectados</th><th>${phones.length} contactos</th></tr>${phones.slice(0,5).map(p=>`<tr><td>${p}</td><td><span class="tag">📢 SE MARCARÁ AMARILLO</span></td></tr>`).join('')}${phones.length>5?`<tr><td>...y ${phones.length-5} más</td></tr>`:''}</table>`;
  document.getElementById('btnSend').disabled=false;
});

async function sendCamp(){
  let campName=document.getElementById('campName').value||'Campaña '+new Date().toLocaleDateString();
  let message=document.getElementById('msg').value.trim();
  if(!message||!phones.length) return alert('Falta mensaje o excel');
  document.getElementById('prog').style.display='block'; document.getElementById('btnSend').disabled=true;
  document.getElementById('bar').style.width='30%'; document.getElementById('log').innerText='Enviando y marcando amarillo...';
  let r=await fetch('/api/campaign/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phones,message,campaignName:campName})});
  let d=await r.json();
  document.getElementById('bar').style.width='100%';
  document.getElementById('log').innerHTML=`✅ <b>${phones.length} contactos marcados con <span class="tag">📢 ${campName}</span></b> - Ya aparecen amarillos en Inbox <a href="index.html" style="color:#facc15">Ver Inbox</a>`;
  loadHist();
}

async function loadHist(){ let r=await fetch('/api/campaigns'); let h=await r.json(); document.getElementById('hist').innerHTML=`<table><tr><th>Nombre</th><th>Total</th><th>Fecha</th></tr>${h.map(c=>`<tr><td><span class="tag">📢</span> ${c.name}</td><td>${c.total}</td><td>${new Date(c.created_at).toLocaleString()}</td></tr>`).join('')}</table>`; }
loadHist();
</script>
</body>
</html>
