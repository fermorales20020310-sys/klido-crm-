<div class="card">
<h3>📄 Tus Plantillas Aprobadas (API Oficial - No Spam)</h3>
<button class="btn" onclick="loadTemplates()">Cargar Plantillas</button>
<div id="templatesList" style="margin-top:12px"></div>
</div>
<script>
async function loadTemplates(){
 let r=await fetch('/api/templates'); let t=await r.json();
 if(t.error) return alert(t.error);
 let h=t.map(x=>`<div style="border:1px solid #1e2a45;padding:10px;border-radius:10px;margin-bottom:8px"><b>${x.name}</b> - ${x.status} - ${x.language}<br><small>${x.components?.[0]?.text||''}</small><br><button class="btn" onclick="useTemplate('${x.name}')">Usar</button></div>`).join('');
 document.getElementById('templatesList').innerHTML=h||'No tienes plantillas aprobadas aún. Créalas en Business Manager > Plantillas';
}
function useTemplate(name){ document.getElementById('msgTemplate').value=`Plantilla: ${name}`; alert('Plantilla seleccionada: '+name+' - Se enviará por API oficial'); }
</script>
