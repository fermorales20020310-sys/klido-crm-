<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campañas - Klido CRM</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{background:#f6f7fb;margin:0;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:20px}
.btn{padding:12px 18px;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.btn-yellow{background:#FFD600;color:#111}.btn-black{background:#111;color:#fff;width:100%;margin-top:10px}
.btn-red{background:#ff3b30;color:#fff}.btn-green{background:#00c851;color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
.badge{background:#111;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}
.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:#111;width:0%;transition:.3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
<img src="logo.png" style="height:42px"><h2>Campañas</h2>
<span style="background:red;width:10px;height:10px;border-radius:50%;display:inline-block"></span> Online
<a href="https://wa.me/573133181851" target="_blank" style="margin-left:auto;background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none">Planes 💬</a>
</div>

<div class="grid">
<div class="card">
<h3>1. Empresa</h3>
<select id="empresa_id"><option value="default">default</option></select>
<input id="imagen_url" placeholder="URL imagen para plantilla con foto (https://...)">
<div style="font-size:12px;color:#666">Si tu plantilla necesita imagen, pega aquí la URL. Usa imagen pública.jpg</div>

<h3 style="margin-top:20px">2. Excel inteligente</h3>
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
<div id="excelInfo" class="badge">0 números detectados</div>

<h3 style="margin-top:20px">3. Números escritos (opcional)</h3>
<textarea id="manual_numeros" rows="4" placeholder="Escribe números: 573133181851, 573001112233 o uno por línea"></textarea>
<div id="manualInfo" class="badge">0 manuales</div>
</div>

<div class="card">
<h3>4. Plantillas APROBADAS</h3>
<button class="btn btn-yellow" onclick="cargarPlantillas()">Cargar plantillas aprobadas</button>
<select id="plantilla"><option>Carga plantillas...</option></select>
<div id="tplInfo" style="font-size:13px;margin-top:8px;color:#555"></div>

<h3 style="margin-top:20px">5. Variables del body {{1}} {{2}}</h3>
<input id="var1" placeholder="Variable {{1}} - Ej: Fer">
<input id="var2" placeholder="Variable {{2}} - Ej: KLIDO">
<input id="var3" placeholder="Variable {{3}} - opcional">

<button id="btnEnviar" class="btn btn-black" onclick="enviarCampana()">🚀 ENVIAR CAMPAÑA A TODOS SI O SI</button>

<div id="progresoBox" style="display:none;margin-top:15px">
<div class="progress"><div id="bar"></div></div>
<div id="estado">Enviando...</div>
<button class="btn btn-red" onclick="pausar()">Pausar</button>
<button class="btn btn-green" onclick="continuar()">Continuar</button>
</div>
</div>
</div>

<div class="card">
<h3>Historial de campañas</h3>
<div id="historial"></div>
</div>

<script>
let numerosExcel=[], campId=null, interval=null;
const empresa = () => document.getElementById('empresa_id').value;

document.getElementById('excelFile').addEventListener('change', async (e)=>{
  const fd=new FormData(); fd.append('file', e.target.files[0]);
  const r=await fetch('/api/upload-excel',{method:'POST',body:fd}); const j=await r.json();
  if(j.ok){ numerosExcel=j.numeros; document.getElementById('excelInfo').innerText=j.total+' números detectados - Listo para enviar'; }
  else alert('Error excel: '+j.error);
});

document.getElementById('manual_numeros').addEventListener('input', (e)=>{
  const nums=e.target.value.split(/[,;\n\s]+/).filter(n=>n.replace(/\D/g,'').length>=10);
  document.getElementById('manualInfo').innerText=nums.length+' manuales';
});

async function cargarPlantillas(){
  const id=empresa();
  const r=await fetch(`/api/plantillas/${id}`); const data=await r.json();
  const sel=document.getElementById('plantilla'); sel.innerHTML='';
  if(data.length===0){ sel.innerHTML='<option>No hay aprobadas</option>'; return; }
  data.forEach(t=>{
    const hasImg=t.components?.some(c=>c.type==='HEADER'&&c.format==='IMAGE');
    const body=t.components?.find(c=>c.type==='BODY')?.text||'';
    const vars=(body.match(/{{\d+}}/g)||[]).length;
    const o=document.createElement('option');
    o.value=t.name; o.textContent=`${t.name} - ${t.language} ${hasImg?'📷':''} ${vars>0?`{{${vars}}}`:''}`;
    o.dataset.vars=vars; o.dataset.img=hasImg;
    sel.appendChild(o);
  });
  sel.onchange=()=>{
    const opt=sel.options[sel.selectedIndex];
    document.getElementById('tplInfo').innerText=`Variables: ${opt.dataset.vars} | Necesita imagen: ${opt.dataset.img==='true'?'SI':'NO'}`;
  };
  sel.dispatchEvent(new Event('change'));
  alert(`✅ ${data.length} plantillas aprobadas cargadas`);
}

async function enviarCampana(){
  const plantilla=document.getElementById('plantilla').value;
  if(!plantilla) return alert('Selecciona plantilla aprobada');
  const imagen_url=document.getElementById('imagen_url').value.trim();
  const sel=document.getElementById('plantilla').options[document.getElementById('plantilla').selectedIndex];
  if(sel.dataset.img==='true' &&!imagen_url) return alert('Esta plantilla necesita URL de imagen. Pega la URL arriba');

  const variables=[document.getElementById('var1').value,document.getElementById('var2').value,document.getElementById('var3').value].filter(Boolean);
  const manual_numeros=document.getElementById('manual_numeros').value;

  if(numerosExcel.length===0 &&!manual_numeros.trim()) return alert('Sube Excel o escribe números');

  document.getElementById('btnEnviar').disabled=true;
  document.getElementById('progresoBox').style.display='block';

  const r=await fetch('/api/campana/enviar',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({empresa_id:empresa(),plantilla,imagen_url,numeros:numerosExcel,variables,manual_numeros})
  });
  const j=await r.json();
  if(!j.ok){ alert('Error: '+j.error); document.getElementById('btnEnviar').disabled=false; return; }
  campId=j.campId;
  document.getElementById('estado').innerText=`Campaña iniciada ${j.total} números`;

  interval=setInterval(async()=>{
    const s=await fetch(`/api/campana/${empresa()}/${campId}`).then(r=>r.json());
    if(!s.id) return;
    const pct=s.total?Math.round((s.enviados/s.total)*100):0;
    document.getElementById('bar').style.width=pct+'%';
    document.getElementById('estado').innerText=`${s.estado} - ${s.enviados}/${s.total} enviados - Fallidos: ${s.fallidos} - ${pct}%`;
    if(s.estado==='finalizada'){ clearInterval(interval); document.getElementById('btnEnviar').disabled=false; alert('✅ Campaña finalizada'); cargarHistorial(); }
  },1500);
}

async function pausar(){ if(!campId) return; await fetch(`/api/campana/${empresa()}/${campId}/pausar`,{method:'POST'}); }
async function continuar(){ if(!campId) return; await fetch(`/api/campana/${empresa()}/${campId}/continuar`,{method:'POST'}); }

async function cargarHistorial(){
  const r=await fetch(`/api/campanas/${empresa()}`); const data=await r.json();
  document.getElementById('historial').innerHTML=data.map(c=>`
    <div style="border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between">
      <div><b>${c.plantilla}</b> - ${c.enviados||0}/${c.total} <span class="badge">${c.estado}</span></div>
      <div style="font-size:12px">${new Date(c.created).toLocaleString()}</div>
    </div>`).join('') || 'Sin campañas';
}
cargarHistorial();
</script>
</body>
</html>
