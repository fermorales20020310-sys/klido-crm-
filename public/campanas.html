<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KLIDO | Campanas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');*{font-family:'Inter',sans-serif}body{background:#070b18}</style>
</head>
<body class="h-screen bg-[#070b18] p-2">
<div class="h-full w-full bg-[#0f172a] rounded-[16px] border border-[#1e293b] flex overflow-hidden">
<div class="w-[220px] bg-[#0f172a] border-r border-[#1e293b] flex flex-col"><div class="p-4 flex items-center gap-2"><img src="/logo.png" class="h-8 w-8 rounded-lg bg-white p-1"><div class="font-black text-white">KLIDO</div></div>
<div class="mt-5 px-2 flex-1"><button onclick="location.href='/index.html'" class="w-full flex gap-3 px-3 py-2.5 rounded-xl text-[13px] text-[#94a3b8]"><i class="fa-solid fa-inbox w-4"></i>Inbox - Bandeja</button><button class="w-full flex gap-3 px-3 py-2.5 rounded-xl text-[13px] bg-[#2a5bd7] text-white mt-1"><i class="fa-solid fa-bullhorn w-4"></i>Campaigns</button></div>
<div class="p-3 border-t border-[#1e293b]"><button onclick="window.open('https://wa.me/573133181851','_blank')" class="w-full bg-[#111c34] border border-[#1e2f4f] text-[#94a3b8] py-2 rounded-xl text-[11px]">Help Center → 3133181851</button></div></div>
<div class="flex-1 bg-[#0f172a] overflow-y-auto p-7">
<h1 class="text-white font-bold text-[18px]">Campaigns - Envío masivo antibaneo 50/5h</h1>
<p class="text-[#64748b] text-[12px]">Excel auto detecta teléfono, agrega 57, quita duplicados. Sync plantillas API. Marca 🟡 en Bandeja de mensajes</p>
<div class="grid grid-cols-2 gap-6 mt-6"><div class="bg-[#111c34] border border-[#1e293b] rounded-[14px] p-5">
<h3 class="text-white font-bold text-[13px]">1. Plantilla aprobada</h3>
<div class="flex gap-2 mt-4"><select id="templateSelect" class="flex-1 bg-[#0e1830] border border-[#1e2f4f] rounded-xl px-3 py-3 text-[12px] text-white"><option>Cargando...</option></select><button onclick="syncTemplates()" class="bg-[#1e3a5f] text-white px-4 rounded-xl text-[11px]">🔄 Sync</button></div>
<h3 class="text-white font-bold text-[13px] mt-6">2. Excel</h3><input type="file" id="excelFile" accept=".xlsx,.xls" class="w-full mt-3 text-[11px] text-[#94a3b8] file:bg-[#2a5bd7] file:text-white file:border-0 file:rounded-lg file:px-4 file:py-2"><div id="excelInfo" class="mt-3 text-[11px] text-[#22c55e]"></div><div id="preview" class="mt-3 max-h-[200px] overflow-y-auto bg-[#0e1830] rounded-xl border border-[#1e2f4f] p-2 text-[11px] text-[#94a3b8]"></div>
<button onclick="startCampaign()" id="btnStart" class="mt-6 w-full bg-[#2a5bd7] text-white py-3 rounded-xl text-[12px] font-bold disabled:opacity-40" disabled>🚀 Iniciar 50/5h</button><p id="campMsg" class="text-[11px] mt-2 text-[#8aa4ff]"></p></div>
<div class="bg-[#111c34] border border-[#1e293b] rounded-[14px] p-5"><h3 class="text-white font-bold text-[13px]">Progreso</h3><div class="flex justify-between text-[11px] text-[#94a3b8] mt-4"><span>Enviados</span><span id="progText">0/0</span></div><div class="w-full bg-[#0e1830] h-2 rounded-full mt-2"><div id="progBar" class="bg-[#2a5bd7] h-2 rounded-full" style="width:0%"></div></div><div id="log" class="mt-4 bg-[#0e1830] rounded-xl border border-[#1e2f4f] p-3 h-[200px] overflow-y-auto text-[11px] text-[#94a3b8]"></div><div id="history" class="mt-4 space-y-2"></div></div></div></div></div>
<script>
let agency_id=localStorage.getItem('agency_id')||'',contacts=[];
async function syncTemplates(){let sel=document.getElementById('templateSelect');sel.innerHTML='<option>Sincronizando...</option>';try{let r=await fetch('/api/templates/sync?agency_id='+agency_id,{method:'POST'});let j=await r.json();loadTemplates();}catch(e){sel.innerHTML='<option>Error sync</option>';}}
async function loadTemplates(){let r=await fetch('/api/templates?agency_id='+agency_id);let j=await r.json();let sel=document.getElementById('templateSelect');sel.innerHTML=j.length?j.map(t=>`<option value="${t.name}">${t.name}</option>`).join(''):'<option>Sin plantillas - crea en Meta y Sync</option>';}
document.getElementById('excelFile').addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){let data=new Uint8Array(ev.target.result);let wb=XLSX.read(data,{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];let json=XLSX.utils.sheet_to_json(ws,{header:1});let headers=json[0].map(h=>String(h).toLowerCase());let phoneIdx=headers.findIndex(h=>h.includes('tel')||h.includes('cel')||h.includes('phone')||h.includes('numero'));if(phoneIdx==-1)phoneIdx=0;contacts=[];json.slice(1).forEach(row=>{let raw=String(row[phoneIdx]||'').replace(/\D/g,'');if(raw.length>=7){if(raw.length<=10)raw='57'+raw;contacts.push({wa_id:raw,name:String(row[0]||'')});}});contacts=[...new Map(contacts.map(c=>[c.wa_id,c])).values()];document.getElementById('excelInfo').textContent=`✅ ${contacts.length} contactos válidos`;document.getElementById('preview').innerHTML=contacts.slice(0,20).map(c=>`<div>${c.wa_id}</div>`).join('');document.getElementById('btnStart').disabled=false;};reader.readAsArrayBuffer(file);});
async function startCampaign(){let tpl=document.getElementById('templateSelect').value;let r=await fetch('/api/campaigns/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agency_id,template:tpl,contacts})});let j=await r.json();document.getElementById('campMsg').textContent=j.ok?'✅ Campaña iniciada 50/5h':'Error';pollProgress(j.campaign_id);}
async function pollProgress(id){let iv=setInterval(async()=>{let r=await fetch('/api/campaigns/'+id+'?agency_id='+agency_id);let j=await r.json();document.getElementById('progText').textContent=j.sent+'/'+j.total;document.getElementById('progBar').style.width=Math.round(j.sent/j.total*100)+'%';if(j.status=='finished')clearInterval(iv);},3000);}
loadTemplates();
</script>
</body>
</html>
