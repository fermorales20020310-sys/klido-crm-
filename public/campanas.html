<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campañas V162 FIX</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{background:#f6f7fb;font-family:Inter,Arial;margin:0;padding:20px}.card{background:#fff;border-radius:20px;padding:20px;max-width:900px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.08)}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.btn{padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;width:100%}.btn-blue{background:#0b57d0;color:#fff}.config{background:#fff3cd;border:1px solid #ffc107;padding:14px;border-radius:12px;margin-bottom:14px}</style>
</head><body><div class="card">
<div id="configBox" class="config">
<h3 style="margin:0">⚙️ CONFIGURAR EMPRESA (1 vez)</h3>
<div style="font-size:12px">Si te dice "Empresa no configurada" es aquí.</div>
<input id="cfg_token" placeholder="Token de Meta (EAAG...)">
<input id="cfg_phone" placeholder="Phone ID (ej: 123456789)">
<input id="cfg_waba" placeholder="WABA ID (ej: 987654321)">
<button class="btn" style="background:#111;color:#fff" onclick="guardarConfig()">Guardar Config y Continuar</button>
<div id="cfgStatus" style="font-size:12px;margin-top:6px"></div>
</div>

<h3>🎯 Campañas V162</h3>
<input id="nombre" placeholder="Nombre campaña">
<select id="plantillaSelect"><option>Cargando plantillas...</option></select>
<input id="plantillaManual" placeholder="Plantilla manual: acol_invitacion_congreso" value="acol_invitacion_congreso">
<input id="vars" placeholder="Variables {{1}},{{2}}" value="fer">
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
<div id="excelInfo" style="background:#e8f5e9;padding:8px;border-radius:8px;font-size:13px">Sube Excel</div>
<div id="preview" style="font-size:11px;max-height:80px;overflow:auto;background:#f9f9f9;padding:6px;border-radius:8px;margin:8px 0"></div>
<button class="btn btn-blue" onclick="enviar()">🚀 Enviar campaña ahora</button>
<div id="historial" style="margin-top:14px"></div>
</div>

<script>
let nums=[];
const empresa_id=localStorage.getItem('empresa_id')||'default';

async function cargarConfig(){
  const r=await fetch(`/api/empresa/${empresa_id}`); const j=await r.json();
  if(j && j.token){ 
    document.getElementById('configBox').style.display='none';
    document.getElementById('cfgStatus').innerText='✅ Configurada';
  } else {
    document.getElementById('configBox').style.display='block';
    document.getElementById('cfgStatus').innerText='❌ Falta configurar - pega token';
  }
  return j;
}
async function guardarConfig(){
  const token=document.getElementById('cfg_token').value.trim();
  const phone_id=document.getElementById('cfg_phone').value.trim();
  const waba_id=document.getElementById('cfg_waba').value.trim();
  if(!token||!phone_id) return alert('Pega token y phone_id');
  const r=await fetch('/api/config-empresa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id, token, phone_id, waba_id, nombre:empresa_id})});
  const j=await r.json();
  if(j.ok){ alert('✅ Config guardada'); document.getElementById('configBox').style.display='none'; cargarPlantillas(); }
}

function extraerNumeros(text){
  const m=text.match(/(\+?57)?\s?3\d{9}/g)||[];
  return [...new Set(m.map(n=>{let s=n.replace(/\D/g,''); if(s.length==10) s='57'+s; return s;}).filter(n=>n.length>=12))];
}
document.getElementById('excelFile').addEventListener('change', async e=>{
  const data=await e.target.files[0].arrayBuffer(); const wb=XLSX.read(data);
  let txt=''; wb.SheetNames.forEach(n=>txt+=JSON.stringify(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1}))+' ');
  nums=extraerNumeros(txt);
  document.getElementById('excelInfo').innerText=`✅ ${nums.length} números - Listo`;
  document.getElementById('preview').innerText=nums.slice(0,30).join(', ');
});

async function cargarPlantillas(){
  try{ const r=await fetch(`/api/plantillas/${empresa_id}`); const j=await r.json();
    document.getElementById('plantillaSelect').innerHTML=j.length?j.map(t=>`<option value="${t.name}">${t.name}</option>`).join(''):'<option value="">Escribe manual abajo</option>';
  }catch{ document.getElementById('plantillaSelect').innerHTML='<option>Error - escribe manual</option>'; }
}
async function enviar(){
  const cfg=await cargarConfig();
  if(!cfg.token) return alert('Primero configura empresa arriba');
  const plantilla=document.getElementById('plantillaManual').value||document.getElementById('plantillaSelect').value;
  if(nums.length==0) return alert('Sube Excel primero');
  const variables=document.getElementById('vars').value.split(',').map(s=>s.trim()).filter(Boolean);
  const r=await fetch('/api/campana/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id, plantilla, nombre:document.getElementById('nombre').value, numeros:nums, variables})});
  const j=await r.json();
  if(j.ok) alert(`✅ Enviando ${j.total}`); else alert('Error: '+j.error);
}
cargarConfig(); cargarPlantillas();
fetch(`/api/campanas/${empresa_id}`).then(r=>r.json()).then(j=>{document.getElementById('historial').innerHTML=j.map(c=>`<div>${c.plantilla} - ${c.enviados}/${c.total} - ${c.estado}</div>`).join('')});
</script>
</body></html>
