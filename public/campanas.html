<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIDO v119 AUTO</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{background:#0b1220;color:#fff;font-family:Arial;padding:15px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0;border:1px solid #334155}select,input,button,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}button{background:#38bdf8;color:#000;font-weight:900;cursor:pointer}</style></head><body>
<h2>KLIDO v119 - AUTO (sin tocar código nunca)</h2>
<div class="card"><h3>1. Carga Excel con Nombre y Teléfono</h3><input type="file" id="f"><button onclick="leer()">Leer Excel</button><div id="info"></div></div>
<div class="card"><h3>2. Plantillas APROBADAS (automático de META)</h3><button onclick="cargar()">🔄 Cargar plantillas aprobadas</button><select id="sel"></select><div id="det"></div><input id="imgUrl" placeholder="Si la plantilla tiene imagen de cabecera, pega aquí el link de la imagen (opcional, deja vacío para usar la del template)"><input id="vars" placeholder="Vars extra opcional: deja vacío = toma Nombre del Excel automático"></div>
<div class="card"><h3>3. Enviar</h3><input id="nombreC" value="Congreso ACOL"><button onclick="enviar()">📢 ENVIAR A LOS NUMEROS SELECCIONADOS</button><div id="est"></div></div>
<div class="card"><h3>Historial</h3><div id="hist"></div></div>
<script>
const token=localStorage.getItem('klido_token'); let nums=[], contacts=[], plantillas=[];
async function api(p,m='GET',b){ const o={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}}; if(b) o.body=JSON.stringify(b); const r=await fetch(p,o); return r.json(); }
async function cargar(){ const r=await api('/api/meta/plantillas'); if(!r.ok){ document.getElementById('det').innerHTML='Error: '+r.error; return; } plantillas=r.plantillas; const sel=document.getElementById('sel'); sel.innerHTML=''; r.plantillas.forEach(pl=>{ const comp=pl.components.find(c=>c.type==='HEADER'); const hasImg=comp?` - HEADER ${comp.format}`:''; const body=pl.components.find(c=>c.type==='BODY'); const vars=(body?.example?.body_text?.[0]?.length||0); sel.innerHTML+=`<option value="${pl.name}" data-lang="${pl.language}" data-hasimg="${hasImg}">${pl.name} | ${pl.language} | ${vars} vars${hasImg} | ${pl.status}</option>`; }); sel.onchange=()=>{ const o=sel.options[sel.selectedIndex]; document.getElementById('det').innerHTML=`Seleccionada: <b>${o.value}</b> idioma ${o.dataset.lang} ${o.dataset.hasimg}`; document.getElementById('nombreC').value=o.value; }; if(sel.options.length>0) sel.onchange(); document.getElementById('det').innerHTML+=`<br><b style="color:#22c55e">${r.plantillas.length} plantillas aprobadas cargadas automático - no tocas código</b>`; }
function leer(){ const file=document.getElementById('f').files[0]; if(!file) return alert('Excel'); const rd=new FileReader(); rd.onload=e=>{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}); const h=rows[0].map(x=>String(x).toLowerCase()); let it=h.findIndex(x=>x.includes('tel')||x.includes('phone')); let inx=h.findIndex(x=>x.includes('nom')); nums=[]; contacts=[]; const seen=new Set(); for(let i=1;i<rows.length;i++){ let tel=String(rows[i][it]||'').replace(/\D/g,''); if(tel.length===10) tel='57'+tel; if(tel.length!==12) continue; if(seen.has(tel)) continue; seen.add(tel); let nom=inx!==-1?String(rows[i][inx]||'Cliente'):'Cliente'; nums.push(tel); contacts.push({nombre:nom,phone:tel}); } document.getElementById('info').innerHTML=`<b style="color:#22c55e">${nums.length} números detectados listos</b>`; }; rd.readAsArrayBuffer(file); }
async function enviar(){ if(nums.length===0) return alert('Carga Excel'); const sel=document.getElementById('sel'); if(!sel.value) return alert('Selecciona plantilla'); const plantilla=sel.value; const idioma=sel.options[sel.selectedIndex].dataset.lang||'es_CO'; const headerImageUrl=document.getElementById('imgUrl').value.trim(); const vars=document.getElementById('vars').value.trim(); document.getElementById('est').innerHTML='Enviando...'; const r=await api('/api/campanas','POST',{nombre:document.getElementById('nombreC').value, plantilla, plantillaIdioma:idioma, lista:nums, contactos:contacts, plantillaVars:vars, headerImageUrl}); document.getElementById('est').innerHTML=r.ok?`✅ Campaña ${plantilla} lanzada - ${nums.length} números - Mira Railway: debe salir -> 200`:`❌ ${r.error}`; cargarHist(); }
async function cargarHist(){ const h=await api('/api/campanas'); document.getElementById('hist').innerHTML=h.slice().reverse().map(c=>`<div>${c.nombre} - ${c.plantilla} - ${c.enviados||0}/${c.numeros} - ${c.estado}</div>`).join(''); }
cargar(); cargarHist();
</script></body></html>
