<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KLIDO CRM</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#f5f7fb;padding:20px}.nav{display:flex;gap:10px;max-width:1100px;margin:0 auto 16px auto}.nav a{padding:10px 16px;background:#fff;border-radius:8px;text-decoration:none;color:#333;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.05)}.nav a.active{background:#6c5ce7;color:#fff}.card{background:#fff;border-radius:16px;padding:20px;margin:0 auto 16px auto;max-width:1100px;box-shadow:0 4px 20px rgba(0,0,0,.05)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:16px;border-radius:12px;color:#fff;font-weight:bold}.kpi b{font-size:28px;display:block}.total{background:#6c5ce7}.ok{background:#00b894}.send{background:#0984e3}.fail{background:#d63031}#drop{border:2.5px dashed #6c5ce7;padding:30px;text-align:center;border-radius:12px;background:#f8f7ff;cursor:pointer}.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0%;background:#6c5ce7;transition:.3s}table{width:100%;font-size:12px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee}textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:10px 0}.btn{padding:12px 18px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;margin-right:8px}.btn-p{background:#6c5ce7;color:#fff;width:100%;font-size:16px;margin-top:10px}.btn-y{background:#fdcb6e}.btn-r{background:#d63031;color:#fff}</style></head><body>
<div class="nav"><a href="/campanas.html" class="active">📤 Campañas</a><a href="/bandeja.html">📥 Bandeja (<span id="notif">0</span>)</a></div>
<div class="card"><h2>🚀 KLIDO CRM - CAMPAÑA REAL</h2><small>Conectado a Cloud API + Bandeja Activa</small></div>
<div class="card"><div id="drop"><b>📤 Arrastra tu Excel aquí</b><input type="file" id="file" hidden></div><div id="info" style="margin-top:10px"></div></div>
<div class="card" id="msgCard" style="display:none"><h3>Mensaje REAL</h3><textarea id="msgText" rows="4">Hola {{nombre}} 👋 Soy del equipo KLIDO. ¿Te interesa que te cuente más?</textarea></div>
<div class="card" id="stats" style="display:none"><div class="grid4"><div class="kpi total"><b id="kT">0</b>TOTAL</div><div class="kpi ok"><b id="kV">0</b>VALIDOS</div><div class="kpi send"><b id="kS">0</b>ENVIADOS REAL</div><div class="kpi fail"><b id="kP">0</b>PENDIENTES</div></div><div class="progress"><div class="bar" id="bar"></div></div><button class="btn btn-p" id="start">▶️ INICIAR ENVÍO REAL</button><button class="btn btn-y" id="pause" style="display:none">⏸️ PAUSAR</button><button class="btn btn-r" id="resume" style="display:none">▶️ REANUDAR</button><div id="log" style="margin-top:10px;font-size:12px;max-height:200px;overflow:auto;background:#f8f8f8;padding:10px;border-radius:8px"></div></div>
<div class="card" id="tableC" style="display:none"><div style="max-height:400px;overflow:auto"><table><thead><tr><th>#</th><th>Nombre</th><th>Tel</th><th>Estado</th><th>ID</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script>
let contacts=[], sending=false, paused=false, idx=0;
const drop=document.getElementById('drop'), fileI=document.getElementById('file');
drop.onclick=()=>fileI.click(); drop.ondragover=e=>e.preventDefault(); drop.ondrop=e=>{e.preventDefault(); handle(e.dataTransfer.files[0])}; fileI.onchange=e=>handle(e.target.files[0]);
function handle(f){ const r=new FileReader(); r.onload=e=>{ const wb=XLSX.read(e.target.result,{type:'array'}); const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}); contacts=data.map((row,i)=>{ const k=Object.keys(row); const nom=row[k.find(x=>x.toLowerCase().includes('nom'))||k[0]]||''; let tel=String(row[k.find(x=>x.toLowerCase().includes('tel')||x.toLowerCase().includes('cel')||x.toLowerCase().includes('what'))||k[1]]||'').replace(/\D/g,''); if(tel.length>=7 &&!tel.startsWith('57')) tel='57'+tel; const col=row[k.find(x=>x.toLowerCase().includes('cole'))||k[2]]||''; return {id:i+1,nombre:nom,tel,colegio:col,estado:'pendiente'}; }).filter(c=>c.tel.length>=10); document.getElementById('info').innerHTML='✅ '+f.name+' - '+contacts.length+' validos'; document.getElementById('msgCard').style.display='block'; document.getElementById('stats').style.display='block'; document.getElementById('tableC').style.display='block'; document.getElementById('kT').innerText=contacts.length; document.getElementById('kV').innerText=contacts.length; document.getElementById('kP').innerText=contacts.length; document.getElementById('tbody').innerHTML=contacts.map(c=>`<tr><td>${c.id}</td><td>${c.nombre}</td><td>${c.tel}</td><td id="s${c.id}">${c.estado}</td><td id="w${c.id}"></td></tr>`).join(''); }; r.readAsArrayBuffer(f); }
async function run(){
  const baseMsg=document.getElementById('msgText').value;
  for(;idx<contacts.length;idx++){
    while(paused){ await new Promise(r=>setTimeout(r,500)); }
    if(!sending) break;
    const c=contacts[idx]; const finalMsg=baseMsg.replace('{{nombre}}',c.nombre).replace('{{colegio}}',c.colegio);
    document.getElementById('s'+c.id).innerText='enviando...';
    try{ const res=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:c.tel,message:finalMsg})}); const j=await res.json(); if(j.ok){document.getElementById('s'+c.id).innerText='✅ ENVIADO REAL'; document.getElementById('w'+c.id).innerText=j.id;} else{document.getElementById('s'+c.id).innerText='❌ '+(j.error?.error?.message||'Error');}}catch(e){document.getElementById('s'+c.id).innerText='❌ Error red';}
    document.getElementById('kS').innerText=idx+1; document.getElementById('kP').innerText=contacts.length-(idx+1); document.getElementById('bar').style.width=((idx+1)/contacts.length*100)+'%';
    await new Promise(r=>setTimeout(r,2000));
  }
  sending=false; document.getElementById('start').style.display='block'; document.getElementById('pause').style.display='none';
}
document.getElementById('start').onclick=()=>{ if(sending) return; sending=true; paused=false; document.getElementById('start').style.display='none'; document.getElementById('pause').style.display='inline-block'; run(); };
document.getElementById('pause').onclick=()=>{ paused=true; document.getElementById('pause').style.display='none'; document.getElementById('resume').style.display='inline-block'; };
document.getElementById('resume').onclick=()=>{ paused=false; document.getElementById('resume').style.display='none'; document.getElementById('pause').style.display='inline-block'; };
setInterval(async()=>{ try{ const r=await fetch('/api/chats'); const d=await r.json(); document.getElementById('notif').innerText=d.reduce((a,b)=>a+(b.unread||0),0);}catch(e){} },3000);
</script></body></html>
