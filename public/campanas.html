<!DOCTYPE html><html><head><meta charset="UTF-8"><title>KLIDO</title>
<style>body{font-family:Arial;background:#f5f7fb;padding:20px}.card{max-width:650px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}#drop{border:2px dashed #6c5ce7;padding:40px;text-align:center;border-radius:12px;cursor:pointer}#progress{display:none;margin-top:20px}.bar{height:20px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%;width:0%;background:#6c5ce7;transition:.3s}button{background:#6c5ce7;color:#fff;border:0;padding:14px;border-radius:10px;width:100%;font-weight:bold;margin-top:15px}</style></head><body><div class="card"><h1>📢 Campañas KLIDO</h1><div id="drop">Arrastra tu Excel aquí o click<input type=file id=file hidden accept=.xlsx></div><div id=info></div><button id=sendBtn style=display:none>🚀 Enviar campaña</button><div id=progress><p><b id=status>Enviando...</b> <span id=count></span></p><div class=bar><div class=fill id=fill></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
let contacts=[]; const drop=document.getElementById('drop'), fileIn=document.getElementById('file'), info=document.getElementById('info'), sendBtn=document.getElementById('sendBtn');
drop.onclick=()=>fileIn.click(); drop.ondragover=e=>{e.preventDefault(); drop.style.background='#e0d8ff'}; drop.ondrop=e=>{e.preventDefault(); handle(e.dataTransfer.files[0])}; fileIn.onchange=e=>handle(e.target.files[0]);
function handle(f){ if(!f) return; let r=new FileReader(); r.onload=e=>{ let wb=XLSX.read(e.target.result,{type:'binary'}); let d=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]); contacts=d; info.innerHTML=`✅ ${d.length} contactos`; sendBtn.style.display='block'; }; r.readAsBinaryString(f); }
sendBtn.onclick=async()=>{ document.getElementById('progress').style.display='block'; let res=await fetch('/api/campaigns/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contacts,template:'acolbogota'})}); let timer=setInterval(async()=>{ let p=await fetch('/api/campaigns/progress').then(r=>r.json()); document.getElementById('fill').style.width=Math.round(p.enviados/p.total*100)+'%'; document.getElementById('count').innerText=`${p.enviados}/${p.total}`; if(p.estado==='terminado'){clearInterval(timer); document.getElementById('status').innerText='🎉 Terminado';} },1000); };
</script></body></html>
