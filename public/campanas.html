<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO Campañas</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{background:#0b1220;color:#fff;font-family:Arial;padding:15px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0;border:1px solid #334155}
input,select,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff}
button{background:#38bdf8;color:#000;font-weight:900;cursor:pointer}
.muted{color:#94a3b8;font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #334155;padding:6px;font-size:12px}
</style>
</head>
<body>
<h2>KLIDO v119 - AUTO (sin tocar código nunca)</h2>

<div class="card">
<h3>1. Carga Excel con Nombre y Teléfono</h3>
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
<button onclick="leerExcelFIX()">Leer Excel</button>
<div id="infoExcel" class="muted" style="margin-top:6px;color:#22c55e;font-weight:700"></div>
<div id="tablaExcel" style="max-height:300px;overflow:auto"></div>
</div>

<div class="card">
<h3>2. Plantillas APROBADAS (automático de META)</h3>
<button onclick="cargarPlantillasFIX()">🔄 Cargar plantillas aprobadas</button>
<div id="msgWABA" class="muted"></div>
<select id="selectPlantilla" style="margin-top:8px"></select>
<div id="detallePlantilla" class="muted"></div>
<input id="varsExtra" placeholder="Vars extra opcional: deja vacío = toma Nombre del Excel automático" style="margin-top:8px">
</div>

<div class="card">
<h3>3. Enviar</h3>
<input id="nombreCamp" value="Congreso ACOL 2026">
<button id="btnEnviar" onclick="enviarCampanaFIX()">📢 ENVIAR A NUMEROS SELECCIONADOS</button>
<div id="estadoEnvio"></div>
</div>

<div class="card"><h3>Historial</h3><div id="hist"></div></div>

<script>
const token = localStorage.getItem('klido_token');
let contactosFinal = []; // {nombre, phone, selected:true}

async function api(p,m='GET',b){ const o={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}}; if(b) o.body=JSON.stringify(b); const r=await fetch(p,o); const j=await r.json(); console.log('API',p,j); return j; }

function leerExcelFIX(){
  const file = document.getElementById('excelFile').files[0];
  if(!file){ alert('Selecciona tu Excel (9).xlsx'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false});
      console.log('EXCEL ROWS TOTAL', rows.length, rows.slice(0,5));
      contactosFinal = [];
      const seen = new Set();
      let html = '<table><tr><th><input type="checkbox" checked onclick="toggleAll(this.checked)"></th><th>Nombre</th><th>Tel 57</th></tr>';
      for(let i=0;i<rows.length;i++){
        const row = rows[i];
        if(!row || row.length===0) continue;
        // Busca en TODA la fila el valor con más dígitos y el mejor texto
        let phoneCandidate = '';
        let nameCandidate = '';
        for(let c=0;c<row.length;c++){
          let cell = row[c];
          if(cell==null) continue;
          let str = String(cell).trim();
          let digits = str.replace(/\D/g,'');
          // telefono: 10 a 13 digitos
          if(digits.length>=10 && digits.length<=13){
            if(digits.length>phoneCandidate.replace(/\D/g,'').length) phoneCandidate = str;
          }
          // nombre: texto no puro numero, entre 3 y 40 chars
          if(str.length>=3 && str.length<=40 &&!/^\d+$/.test(str.replace(/\s/g,''))){
            // evita que tome encabezado "telefono"
            if(!/telefono|teléfono|phone/i.test(str) || i>0){
              if(str.length>nameCandidate.length) nameCandidate=str;
            }
          }
        }
        if(!phoneCandidate) continue;
        let tel = phoneCandidate.replace(/\D/g,'');
        if(tel.startsWith('0')) tel=tel.substring(1);
        if(tel.length===10) tel='57'+tel;
        if(tel.length===11 && tel.length!==12) { /* deja */ }
        if(tel.length!==12) continue;
        if(seen.has(tel)) continue;
        seen.add(tel);
        const nombreFinal = nameCandidate || 'Cliente';
        contactosFinal.push({nombre:nombreFinal, phone:tel, selected:true});
        if(contactosFinal.length<=100){
          html+=`<tr><td><input type="checkbox" checked onchange="contactosFinal[${contactosFinal.length-1}].selected=this.checked"></td><td>${nombreFinal}</td><td>${tel}</td></tr>`;
        }
      }
      html+='</table>';
      document.getElementById('tablaExcel').innerHTML=html;
      document.getElementById('infoExcel').innerHTML = contactosFinal.length + ' números detectados listos';
      if(contactosFinal.length===0){
        document.getElementById('infoExcel').innerHTML='0 detectados. Abre consola F12 y mandame foto de lo que dice EXCEL ROWS. Tu Excel tiene números?';
      }
    }catch(err){ console.error(err); alert('Error leyendo Excel: '+err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function toggleAll(v){ contactosFinal.forEach(c=>c.selected=v); document.querySelectorAll('#tablaExcel input[type=checkbox]').forEach(cb=>cb.checked=v); }

async function cargarPlantillasFIX(){
  document.getElementById('msgWABA').innerHTML='Cargando...';
  const sel=document.getElementById('selectPlantilla');
  try{
    const res = await api('/api/meta/plantillas');
    sel.innerHTML='';
    let plantillas = [];
    if(res.ok && res.plantillas && res.plantillas.length>0){
      plantillas=res.plantillas;
      document.getElementById('msgWABA').innerHTML=`<span style="color:#22c55e">${plantillas.length} aprobadas cargadas automático</span>`;
    }else{
      // FALLBACK DEFINITIVO - aunque diga No WABA, esta SI existe y SI llega
      document.getElementById('msgWABA').innerHTML=`Error: ${res.error||'No WABA'} - Usando fallback que SI funciona`;
      plantillas=[{name:'acol_invitacion_congreso', language:'es_CO', status:'APPROVED'}];
    }
    plantillas.forEach(p=>{
      const opt=document.createElement('option');
      opt.value=p.name; opt.dataset.lang=p.language||'es_CO';
      opt.textContent=`${p.name} - ${p.language||'es_CO'} - ${p.status||'APPROVED'}`;
      if(p.name==='acol_invitacion_congreso') opt.selected=true;
      sel.appendChild(opt);
    });
    document.getElementById('detallePlantilla').innerHTML='Seleccionada: <b>'+sel.value+'</b> - idioma '+(sel.options[sel.selectedIndex]?.dataset.lang||'es_CO');
    sel.onchange=()=>{ document.getElementById('detallePlantilla').innerHTML='Seleccionada: <b>'+sel.value+'</b> idioma '+sel.options[sel.selectedIndex].dataset.lang; };
  }catch(e){ console.error(e); document.getElementById('msgWABA').innerHTML='Error cargando, usando fallback'; sel.innerHTML='<option value="acol_invitacion_congreso" data-lang="es_CO" selected>acol_invitacion_congreso - es_CO - APROBADA</option>'; }
}

async function enviarCampanaFIX(){
  const seleccionados = contactosFinal.filter(c=>c.selected);
  if(seleccionados.length===0){ alert('0 números detectados - lee el Excel primero'); return; }
  const sel=document.getElementById('selectPlantilla');
  if(!sel.value){ alert('Carga plantilla'); return; }
  const plantilla=sel.value; const idioma=sel.options[sel.selectedIndex].dataset.lang||'es_CO';
  document.getElementById('estadoEnvio').innerHTML='Enviando '+seleccionados.length+' con '+plantilla+'...';
  const res=await api('/api/campanas','POST',{nombre:document.getElementById('nombreCamp').value, plantilla, plantillaIdioma:idioma, lista:seleccionados.map(c=>c.phone), contactos:seleccionados, plantillaVars:document.getElementById('varsExtra').value});
  document.getElementById('estadoEnvio').innerHTML=res.ok?`✅ ${plantilla} lanzada a ${seleccionados.length} - Revisa Railway debe salir ${plantilla} -> 200`:`❌ ${res.error}`;
  cargarHist();
}
async function cargarHist(){ const h=await api('/api/campanas'); document.getElementById('hist').innerHTML=h.slice().reverse().map(c=>`<div style="padding:6px;background:#0f172a;margin:4px 0;border-radius:6px;font-size:12px">${c.nombre} - ${c.plantilla} - ${c.enviados||0}/${c.numeros} - ${c.estado}</div>`).join(''); }
cargarPlantillasFIX(); cargarHist();
</script>
</body>
</html>
