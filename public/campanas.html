<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KLIDO REAL</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#f5f7fb;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.05);max-width:1100px;margin-left:auto;margin-right:auto}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{padding:16px;border-radius:12px;color:#fff;font-weight:bold}.kpi b{font-size:28px;display:block}.total{background:#6c5ce7}.ok{background:#00b894}.send{background:#0984e3}.fail{background:#d63031}#drop{border:2.5px dashed #6c5ce7;padding:30px;text-align:center;border-radius:12px;background:#f8f7ff;cursor:pointer}.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0%;background:#6c5ce7;transition:.3s}table{width:100%;font-size:12px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee}textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:10px 0}.btn{padding:10px 18px;border-radius:8px;border:none;font-weight:bold;cursor:pointer}.btn-p{background:#6c5ce7;color:#fff}</style></head><body>
<div class="card"><h2>🚀 KLIDO CRM - CAMPAÑA REAL</h2><small>Conectado a Cloud API - PHONE_ID: <span id="pid">verificando...</span></small></div>
<div class="card"><div id="drop"><b>📤 Arrastra tu Excel de maestros</b><input type="file" id="file" hidden></div><div id="info" style="margin-top:10px"></div></div>
<div class="card" id="msgCard" style="display:none"><h3>Mensaje de la campaña</h3><textarea id="msgText" rows="4">Hola {{nombre}} 👋 Soy del equipo KLIDO. Te tenemos una invitación especial para tu colegio {{colegio}}. ¿Te interesa que te cuente más?</textarea><small>Usa {{nombre}} y {{colegio}} y se reemplaza automático</small></div>
<div class="card" id="stats" style="display:none"><div class="grid4"><div class="kpi total"><b id="kT">0</b>TOTAL</div><div class="kpi ok"><b id="kV">0</b>VALIDOS</div><div class="kpi send"><b id="kS">0</b>ENVIADOS REAL</div><div class="kpi fail"><b id="kP">0</b>PENDIENTES</div></div><div class="progress"><div class="bar" id="bar"></div></div><button class="btn btn-p" id="start">▶️ INICIAR ENVÍO REAL</button> <button class="btn" id="stop">⏸️ Pausar</button><div id="log" style="margin-top:10px;font-size:12px;max-height:150px;overflow:auto;background:#f8f8f8;padding:10px;border-radius:8px"></div></div>
<div class="card" id="tableC" style="display:none"><div style="max-height:400px;overflow:auto"><table><thead><tr><th>#</th><th>Nombre</th><th>Tel</th><th>Estado</th><th>ID WhatsApp</th></tr></thead><tbody id="tbody"></tbody></table></div></div>
<script>
let contacts=[], sending=false, idx=0;
const drop=document.getElementById('drop'), fileI=document.getElementById('file');
drop.onclick=()=>fileI.click(); drop.ondragover=e=>{e.preventDefault()}; drop.ondrop=e=>{e.preventDefault(); handle(e.dataTransfer.files[0])}; fileI.onchange=e=>handle(e.target.files[0]);
function handle(f){
 const r=new FileReader(); r.onload=e=>{
  const wb=XLSX.read(e.target.result,{type:'array'}); const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  contacts=data.map((row,i)=>{
   const k=Object.keys(row); const nom=row[k.find(x=>x.toLowerCase().includes('nom'))||k[0]]||'';
   let tel=String(row[k.find(x=>x.toLowerCase().includes('tel')||x.toLowerCase().includes('cel')||x.toLowerCase().includes('what'))||k[1]]||'').replace(/\D/g,'');
   if(tel.length>=7 &&!tel.startsWith('57')) tel='57'+tel;
   const col=row[k.find(x=>x.toLowerCase().includes('cole')||x.toLowerCase().includes('insti'))||k[2]]||'';
   return {id:i+1,nombre:nom,tel,colegio:col,estado:'pendiente',waId:''};
  }).filter(c=>c.tel.length>=10);
  document.getElementById('info').innerHTML='✅ '+f.name+' - '+contacts.length+' contactos válidos'; document.getElementById('msgCard').style.display='block'; document.getElementById('stats').style.display='block'; document.getElementById('tableC').style.display='block';
  document.getElementById('kT').innerText=contacts.length; document.getElementById('kV').innerText=contacts.length; document.getElementById('kP').innerText=contacts.length;
  document.getElementById('tbody').innerHTML=contacts.map(c=>`<tr id="r${c.id}"><td>${c.id}</td><td>${c.nombre}</td><td>${c.tel}</td><td id="s${c.id}">${c.estado}</td><td id="w${c.id}"></td></tr>`).join('');
 }; r.readAsArrayBuffer(f);
}
document.getElementById('start').onclick=async()=>{
 if(sending) return; sending=true; idx=0;
 const baseMsg=document.getElementById('msgText').value;
 for(let i=0;i<contacts.length;i++){
  if(!sending) break;
  const c=contacts[i];
  const finalMsg=baseMsg.replace('{{nombre}}',c.nombre).replace('{{colegio}}',c.colegio);
  document.getElementById('s'+c.id).innerText='enviando...';
  try{
   const res=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:c.tel,message:finalMsg})});
   const j=await res.json();
   if(j.ok){c.estado='ENVIADO REAL'; document.getElementById('s'+c.id).innerText='✅ ENVIADO'; document.getElementById('w'+c.id).innerText=j.id; document.getElementById('log').innerHTML+='<div>✅ '+c.nombre+' - '+c.tel+'</div>';}
   else{c.estado='ERROR'; document.getElementById('s'+c.id).innerText='❌ '+(j.error?.error?.message||'Error'); document.getElementById('log').innerHTML+='<div>❌ '+c.nombre+' - '+JSON.stringify(j.error).slice(0,100)+'</div>';}
  }catch(e){document.getElementById('s'+c.id).innerText='❌ Error red';}
  document.getElementById('kS').innerText=i+1; document.getElementById('kP').innerText=contacts.length-(i+1); document.getElementById('bar').style.width=((i+1)/contacts.length*100)+'%';
  await new Promise(r=>setTimeout(r,1500));
 }
 sending=false;
};
document.getElementById('stop').onclick=()=>sending=false;
fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:'',message:''})}).then(r=>r.json()).then(d=>{document.getElementById('pid').innerText=d.error?'Token OK pero faltan datos':'OK'}).catch(()=>document.getElementById('pid').innerText='Verificando...');
</script></body></html>
