<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KLIDO CRM</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#f6f7fb;display:flex;height:100vh;overflow:hidden}
.sidebar{width:68px;background:#111;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px}
.sidebar img.logo{width:36px;height:36px;border-radius:8px;background:#fff;object-fit:contain}
.icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:20px}
.icon.active{background:#fff;color:#111}.online-dot{width:10px;height:10px;background:red;border-radius:50%;border:2px solid #111;margin-top:-8px}
.yellow{background:#FFD600;color:#111!important;font-weight:700}
.chats{width:340px;background:#fff;border-right:1px solid #eee;display:flex;flex-direction:column}
.chats-header{padding:14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee}
.chats-list{overflow:auto;flex:1}
.chat-item{padding:12px 14px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid #f2f2f2;position:relative}
.chat-item:hover{background:#fafafa}.chat-item.active{background:#f0f0f0}
.dot{width:10px;height:10px;background:red;border-radius:50%;position:absolute;right:12px;top:14px}
.avatar{width:42px;height:42px;background:#111;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.main{flex:1;display:flex;flex-direction:column;background:#e5ddd5}
.main-header{padding:12px 16px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:65%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4}
.bubble.yo{align-self:flex-end;background:#dcf8c6;border-bottom-right-radius:4px}
.bubble.cliente{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.bubble img{max-width:240px;border-radius:12px;display:block;margin-top:6px}
.inputbar{padding:12px;background:#fff;display:flex;gap:8px;align-items:center}
.inputbar input{flex:1;padding:12px;border:1px solid #ddd;border-radius:24px}
.btn{padding:10px 16px;border:none;border-radius:20px;cursor:pointer;font-weight:600}
.panel{width:320px;background:#fff;border-left:1px solid #eee;padding:16px;overflow:auto;display:none}
.panel.open{display:block}
audio{width:200px}
</style>
</head>
<body>

<div class="sidebar">
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<div class="icon active" onclick="setTab('bandeja')" title="Bandeja">💬</div>
<div class="online-dot" id="onlineDot"></div>
<div class="icon yellow" onclick="location.href='campanas.html'" title="Campañas">📢</div>
<div class="icon" onclick="setTab('calendario')" title="Recordatorios">📅</div>
<div class="icon" onclick="setTab('admin')" title="Admin">⚙️</div>
<div class="icon" style="margin-top:auto;background:#25D366" onclick="window.open('https://wa.me/573133181851','_blank')" title="Ayuda">💚</div>
</div>

<div class="chats">
<div class="chats-header">
<input id="searchChat" placeholder="Buscar chat..." style="flex:1;padding:10px;border-radius:20px;border:1px solid #ddd">
<select id="empresa_id" style="padding:8px;border-radius:10px"><option value="default">default</option></select>
</div>
<div id="chatsList" class="chats-list"></div>
</div>

<div class="main">
<div class="main-header">
<div id="chatName">Selecciona un chat</div>
<div style="margin-left:auto;display:flex;gap:8px">
<button class="btn" onclick="togglePanel('info')">Segmentar</button>
<button class="btn" onclick="togglePanel('recordatorio')">⏰ Recordatorio</button>
<select id="asignarWorker"></select>
<button class="btn" onclick="asignarChat()">Asignar</button>
</div>
</div>
<div id="messages" class="messages"></div>
<div class="inputbar">
<label style="cursor:pointer">📎<input type="file" id="fileInput" hidden></label>
<input id="msgInput" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter') enviarMensaje()">
<button class="btn" style="background:#111;color:#fff" onclick="enviarMensaje()">Enviar</button>
</div>
</div>

<div id="panelInfo" class="panel">
<h3>Segmentación cliente</h3>
<input id="segEtiqueta" placeholder="Etiqueta Ej: Cliente VIP">
<input id="segNota" placeholder="Nota">
<button class="btn" style="background:#111;color:#fff;width:100%" onclick="guardarSegmentacion()">Guardar</button>
<h3 style="margin-top:20px">Planes</h3>
<div id="planes"></div>
</div>

<div id="panelRecordatorio" class="panel">
<h3>Recordatorio + Notificación</h3>
<input type="datetime-local" id="recFecha">
<textarea id="recTexto" placeholder="Ej: Llamar a cliente seguimiento"></textarea>
<button class="btn" style="background:#111;color:#fff;width:100%" onclick="crearRecordatorio()">Crear recordatorio</button>
<div id="listaRecordatorios" style="margin-top:12px"></div>
</div>

<script>
let empresa_id='default', chatActual=null, chats=[], audioNotif=new Audio('https://cdn.pixabay.com/audio/2022/03/15/audio_0c8c3e1d6f.mp3');

function getEmpresa(){return document.getElementById('empresa_id').value||'default';}

async function cargarChats(){
  empresa_id=getEmpresa();
  const r=await fetch(`/api/chats/${empresa_id}`); chats=await r.json();
  const q=document.getElementById('searchChat').value.toLowerCase();
  const list=document.getElementById('chatsList'); list.innerHTML='';
  chats.filter(c=>!q||c.id.includes(q)).forEach(c=>{
    const div=document.createElement('div'); div.className='chat-item'+(chatActual===c.id?' active':'');
    div.innerHTML=`<div class="avatar">${c.id.slice(-2)}</div><div><b>${c.id}</b><div style="font-size:12px;color:#666">${(c.mensajes?.slice(-1)[0]?.texto||'').slice(0,30)}</div></div>${c.no_leidos>0?`<div class="dot" id="dot-${c.id}"></div>`:''}`;
    div.onclick=()=>abrirChat(c.id); list.appendChild(div);
  });
  if(chats.some(c=>c.no_leidos>0)){ try{audioNotif.play();}catch{} if(Notification.permission==='granted') new Notification('Nuevo mensaje Klido'); }
}

async function abrirChat(id){
  chatActual=id; await fetch('/api/chat/leido',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:getEmpresa(),chat_id:id})});
  document.getElementById('chatName').innerText=id;
  const r=await fetch(`/api/mensajes/${getEmpresa()}/${id}`); const msgs=await r.json();
  const box=document.getElementById('messages'); box.innerHTML='';
  msgs.forEach(m=>{
    const d=document.createElement('div'); d.className='bubble '+(m.from==='yo'?'yo':'cliente');
    let html='';
    if(m.texto) html+=`<div>${m.texto}</div>`;
    if(m.tipo==='image') html+=`<img src="${m.url||''}" onclick="window.open(this.src)">`;
    if(m.tipo==='audio') html+=`<audio controls src="${m.url}"></audio>`;
    if(m.tipo==='document') html+=`<a href="${m.url}" target="_blank">📄 ${m.nombre||'Archivo'}</a>`;
    if(m.tipo==='video') html+=`<video controls src="${m.url}" style="max-width:240px;border-radius:12px"></video>`;
    d.innerHTML=html; box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight; cargarChats();
}

async function enviarMensaje(){
  const texto=document.getElementById('msgInput').value.trim(); if(!texto||!chatActual) return;
  const emp=getEmpresa(); const cfg=await fetch(`/api/empresa/${emp}`).then(r=>r.json());
  // Envía a Meta
  await fetch(`https://graph.facebook.com/v20.0/${cfg.phone}/messages`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${cfg.token}`},body:JSON.stringify({messaging_product:'whatsapp',to:chatActual,type:'text',text:{body:texto}})});
  // Guarda local para historial infinito
  const dbChat=await fetch('/api/chat/enviar-media',{method:'POST'}); // dummy para mantener flujo
  // Guardado local simple
  const r=await fetch(`/api/chats/${emp}`); // recarga
  document.getElementById('msgInput').value='';
  abrirChat(chatActual);
}

document.getElementById('fileInput').addEventListener('change', async e=>{
  const fd=new FormData(); fd.append('file', e.target.files[0]); fd.append('empresa_id', getEmpresa()); fd.append('chat_id', chatActual);
  await fetch('/api/chat/enviar-media',{method:'POST',body:fd}); abrirChat(chatActual);
});

function togglePanel(id){ document.getElementById('panelInfo').classList.remove('open'); document.getElementById('panelRecordatorio').classList.remove('open'); if(id==='info') document.getElementById('panelInfo').classList.toggle('open'); if(id==='recordatorio') document.getElementById('panelRecordatorio').classList.toggle('open'); }
function setTab(t){ if(t==='bandeja') cargarChats(); if(t==='calendario') togglePanel('recordatorio'); if(t==='admin') location.href='campanas.html'; }

async function crearRecordatorio(){
  const fecha=document.getElementById('recFecha').value; const texto=document.getElementById('recTexto').value;
  await fetch('/api/recordatorio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:getEmpresa(),fecha,texto,chat_id:chatActual})});
  alert('Recordatorio creado, enviará notificación'); cargarRecordatorios();
  // Notificación browser
  const diff=new Date(fecha)-new Date(); if(diff>0) setTimeout(()=>{ new Notification('⏰ Recordatorio: '+texto); audioNotif.play(); }, diff);
}
async function cargarRecordatorios(){
  const r=await fetch(`/api/recordatorios/${getEmpresa()}`); const data=await r.json();
  document.getElementById('listaRecordatorios').innerHTML=data.map(rr=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${rr.fecha}</b><br>${rr.texto}<br><small>${rr.chat_id||''}</small></div>`).join('');
}
async function asignarChat(){
  const worker=document.getElementById('asignarWorker').value; if(!worker||!chatActual) return;
  await fetch('/api/chat/asignar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empresa_id:getEmpresa(),chat_id:chatActual,worker_id:worker})}); alert('Chat asignado');
}
async function cargarWorkers(){
  const r=await fetch(`/api/workers/${getEmpresa()}`); const w=await r.json();
  document.getElementById('asignarWorker').innerHTML=w.map(x=>`<option value="${x.id}">${x.nombre||x.id}</option>`).join('');
}
async function cargarPlanes(){ const r=await fetch('/api/planes'); const p=await r.json(); document.getElementById('planes').innerHTML=p.map(pl=>`<div style="padding:10px;border:1px solid #eee;border-radius:12px;margin:6px 0"><b>${pl.nombre}</b> ${pl.precio}<br><a href="${pl.wa}" target="_blank" style="background:#25D366;color:#fff;padding:6px 10px;border-radius:20px;text-decoration:none;display:inline-block;margin-top:6px">Comprar por WPP</a></div>`).join(''); }

setInterval(cargarChats, 3000);
document.getElementById('empresa_id').addEventListener('change', ()=>{cargarChats();cargarWorkers();cargarRecordatorios();cargarPlanes();});
cargarChats();cargarWorkers();cargarRecordatorios();cargarPlanes();
if(Notification.permission!=='granted') Notification.requestPermission();
</script>
</body>
</html>
