

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// v131 - LEE TODOS LOS NUMEROS SIN IMPORTAR ORDEN
async function leerExcel(e){
 const file=e.target.files[0]; if(!file) return;
 const preview=document.getElementById('previewNums');
 preview.innerHTML='⏳ Leyendo Excel de prueba... extrayendo todos los números sin importar orden';
 try{
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  let lista=[];

  function telefonoRealColombia(celda){
    if(celda==null || celda==='') return null;
    let valor = celda;
    // Si Excel lo guardó como 3226536669.0 (float con.0) -> trunca
    if(typeof valor==='number'){
      valor = Math.trunc(valor);
    }
    // Si viene como "3226536669.0" string -> quita.0
    let str = String(valor).trim();
    if(str.includes('.')){
      str = str.split('.')[0]; // 3226536669.0 -> 3226536669
    }
    let d = str.replace(/\D/g,'');
    if(!d) return null;
    d = d.replace(/^0+/,''); // quita ceros iniciales
    // Maneja el bug del.0 que duplica: 32265366690 (11 dígitos termina en 0)
    if(d.length===11 && d.endsWith('0') && d.slice(0,10).startsWith('3')){
      d = d.slice(0,10);
    }
    if(d.length===13 && d.endsWith('0') && d.slice(0,12).startsWith('57')){
      d = d.slice(0,12);
    }
    // Valida Colombia
    if(d.length===10 && d.startsWith('3')) return '57'+d; // 3226536669 -> 573226536669
    if(d.length===12 && d.startsWith('57') && d[2]==='3') return d; // 573226536669
    return null;
  }

  wb.SheetNames.forEach(nombreHoja=>{
    const hoja = wb.Sheets[nombreHoja];
    const filas = XLSX.utils.sheet_to_json(hoja,{header:1, defval:'', raw:true});
    console.log(`Hoja ${nombreHoja}: ${filas.length} filas`, filas.slice(0,5));
    filas.forEach(fila=>{
      fila.forEach(celda=>{
        let tel = telefonoRealColombia(celda);
        if(tel) lista.push(tel);
      });
    });
  });

  lista=[...new Set(lista)]; // únicos
  numerosExcel=lista;

  if(lista.length>0){
    preview.innerHTML=`<b style="color:#16a34a">✅ ${lista.length} números detectados (sin importar orden ni columna)</b>
      <div style="margin-top:8px;max-height:200px;overflow:auto;background:#f0fdf4;border:1px solid #bbf7d0;padding:10px;border-radius:12px;font-size:12px;word-break:break-all">
        ${lista.join(', ')}
      </div>
      <div style="font-size:10px;color:#64748b;margin-top:6px">Archivo: ${file.name} - Leyó TODAS las hojas y columnas - Convirtió 3226536669.0 -> 573226536669 automáticamente</div>`;
  } else {
    preview.innerHTML=`<div style="background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:12px;font-size:11px;color:#991b1b">
      ❌ 0 números. Datos leídos: ${JSON.stringify(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).slice(0,5)).substring(0,600)}
    </div>`;
  }

 }catch(err){
  preview.innerHTML=`<span style="color:#ef4444">Error: ${err.message}</span>`;
  console.error(err);
 }
}
</script>
