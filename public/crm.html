<script>
let token=localStorage.getItem('token'); let user=JSON.parse(localStorage.getItem('user')||'{}');
if(!token) location.href='/index.html?v=112';
document.getElementById('agInfo').innerHTML=`<b style="color:#fff">${user.nombre||'ACOL'}</b><br>${user.email||''}<br>WA: ${user.waPhoneId||'1338474282683914'} - ACOL BASICO`;
let all=[], sel=null;
function api(p,o={}){o.headers=o.headers||{};o.headers['Authorization']='Bearer '+token;if(o.body&&!(o.body instanceof FormData))o.headers['Content-Type']='application/json';return fetch(p,o)}
async function cargar(){const r=await api('/api/mensajes'); all=await r.json(); document.getElementById('cTotal').textContent=all.length; render(); }
function render(){
const c=document.getElementById('content');
c.innerHTML=`<div class="listPane"><div style="padding:8px;border-bottom:1px solid #e2e8f0;display:flex;gap:6px"><input id="q" class="input" placeholder="Buscar número..." oninput="renderList()"><button class="btn" style="padding:8px 10px;font-size:11px;background:#fff;color:#0b1a3a;border:1px solid #CBD9F0" onclick="renderList()">Todos</button></div><div id="list" style="flex:1;overflow:auto"></div></div>
<div class="chatPane"><div id="head" style="padding:12px;background:#fff;border-bottom:1px solid #CBD9F0;font-weight:800;font-size:12px">${sel?sel:'Selecciona un chat para ver fotos/audios/videos'}</div><div id="msgs" class="msgs"><div style="color:#64748b;text-align:center;margin-top:40px;font-size:11px">Tus mensajes se verán como mensajes. Los archivos que te envíen se ven aquí.</div></div>
<div class="inputArea"><input id="file" type="file" style="display:none"><button class="btn" style="background:#fff;color:#0b1a3a;border:1px solid #CBD9F0" onclick="document.getElementById('file').click()">📎</button><select id="tipo" style="padding:9px;border-radius:12px;border:1px solid #CBD9F0;font-size:11px"><option value="texto">Texto</option><option value="foto">Foto</option><option value="audio">Audio</option><option value="video">Video</option><option value="archivo">Archivo</option></select><input id="txt" class="input" placeholder="Escribe mensaje para contestar..."><button class="btn" onclick="enviar()">Enviar</button></div></div>`;
renderList(); if(sel) abrir(sel);
}
function renderList(){
const q=document.getElementById('q')?.value?.toLowerCase()||''; let map={};
all.filter(m=>!q||(m.numero||'').includes(q)).forEach(m=>{if(!map[m.numero]) map[m.numero]=[]; map[m.numero].push(m);});
let chats=Object.keys(map).map(num=>{const arr=map[num].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)); return {num, last:arr[arr.length-1], count:arr.length, unread:arr.filter(x=>!x.leido).length, arr}}).sort((a,b)=>new Date(b.last.timestamp)-new Date(a.last.timestamp));
document.getElementById('list').innerHTML=chats.map(ch=>`<div class="chatItem ${sel===ch.num?'active':''} ${ch.unread?'unread':''}" onclick="sel='${ch.num}';renderList();abrir('${ch.num}')"><div><div style="font-weight:800;font-size:12px">${ch.num}</div><div class="c-last">${(ch.last.texto|| (ch.last.mediaUrl?'📎 '+(ch.last.mediaType||'archivo') : ''))||''}</div><div style="font-size:9px;color:#94a3b8">${new Date(ch.last.timestamp).toLocaleString()}</div></div><div><span class="badge">${ch.count}</span>${ch.unread?`<div style="background:#ef4444;color:#fff;font-size:9px;padding:2px 6px;border-radius:10px;margin-top:4px;text-align:center">${ch.unread}</div>`:''}</div></div>`).join('')||'<div style="padding:20px;color:#94a3b8;font-size:11px">Sin chats</div>';
}
function abrir(num){
const arr=all.filter(m=>m.numero===num).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
document.getElementById('head').innerHTML=num+' - '+arr.length+' mensajes';
document.getElementById('msgs').innerHTML=arr.map(m=>{
let texto = m.texto||'';
if(texto.includes('mensaje.txt')) texto = ''; // limpia basura vieja
let media='';
if(m.mediaUrl){
const url=m.mediaUrl;
if(m.mediaType==='foto' || url.match(/\.(jpg|jpeg|png|webp)$/i)) media=`<img src="${url}" style="max-width:260px;border-radius:12px;margin-top:8px;cursor:pointer" onclick="window.open('${url}','_blank')">`;
else if(m.mediaType==='audio' || url.match(/\.(mp3|ogg|m4a|wav|opus)$/i)) media=`<audio controls src="${url}" style="width:240px;margin-top:8px"></audio>`;
else if(m.mediaType==='video' || url.match(/\.(mp4|webm|mov)$/i)) media=`<video controls src="${url}" style="max-width:260px;border-radius:12px;margin-top:8px"></video>`;
else media=`<div style="margin-top:8px"><a href="${url}" target="_blank" style="color:#2563eb;font-weight:800;text-decoration:underline">📎 Ver archivo</a></div>`;
}
return `<div class="msg ${m.direccion==='outbound'?'me':''}"><div style="font-size:9px;opacity:.6;margin-bottom:2px">${new Date(m.timestamp).toLocaleTimeString()} ${m.kanban?'• '+m.kanban:''}</div>${texto?`<div>${texto}</div>`:''}${media}</div>`;
}).join('');
const el=document.getElementById('msgs'); el.scrollTop=el.scrollHeight;
}
async function enviar(){
const txt=document.getElementById('txt').value.trim();
const fileInput=document.getElementById('file');
const file=fileInput.files[0];
if(!sel) return alert('Selecciona chat');
if(file){
// archivo real -> media
const fd=new FormData();
fd.append('file',file);
fd.append('numero',sel);
fd.append('tipo',document.getElementById('tipo').value);
await api('/api/mensajes/media',{method:'POST',body:fd});
}else{
if(!txt) return;
// texto real -> enviar como mensaje, NO como archivo
await api('/api/mensajes/enviar',{method:'POST',body:JSON.stringify({numero:sel,texto:txt})});
}
document.getElementById('txt').value=''; fileInput.value='';
await cargar(); abrir(sel);
}
cargar(); setInterval(cargar,6000);
</script></body></html>
