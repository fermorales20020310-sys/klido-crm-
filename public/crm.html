<div style="background:#020617;min-height:100vh;color:white;font-family:Inter">
  <header style="padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b">
    <div style="display:flex;align-items:center;gap:12px"><img src="/logo.png" style="width:36px;height:36px;border-radius:8px"><span style="font-weight:900;letter-spacing:1px">KLIDO</span><span id="planBadge" style="background:#6366f1;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800"></span></div>
    <a id="btnWppPlan" href="https://wa.me/573133181851?text=Hola%20KLIDO%20quiero%20renovar%20mi%20plan" target="_blank" style="background:#25D366;color:white;padding:10px 16px;border-radius:999px;font-weight:800;display:flex;gap:6px;align-items:center;text-decoration:none"><i>◉</i> Soporte 3133181851</a>
  </header>

  <div id="apiPanel" style="margin:20px;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:20px">
    <h3 style="font-weight:900">🔌 API WhatsApp - Pégala 1 vez y queda autónoma</h3>
    <div id="apiStatus" style="margin-top:12px;padding:12px;border-radius:12px;background:#020617;font-size:12px"></div>
    <input id="cfg_phone" placeholder="Phone ID" style="width:100%;margin-top:12px;padding:12px;background:#020617;border:1px solid #1e293b;border-radius:10px;color:white">
    <input id="cfg_waba" placeholder="WABA ID" style="width:100%;margin-top:8px;padding:12px;background:#020617;border:1px solid #1e293b;border-radius:10px;color:white">
    <input id="cfg_token" placeholder="Token EAAT..." style="width:100%;margin-top:8px;padding:12px;background:#020617;border:1px solid #1e293b;border-radius:10px;color:white">
    <button onclick="guardarAPI()" style="width:100%;margin-top:12px;padding:12px;background:#6366f1;color:white;border-radius:12px;font-weight:800">💾 Guardar API Autónoma</button>
  </div>

  <div id="bandeja" style="margin:20px;display:grid;grid-template-columns:320px 1fr;gap:16px">
    <div style="background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:12px"><h4 style="font-weight:800">Chats <span id="amarillosCount" style="background:#fef08a;color:#854d0e;padding:2px 8px;border-radius:999px;font-size:10px">0 amarillos</span></h4><div id="listaClientes"></div></div>
    <div style="background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:12px"><div id="chatBox"></div><div id="datosCliente" style="margin-top:12px;border-top:1px solid #1e293b;padding-top:12px"><input id="cli_nombre" placeholder="Nombre cliente" style="width:100%;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white"><select id="cli_etiqueta" style="width:100%;margin-top:8px;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white"><option value="nuevo">Nuevo</option><option value="respuesta_campana">Respuesta Campaña (Amarilla)</option><option value="caliente">Caliente</option><option value="vendido">Vendido</option></select><input id="cli_recordatorio" type="datetime-local" style="width:100%;margin-top:8px;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white"><button onclick="guardarDatosCliente()" style="width:100%;margin-top:8px;padding:10px;background:#16a34a;border-radius:8px;font-weight:800">Guardar datos + Alarma</button></div></div>
  </div>
</div>
