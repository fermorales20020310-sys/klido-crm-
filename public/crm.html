<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>KLIDO Panel CRM</title>
  <style>
    :root { --sidebar-w: 240px; --primary: #0b1a3a; --bg: #f1f5f9; }
    body { font-family: sans-serif; margin:0; display:flex; height: 100vh; background: var(--bg); }
    aside { width: var(--sidebar-w); background: var(--primary); color: white; padding: 20px; display:flex; flex-direction:column; justify-content:space-between; }
    main { flex: 1; padding: 20px; overflow-y: auto; }
    .menu-item { padding: 12px; color: #cbd5e1; cursor: pointer; border-radius: 6px; margin-bottom: 6px; }
    .menu-item.active, .menu-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .inbox-container { display: flex; height: calc(100vh - 80px); background: white; border-radius: 8px; border: 1px solid #cbd5e1; }
    .chat-list { width: 320px; border-right: 1px solid #cbd5e1; overflow-y: auto; }
    .chat-item { padding: 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; position: relative; }
    .chat-item:hover { background: #f8fafc; }
    .badge-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; position: absolute; right: 15px; top: 18px; }
    .badge-red { background: #ef4444; }
    .badge-yellow { background: #f59e0b; }
    .chat-view { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .messages-box { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 60%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
    .msg.inbound { background: #f1f5f9; align-self: flex-start; }
    .msg.outbound { background: #0b1a3a; color: white; align-self: flex-end; }
    .chat-input { padding: 15px; border-top: 1px solid #cbd5e1; display: flex; gap: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <aside>
    <div>
      <h2 style="margin: 0 0 20px 0;">KLIDO CRM</h2>
      <div class="menu-item active" onclick="verModulo('inbox')">📥 Bandeja Inbox</div>
      <div class="menu-item" onclick="verModulo('campanas')">🚀 Campañas Excel</div>
      <div class="menu-item" onclick="verModulo('metricas')">📊 Métricas / Equipo</div>
      <div class="menu-item" onclick="verModulo('calendario')">📅 Calendario</div>
      <div id="btnGerente" class="menu-item hidden" onclick="verModulo('gerente')">👑 Panel Gerencia</div>
    </div>
    <div>
      <div id="userInfo" style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;"></div>
      <button onclick="cerrarSesion()" style="width:100%; padding:8px; background:#ef4444; color:white; border:none; border-radius:4px; cursor:pointer;">Cerrar Sesión</button>
    </div>
  </aside>

  <main>
    <!-- MODULO INBOX -->
    <section id="modInbox" class="inbox-container">
      <div class="chat-list" id="listaChats"></div>
      <div class="chat-view">
        <div id="headerChat" style="padding: 15px; border-bottom: 1px solid #cbd5e1; font-weight: bold;">Selecciona un chat</div>
        <div class="messages-box" id="boxMensajes"></div>
        <div class="chat-input">
          <input type="text" id="txtMensaje" placeholder="Escribe un mensaje..." style="flex:1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px;">
          <button onclick="enviarMensaje()" style="padding: 10px 20px; background: #0b1a3a; color: white; border: none; border-radius: 4px; cursor: pointer;">Enviar</button>
        </div>
      </div>
    </section>

    <!-- MODULO CAMPAÑAS -->
    <section id="modCampanas" class="hidden" style="background: white; padding: 30px; border-radius: 8px;">
      <h2>Envío Masivo de Campañas</h2>
      <p>Sube tu archivo Excel con números telefónicos para seleccionar automáticamente y enviar plantillas homologadas.</p>
      <input type="file" id="fileExcel" accept=".xlsx, .xls">
      <button onclick="subirExcel()" style="padding: 10px 20px; background: #0b1a3a; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">Cargar y Enviar</button>
    </section>

    <!-- MODULO GERENCIA GENERAL -->
    <section id="modGerente" class="hidden" style="background: white; padding: 30px; border-radius: 8px;">
      <h2>Panel Gerencia Avanza Consulting</h2>
      <div id="tablaAgencias"></div>
    </section>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('klido_user') || '{}');
    const token = localStorage.getItem('klido_token');
    let chatActivo = null;

    if (!token) window.location.href = '/index.html';

    document.getElementById('userInfo').innerText = `${user.nombre} (${user.rol})\nPlan: ${user.plan.toUpperCase()}`;
    if (user.rol === 'super') document.getElementById('btnGerente').classList.remove('hidden');

    function verModulo(mod) {
      document.getElementById('modInbox').classList.add('hidden');
      document.getElementById('modCampanas').classList.add('hidden');
      document.getElementById('modGerente').classList.add('hidden');

      if(mod === 'inbox') document.getElementById('modInbox').classList.remove('hidden');
      if(mod === 'campanas') document.getElementById('modCampanas').classList.remove('hidden');
      if(mod === 'gerente') {
        document.getElementById('modGerente').classList.remove('hidden');
        cargarAgenciasGerencia();
      }
    }

    async function cargarChats() {
      const res = await fetch('/api/mensajes', { headers: { 'Authorization': `Bearer ${token}` } });
      const msgs = await res.json();
      const list = document.getElementById('listaChats');
      list.innerHTML = '';

      msgs.forEach(m => {
        const div = document.createElement('div');
        div.className = 'chat-item';
        let dot = '';
        if(m.etiquetaPunto === 'rojo') dot = '<span class="badge-dot badge-red"></span>';
        if(m.etiquetaPunto === 'amarillo') dot = '<span class="badge-dot badge-yellow"></span>';

        div.innerHTML = `<strong>${m.nombre || m.numero}</strong><br><small style="color:#64748b">${m.texto.substring(0,30)}...</small>${dot}`;
        div.onclick = () => abrirChat(m);
        list.appendChild(div);
      });
    }

    function abrirChat(chat) {
      chatActivo = chat;
      document.getElementById('headerChat').innerText = `Chat con: ${chat.nombre || chat.numero}`;
      const box = document.getElementById('boxMensajes');
      box.innerHTML = `<div class="msg ${chat.direccion}">${chat.texto}</div>`;
      
      // Marcar leido
      fetch('/api/mensajes/leer', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: chat.id })
      });
    }

    async function enviarMensaje() {
      const texto = document.getElementById('txtMensaje').value;
      if(!texto || !chatActivo) return;

      const res = await fetch('/api/mensajes/enviar', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero: chatActivo.numero, texto })
      });

      if(res.ok) {
        document.getElementById('txtMensaje').value = '';
        const box = document.getElementById('boxMensajes');
        box.innerHTML += `<div class="msg outbound">${texto}</div>`;
      }
    }

    async function cargarAgenciasGerencia() {
      const res = await fetch('/api/gerente/agencias', { headers: { 'Authorization': `Bearer ${token}` } });
      const agencias = await res.json();
      let html = '<table border="1" width="100%" cellpadding="10"><tr><th>Empresa</th><th>Email</th><th>Plan</th><th>Estado</th><th>Acciones</th></tr>';
      
      agencias.forEach(a => {
        html += `<tr>
          <td>${a.nombre}</td>
          <td>${a.email}</td>
          <td>${a.plan.toUpperCase()}</td>
          <td>${a.estado}</td>
          <td><button onclick="bloquearAgencia('${a.id}', ${a.estado !== 'bloqueada'})">${a.estado === 'bloqueada' ? 'Desbloquear' : 'Bloquear'}</button></td>
        </tr>`;
      });
      html += '</table>';
      document.getElementById('tablaAgencias').innerHTML = html;
    }

    async function bloquearAgencia(agenciaId, bloquear) {
      await fetch('/api/gerente/bloquear', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ agenciaId, bloquear })
      });
      cargarAgenciasGerencia();
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    cargarChats();
  </script>
</body>
</html>
