<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO - Campañas</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#f6f7f5; display:flex; justify-content:center; padding:40px 20px;}
.card{background:white; border-radius:20px; padding:30px; width:100%; max-width:600px; box-shadow:0 10px 30px rgba(0,0,0,0.05);}
.header{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.logo{display:flex; align-items:center; gap:10px; font-weight:900; font-size:20px;}
.badge{background:#e8f5e9; color:#2e7d32; padding:5px 12px; border-radius:20px; font-size:12px;}
.drop{border:2px dashed #e0e0e0; border-radius:16px; padding:40px 20px; text-align:center; margin:20px 0; cursor:pointer; transition:0.2s;}
.drop.dragover{border-color:black; background:#fafafa;}
.list{max-height:200px; overflow-y:auto; background:#fafafa; border-radius:10px; padding:15px; font-size:13px; margin:15px 0;}
.btn{width:100%; background:black; color:white; border:none; padding:16px; border-radius:30px; font-weight:bold; font-size:16px; cursor:pointer; transition:0.2s;}
.btn:disabled{opacity:0.5;}
.progress{height:8px; background:#eee; border-radius:10px; margin-top:15px; overflow:hidden;}
.bar{height:100%; width:0%; background:black; transition:width 0.3s;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo"><div style="background:black; color:white; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;">K</div> KLIDO</div>
    <div class="badge">2000/día | acolbogota</div>
  </div>
  <p style="color:#888; font-size:14px;">Carga tu Excel y envía 600 hoy</p>

  <div class="drop" id="drop"> <div style="font-size:30px;">📊</div> <b>Arrastra tu Excel de 600 aquí</b><br><small style="color:#999;">Base_de_datos_maestros_colombia_2025_1_1.xlsx</small></div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">

  <div style="display:flex; justify-content:space-between; font-size:13px;">
    <b>Listos: <span id="totalCount" style="color:#1976d2;">0</span></b>
    <span id="info" style="color:#999;">Detectados 0 | Se enviarán 0 hoy</span>
  </div>

  <div class="list" id="preview">Aún no has cargado Excel...</div>
  <button class="btn" id="sendBtn" disabled>Enviar campaña</button>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div id="status" style="text-align:center; font-size:13px; margin-top:10px; color:#666;"></div>
</div>

<script>
let contactos = [];
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');

drop.onclick = () => fileInput.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('dragover'); }
drop.ondragleave = () => drop.classList.remove('dragover');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); }
fileInput.onchange = (e) => handleFile(e.target.files[0]);

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet);

    contactos = json.map(r => {
      const keys = Object.keys(r);
      const telKey = keys.find(k => k.toLowerCase().includes('telef') || k.toLowerCase().includes('whatsapp')) || 'TELEFONO';
      const nomKey = keys.find(k => k.toLowerCase().includes('nombre')) || Object.keys(r)[1];
      return { nombre: r[nomKey], WHATSAPP: r[telKey], TELEFONO: r[telKey] };
    }).filter(c => c.WHATSAPP && String(c.WHATSAPP).length >= 7);

    // Toma solo 600 hoy
    const paraHoy = contactos.slice(0,600);
    document.getElementById('totalCount').innerText = contactos.length;
    document.getElementById('info').innerText = `Detectados ${contactos.length} | Se enviarán ${Math.min(600,contactos.length)} hoy`;
    document.getElementById('preview').innerHTML = paraHoy.map(c=>`• ${c.nombre} - ${c.WHATSAPP}`).join('<br>');
    contactos = paraHoy; // solo los 600
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendBtn').innerText = `🚀 Enviar campaña (${contactos.length})`;
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('sendBtn').onclick = async () => {
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerText = 'Enviando...';

  // ENVÍA Y RESPONDE AL SEGUNDO (ya no da 499)
  const res = await fetch('/api/campaigns/send', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ contacts: contactos, template: 'acolbogota' })
  });
  const data = await res.json();

  if(data.ok){
    document.getElementById('status').innerText = '🚀 Enviando en segundo plano, no cierres...';
    // Empieza a preguntar el progreso cada 1 seg
    const interval = setInterval(async () => {
      const p = await fetch('/api/campaigns/progress').then(r=>r.json());
      document.getElementById('bar').style.width = (p.enviados/p.total*100)+'%';
      btn.innerText = `Enviando ${p.enviados}/${p.total}...`;
      document.getElementById('status').innerText = `✅ ${p.enviados} enviados | ❌ ${p.errores} errores`;
      if(p.estado === 'terminado'){
        clearInterval(interval);
        btn.innerText = `✅ ${p.enviados} Enviados`;
        btn.disabled = false;
        document.getElementById('status').innerText = '🎉 ¡Campaña terminada!';
        document.getElementById('bar').style.width = '100%';
      }
    }, 1000);
  }
};
</script>
</body>
</html>
