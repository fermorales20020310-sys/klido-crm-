<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLIDO - Campañas</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#f6f7f5; display:flex; justify-content:center; padding:20px;}
.card{background:white; border-radius:20px; padding:25px; width:100%; max-width:600px;}
.drop{border:2px dashed #e0e0e0; border-radius:16px; padding:35px; text-align:center; margin:15px 0; cursor:pointer;}
.list{max-height:180px; overflow-y:auto; background:#fafafa; border-radius:10px; padding:12px; font-size:13px;}
.btn{width:100%; background:black; color:white; border:none; padding:16px; border-radius:30px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:15px;}
.bar-bg{height:8px; background:#eee; border-radius:10px; margin-top:12px; overflow:hidden;}
.bar{height:100%; width:0%; background:black; transition:width 0.4s;}
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; justify-content:space-between;"><b>KLIDO</b><span style="background:#e8f5e9; padding:4px 10px; border-radius:15px; font-size:11px;">2000/día | acolbogota</span></div>
  <p style="color:#888; font-size:13px;">Carga tu Excel y envía 600 hoy</p>
  <div class="drop" id="drop">📊<br><b>Arrastra tu Excel de 600 aquí</b><br><small>Base_de_datos_maestros...</small></div>
  <input type="file" id="fileInput" style="display:none" accept=".xlsx">
  <div style="display:flex; justify-content:space-between; font-size:12px;"><b>Listos: <span id="totalCount">0</span></b><span id="info"></span></div>
  <div class="list" id="preview">Sin archivo...</div>
  <button class="btn" id="sendBtn" disabled>Enviar campaña</button>
  <div class="bar-bg"><div class="bar" id="bar"></div></div>
  <div id="status" style="text-align:center; font-size:13px; margin-top:8px;"></div>
</div>
<script>
let contactos = [];
const drop=document.getElementById('drop'), fileInput=document.getElementById('fileInput');
drop.onclick=()=>fileInput.click();
drop.ondragover=e=>{e.preventDefault(); drop.style.borderColor='black';}
drop.ondrop=e=>{e.preventDefault(); handleFile(e.dataTransfer.files[0]);}
fileInput.onchange=e=>handleFile(e.target.files[0]);

function handleFile(file){
  const r=new FileReader();
  r.onload=e=>{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    contactos=json.map(row=>{
      const k=Object.keys(row); const t=k.find(x=>x.toLowerCase().includes('telef')||x.toLowerCase().includes('whats'))||k[3];
      const n=k.find(x=>x.toLowerCase().includes('nombre'))||k[1];
      return {nombre:row[n], WHATSAPP:String(row[t]||'').replace(/\D/g,'')};
    }).filter(c=>c.WHATSAPP.length>=10).slice(0,600);
    document.getElementById('totalCount').innerText=contactos.length;
    document.getElementById('info').innerText=`Se enviarán ${contactos.length} hoy`;
    document.getElementById('preview').innerHTML=contactos.map(c=>`• ${c.nombre} - ${c.WHATSAPP}`).join('<br>');
    const b=document.getElementById('sendBtn'); b.disabled=false; b.innerText=`🚀 Enviar campaña (${contactos.length})`;
  }; r.readAsArrayBuffer(file);
}

document.getElementById('sendBtn').onclick=async()=>{
  const btn=document.getElementById('sendBtn');
  btn.disabled=true; btn.innerText='Iniciando...';
  const res=await fetch('/api/campaigns/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contacts:contactos, template:'acolbogota'})});
  const d=await res.json();
  if(!d.ok){ btn.innerText='Error'; return; }
  document.getElementById('status').innerText='Enviando en segundo plano...';
  const iv=setInterval(async()=>{
    try{
      const p=await fetch('/api/campaigns/progress').then(r=>r.json());
      const env = p.enviados?? p.sent?? 0;
      const tot = p.total?? contactos.length;
      const pct = tot>0? (env/tot*100) : 0;
      document.getElementById('bar').style.width=pct+'%';
      btn.innerText=`Enviando ${env}/${tot}...`;
      document.getElementById('status').innerText=`✅ ${env} de ${tot} enviados`;
      if(p.estado==='terminado' || env>=tot){ clearInterval(iv); btn.innerText=`✅ ${env} Enviados`; btn.disabled=false; document.getElementById('status').innerText='🎉 ¡Campaña terminada!'; document.getElementById('bar').style.width='100%'; }
    }catch(e){}
  },1000);
};
</script>
</body>
</html>
