<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Campañas KLIDO</title><style>body{font-family:Arial;background:#f5f7fb;padding:20px}.card{max-width:650px;margin:30px auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}h1{color:#2d3436}#drop{border:2px dashed #6c5ce7;padding:50px;text-align:center;border-radius:12px;background:#f8f7ff;cursor:pointer}</style></head><body><div class="card"><h1>📢 Campañas KLIDO - ONLINE ✅</h1><div id="drop">Arrastra tu Excel aquí<br><small>o clic para seleccionar</small><input type="file" id="file" hidden></div><div id="out" style="margin-top:20px;font-weight:bold"></div></div><script>const d=document.getElementById('drop'),f=document.getElementById('file'),o=document.getElementById('out');d.onclick=()=>f.click();f.onchange=e=>{o.innerHTML='✅ '+e.target.files[0].name+' cargado'};</script></body></html>
